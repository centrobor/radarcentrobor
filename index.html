<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="robots" content="noindex">
    <title>Radar Centrobor - Login</title>
    <link rel="icon" type="image/png" href="img/radar-centrobor-logo_fundo_transparente.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body {
            background: url('https://acrelnet.com.br/wp-content/uploads/2020/11/2013.jpg') center/cover fixed no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 40, 60, 0.75);
            backdrop-filter: blur(2px);
            pointer-events: none;
            z-index: 0;
        }
        .login-wrapper {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px 32px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
        }
        .login-logo {
            width: 72px; height: 72px;
            border-radius: 50%; object-fit: cover;
            background: white; margin: 0 auto 16px;
            display: block; border: 3px solid white;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .login-title {
            font-size: 1.8rem; font-weight: 700; color: #1a2c3e;
            margin-bottom: 6px; letter-spacing: -0.5px;
        }
        .login-subtitle {
            font-size: 0.85rem; color: #5e6f82;
            margin-bottom: 32px; font-weight: 400;
        }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: #2a3d54; margin-bottom: 6px; letter-spacing: 0.3px;
        }
        .input-field { position: relative; display: flex; align-items: center; }
        .input-field i {
            position: absolute; left: 18px; color: #8c9bae;
            font-size: 1rem; transition: 0.2s;
        }
        .input-field input {
            width: 100%; padding: 14px 18px 14px 48px;
            background: rgba(240, 244, 250, 0.8);
            border: 1.5px solid rgba(200, 210, 225, 0.8);
            border-radius: 50px; font-size: 0.95rem; font-weight: 500;
            color: #1a2c3e; transition: all 0.25s; outline: none;
        }
        .input-field input:focus {
            border-color: #1e5a7a; background: white;
            box-shadow: 0 0 0 4px rgba(30, 90, 122, 0.08);
        }
        .login-btn {
            width: 100%; padding: 14px; background: #1e5a7a; color: white;
            border: none; border-radius: 50px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: all 0.25s; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            letter-spacing: 0.5px;
        }
        .login-btn:hover {
            background: #16425c; transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 90, 122, 0.3);
        }
        .status-msg {
            margin-top: 16px; font-size: 0.8rem; font-weight: 500; display: none;
            align-items: center; justify-content: center; gap: 6px;
            padding: 8px 16px; border-radius: 30px;
            background: rgba(255, 235, 235, 0.8); color: #b32d2d;
        }
        .status-msg.success { background: rgba(235, 255, 240, 0.8); color: #1e6f43; }
        .help-links { margin-top: 24px; font-size: 0.78rem; color: #6c7a89; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
        .help-links a { color: #1e5a7a; text-decoration: none; font-weight: 600; }
        .login-footer { position: relative; z-index: 1; margin-top: 30px; text-align: center; color: rgba(255,255,255,0.8); font-size: 0.7rem; }

        /* ===== MODAL DE SESSÃO ===== */
        .session-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
            z-index: 2000; display: none; align-items: center; justify-content: center;
        }
        .session-overlay.active { display: flex; }
        .session-modal {
            background: white; border-radius: 28px; padding: 32px 28px;
            max-width: 400px; width: 90%; text-align: center;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
            animation: fadeInUp 0.4s ease;
        }
        .session-modal i { font-size: 3rem; margin-bottom: 16px; }
        .session-modal h2 { font-size: 1.5rem; margin-bottom: 8px; color: #1a2c3e; }
        .session-modal p { font-size: 0.9rem; color: #5e6f82; margin-bottom: 20px; }
        .session-modal .btn-ok {
            background: #1e5a7a; color: white; border: none;
            border-radius: 50px; padding: 12px 32px; font-weight: 700;
            cursor: pointer; font-size: 0.95rem; transition: 0.2s;
        }
        .session-modal .btn-ok:hover { background: #16425c; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(30,90,122,0.3); }
        .session-timer { font-size: 0.75rem; color: #64748b; margin-top: 12px; }

        /* ===== JORNAL ===== */
        .news-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(12px);
            z-index: 1000; display: none; align-items: center; justify-content: center;
        }
        .news-overlay.active { display: flex; }
        .news-paper {
            background: #ffffff; border-radius: 32px;
            width: 80vw; height: 80vh; max-width: 1100px; max-height: 800px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.2);
            overflow: hidden; display: flex; flex-direction: column;
            animation: fadeInUp 0.4s ease;
        }
        .news-head {
            background: linear-gradient(135deg, #1e3a5f 0%, #17304d 100%);
            color: #fff; padding: 18px 28px; display: flex; align-items: center; gap: 14px;
            border-bottom: 3px solid #1a8a50; font-size: 1.1rem;
        }
        .news-head i { font-size: 1.8rem; background: rgba(26,138,80,0.15); padding: 10px; border-radius: 14px; color: #1a8a50; }
        .news-head h2 { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.3px; }
        .news-subhead { margin-left: auto; font-size: 0.85rem; color: #cbd5e1; font-weight: 500; }
        .news-body { padding: 24px 28px; overflow-y: auto; flex: 1; background: #f8fafc; scroll-behavior: smooth; }
        .news-footer {
            padding: 14px 28px; background: #ffffff; border-top: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .news-btn {
            width: 42px; height: 42px; border-radius: 50%;
            border: 1px solid #e2e8f0; background: #fff; color: #1e3a5f;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all 0.2s;
        }
        .news-btn:hover { background: #f1f5f9; border-color: #1a8a50; color: #1a8a50; }
        .news-btn:disabled { opacity: 0.3; pointer-events: none; }
        .btn-close {
            width: auto; border-radius: 50px; padding: 10px 26px;
            background: #f1f5f9; font-weight: 600; font-size: 0.85rem;
            gap: 6px; border: none; color: #1e3a5f;
        }
        .btn-close:hover { background: #e2e8f0; }
        .news-progress { font-size: 0.85rem; color: #64748b; font-weight: 500; }

        /* ---- CARDS ---- */
        .birthday-card {
            border-radius: 24px; overflow: hidden; padding: 40px 32px; color: #fff;
            min-height: 320px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center;
            background-size: cover; background-position: center;
            text-shadow: 0 2px 12px rgba(0,0,0,0.6);
            position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .birthday-card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.35) 100%);
            pointer-events: none; z-index: 0;
        }
        .birthday-card > * { position: relative; z-index: 1; }
        .birthday-card h3 { font-size: 2rem; margin-bottom: 16px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.3; }
        .birthday-card .msg { font-size: 1.15rem; margin-bottom: 28px; line-height: 1.5; max-width: 500px; white-space: pre-wrap; }
        .btn-email {
            background: white; color: #1a365d; border: none; border-radius: 50px;
            padding: 12px 32px; font-weight: 700; cursor: pointer;
            display: inline-flex; align-items: center; gap: 10px;
            font-size: 0.95rem; text-decoration: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15); transition: all 0.2s;
            z-index: 2; position: relative;
        }
        .btn-email:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0,0,0,0.2); background: #f8fafc; }
        .btn-email i { font-size: 1rem; }

        /* Postagens */
        .news-post-image { width: 100%; height: 220px; object-fit: cover; border-radius: 18px; margin-bottom: 20px; background: #e2e8f0; }
        .news-badge { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        .badge-alerta { background: #fee2e2; color: #991b1b; }
        .badge-novidade { background: #e0f2fe; color: #0369a1; }
        .badge-informativo { background: #e8f5e9; color: #1e6f43; }
        .news-post-title { font-weight: 700; font-size: 1.6rem; color: #0f1a2e; margin-bottom: 12px; line-height: 1.3; letter-spacing: -0.3px; }
        .news-post-meta { font-size: 0.82rem; color: #64748b; margin-bottom: 20px; display: flex; gap: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
        .news-post-excerpt { font-size: 0.95rem; line-height: 1.6; color: #1e293b; }

        @media (max-width: 480px) {
            .news-paper { width: 94vw; height: 85vh; border-radius: 24px; }
            .birthday-card h3 { font-size: 1.6rem; }
            .birthday-card .msg { font-size: 1rem; }
            .news-body { padding: 20px; }
            .session-modal { padding: 24px 20px; }
        }
    </style>
</head>

    <script>
        (function() {
            const SHEET_ID = "1S9Crqa7EBgybANgqoRe2a0YKG8FGeHAqIRJswdI69bI";
            const CADASTRO_URL = `https://opensheet.elk.sh/${SHEET_ID}/cadastro`;
            const POSTAGENS_URL = `https://opensheet.elk.sh/${SHEET_ID}/postagens`;
            const COMEMORAR_URL = `https://opensheet.elk.sh/${SHEET_ID}/comemorar`;

            const urlParams = new URLSearchParams(window.location.search);
            const motivo = urlParams.get('reason');

            function exibirModalSessao(titulo, mensagem, icone, corIcone = '#1e5a7a') {
                const overlay = document.getElementById('session-overlay');
                document.getElementById('session-title').textContent = titulo;
                document.getElementById('session-message').textContent = mensagem;
                const iconEl = document.getElementById('session-icon');
                iconEl.className = `fas ${icone}`;
                iconEl.style.color = corIcone;
                const timerEl = document.getElementById('session-timer');

                let segundos = 7;
                timerEl.textContent = `Fechando em ${segundos}s...`;
                const interval = setInterval(() => {
                    segundos--;
                    if (segundos <= 0) { clearInterval(interval); fechar(); }
                    else { timerEl.textContent = `Fechando em ${segundos}s...`; }
                }, 1000);

                function fechar() {
                    clearInterval(interval);
                    overlay.classList.remove('active');
                    if (window.history && window.history.replaceState) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                    document.getElementById('username').focus();
                }
                document.getElementById('session-ok-btn').onclick = fechar;
                overlay.classList.add('active');
            }

            if (motivo === 'logged_out') {
    localStorage.removeItem('radar_usuario');
    localStorage.removeItem('admin_login_time');
    localStorage.removeItem('ultimo_acesso_radar');
    localStorage.removeItem('radar_logged_out');   // ← linha adicional
    exibirModalSessao('Você saiu da sessão', ' Seu acesso foi encerrado com sucesso. \n Faça login novamente para continuar.', 'fa-sign-out-alt', '#d32f2f');
} else if (motivo === 'expired') {
                localStorage.removeItem('radar_usuario');
                localStorage.removeItem('admin_login_time');
                localStorage.removeItem('ultimo_acesso_radar');
                exibirModalSessao('Sessão expirada', 'Por inatividade, sua sessão foi encerrada. Por favor, faça login novamente.', 'fa-clock', '#ed6c02');
            }

            if (!motivo) {
                (function() {
                    const userData = localStorage.getItem('radar_usuario');
                    if (userData) {
                        try {
                            const parsed = JSON.parse(userData);
                            if (parsed.loginDate === new Date().toDateString() && parsed.pagina_destino) {
                                window.location.href = parsed.pagina_destino;
                                return;
                            }
                        } catch(e) {}
                        localStorage.removeItem('radar_usuario');
                    }
                })();
            }

            const form = document.getElementById('login-form');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('login-button');
            const statusMsg = document.getElementById('status-msg');
            const newsOverlay = document.getElementById('news-overlay');
            const newsBody = document.getElementById('news-body');
            const newsProgress = document.getElementById('news-progress');
            const newsEdition = document.getElementById('news-edition');
            const btnCloseJornal = document.getElementById('btn-close-jornal');
            const btnPrevJornal = document.getElementById('btn-prev-jornal');
            const btnNextJornal = document.getElementById('btn-next-jornal');

            let allItems = [], currentIndex = 0, dadosUsuarioLogado = null;

            function mostrarStatus(t, tipo='error') {
                statusMsg.innerHTML = `<i class="fas ${tipo==='success'?'fa-check-circle':'fa-exclamation-circle'}"></i> ${t}`;
                statusMsg.className = 'status-msg '+tipo;
                statusMsg.style.display = 'flex';
                clearTimeout(statusMsg._timeout);
                statusMsg._timeout = setTimeout(() => statusMsg.style.display = 'none', 8000);
            }
            function esconderStatus() { statusMsg.style.display = 'none'; }
            function formatarNome(n) { return n ? n.replace(/[._-]/g, ' ').replace(/\b\w/g, c=>c.toUpperCase()).trim() : ''; }

            function isAniversarioHoje(dataStr) {
                if (!dataStr || !dataStr.trim()) return false;
                const hoje = new Date();
                const dia = hoje.getDate().toString().padStart(2,'0');
                const mes = (hoje.getMonth()+1).toString().padStart(2,'0');
                const partes = dataStr.split(/[/-]/);
                return partes.length>=2 && partes[0].trim()===dia && partes[1].trim()===mes;
            }

            function calcularAnosEmpresa(dataStr) {
                if (!dataStr) return 0;
                const partes = dataStr.split(/[/-]/);
                if (partes.length<2) return 0;
                const dia = parseInt(partes[0]), mes = parseInt(partes[1])-1;
                const ano = partes.length===3 ? parseInt(partes[2]) : new Date().getFullYear();
                const admissao = new Date(ano, mes, dia);
                const hoje = new Date();
                let anos = hoje.getFullYear() - admissao.getFullYear();
                if (hoje.getMonth() < mes || (hoje.getMonth()===mes && hoje.getDate() < dia)) anos--;
                return anos;
            }

            async function obterMensagemAniversario(tipo='aniversario') {
                try {
                    const resp = await fetch(COMEMORAR_URL);
                    const comemorar = resp.ok ? await resp.json() : [];
                    const ativas = comemorar.filter(m => m.ativo?.toLowerCase()==='sim' && m.tipo===tipo);
                    if (ativas.length===0) return { mensagem: "", imagem_fundo: "" };
                    const a = ativas[Math.floor(Math.random()*ativas.length)];
                    return { mensagem: a.mensagem || "", imagem_fundo: a.imagem_fundo || "" };
                } catch(e) { return { mensagem: "", imagem_fundo: "" }; }
            }

            function criarCardAniversarioPessoal(nome, mensagem, imagemFundo) {
                const msg = mensagem.replace(/\{nome\}/g, nome) || `🎉 Parabéns, ${nome}!`;
                const bg = imagemFundo
                    ? `background: url('${imagemFundo}') center/cover no-repeat;`
                    : 'background: linear-gradient(135deg, #1a8a50, #0f5e37);';
                return `<div class="birthday-card" style="${bg}">
                    <h3>${msg}</h3>
                </div>`;
            }

            function criarCardAniversarioEmpresa(nome, anos, mensagem, imagemFundo) {
                const msg = mensagem
                    .replace(/\{nome\}/g, nome)
                    .replace(/\{anos\}/g, anos) || `Parabéns, ${nome}! Hoje você completa ${anos} anos de Centrobor.`;
                const bg = imagemFundo
                    ? `background: url('${imagemFundo}') center/cover no-repeat;`
                    : `background: url('img/aniversario.jpeg') center/cover no-repeat;`;
                return `<div class="birthday-card" style="${bg}">
                    <h3>🏢 Aniversário de Empresa</h3>
                    <div class="msg">${msg}</div>
                </div>`;
            }

            function criarCardColega(nome, email) {
                const mailto = `mailto:${email}?subject=${encodeURIComponent('Feliz Aniversário!')}&body=${encodeURIComponent(`Olá ${nome},\n\nParabéns! Muitas felicidades.\n\nAbraços!`)}`;
                return `<div class="birthday-card" style="background: url('img/aniversariante.jpeg') center/cover no-repeat;">
                    <h3>🎈 Hoje é aniversário de ${nome}!</h3>
                    <div class="msg">Deixe seu parabéns especial.</div>
                    <a href="${mailto}" class="btn-email"><i class="fas fa-envelope"></i> Enviar e-mail</a>
                </div>`;
            }

            function buildItensJornal(postsLimitados, usuario, pularAniversarios) {
                const itens = [];
                if (!pularAniversarios) {
                    const anivProprio = window.listaAniversariantes?.find(p => p.id === usuario.id);
                    if (anivProprio) {
                        itens.push({
                            tipo: 'aniversario_proprio',
                            nome: anivProprio.nome_formatado,
                            mensagem: anivProprio.mensagem_escolhida.mensagem,
                            imagem_fundo: anivProprio.mensagem_escolhida.imagem_fundo
                        });
                    }
                    if (window.aniversarioEmpresa) {
                        itens.push({
                            tipo: 'aniversario_empresa',
                            nome: window.aniversarioEmpresa.nome_formatado,
                            anos: window.aniversarioEmpresa.anos,
                            mensagem: window.aniversarioEmpresa.mensagem,
                            imagem_fundo: window.aniversarioEmpresa.imagem_fundo
                        });
                    }
                    window.listaAniversariantes?.forEach(p => {
                        if (p.id !== usuario.id) itens.push({ tipo: 'aniversario_outro', nome: p.nome_formatado, email: p.email });
                    });
                }
                postsLimitados.forEach(post => itens.push({ tipo: 'postagem', ...post }));
                return itens;
            }

            function atualizarBotoes() {
                btnPrevJornal.disabled = currentIndex === 0;
                btnNextJornal.disabled = currentIndex === allItems.length-1;
            }

            function renderizarItem() {
                if (currentIndex >= allItems.length) { fecharJornal(true); return; }
                const item = allItems[currentIndex];
                if (item.tipo === 'aniversario_proprio')
                    newsBody.innerHTML = criarCardAniversarioPessoal(item.nome, item.mensagem, item.imagem_fundo);
                else if (item.tipo === 'aniversario_empresa')
                    newsBody.innerHTML = criarCardAniversarioEmpresa(item.nome, item.anos, item.mensagem, item.imagem_fundo);
                else if (item.tipo === 'aniversario_outro')
                    newsBody.innerHTML = criarCardColega(item.nome, item.email);
                else {
                    const post = item, tipo = post.tipo||'informativo';
                    const badgeClass = `badge-${tipo}`;
                    const badgeIcon = tipo==='alerta'?'fa-exclamation-triangle':(tipo==='novidade'?'fa-star':'fa-info-circle');
                    const resumo = (post.texto_html||'').replace(/<[^>]*>/g,'').trim().substring(0,400)+'...';
                    newsBody.innerHTML = `
                        ${post.imagem ? `<img src="${post.imagem}" class="news-post-image" onerror="this.style.display='none'">` : ''}
                        <span class="news-badge ${badgeClass}"><i class="fas ${badgeIcon}"></i> ${tipo.charAt(0).toUpperCase()+tipo.slice(1)}</span>
                        <div class="news-post-title">${post.titulo||'Sem título'}</div>
                        <div class="news-post-meta"><span><i class="fas fa-calendar-alt"></i> ${post.data||''}</span><span><i class="fas fa-user"></i> ${post.autor||''}</span></div>
                        <div class="news-post-excerpt">${resumo}</div>`;
                }
                newsProgress.textContent = `${currentIndex+1}/${allItems.length}`;
                newsEdition.textContent = `Edição ${currentIndex+1}`;
                atualizarBotoes();
            }

            function fecharJornal(redirecionar=true) {
                newsOverlay.classList.remove('active');
                if (redirecionar && dadosUsuarioLogado) {
                    // Garantido que o timestamp é atual (já foi definido antes, mas reforçamos)
                    localStorage.setItem('ultimo_acesso_radar', Date.now().toString());
                    const dados = {
                        id: dadosUsuarioLogado.id, nome_usuario: dadosUsuarioLogado.nome_usuario,
                        email: dadosUsuarioLogado.email, data_nascimento: dadosUsuarioLogado.data_nascimento,
                        sexo: dadosUsuarioLogado.sexo, data_admissao: dadosUsuarioLogado.data_admissao,
                        imagem_perfil: dadosUsuarioLogado.imagem_perfil||'',
                        pagina_destino: dadosUsuarioLogado.pagina_destino,
                        loginDate: new Date().toDateString()
                    };
                    localStorage.setItem('radar_usuario', JSON.stringify(dados));
                    setTimeout(() => { window.location.href = dados.pagina_destino||'vendedores/default.html'; }, 300);
                }
            }

            btnPrevJornal.addEventListener('click', ()=>{ if(currentIndex>0){ currentIndex--; renderizarItem(); } });
            btnNextJornal.addEventListener('click', ()=>{ if(currentIndex<allItems.length-1){ currentIndex++; renderizarItem(); } });
            btnCloseJornal.addEventListener('click', ()=>fecharJornal(true));
            newsOverlay.addEventListener('click', e=>{ if(e.target===newsOverlay) fecharJornal(true); });

            function parseData(str) {
                if (!str) return null;
                let match = str.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
                if (match) {
                    const [_, d, m, y] = match;
                    return new Date(parseInt(y), parseInt(m)-1, parseInt(d));
                }
                match = str.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
                if (match) {
                    const [_, y, m, d] = match;
                    return new Date(parseInt(y), parseInt(m)-1, parseInt(d));
                }
                return null;
            }

            async function realizarLogin(event) {
    event.preventDefault();
    esconderStatus();
    const u = usernameInput.value.trim(), s = passwordInput.value.trim();
    if (!u || !s) { mostrarStatus('Preencha todos os campos.'); return; }
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
    try {
        let usuarios = [];
        try {
            const resp = await fetch(CADASTRO_URL);
            if (!resp.ok) throw new Error('Falha');
            usuarios = await resp.json();
        } catch(e) { throw new Error('Serviço indisponível. Aguarde uns instantes e atualize a página.'); }
        const usuarioEncontrado = usuarios.find(x => {
            const n = (x.nome_usuario||'').trim().toLowerCase()===u.toLowerCase();
            const e = (x.email||'').trim().toLowerCase()===u.toLowerCase();
            return (n||e) && String(x.senha).trim()===s;
        });
        if (!usuarioEncontrado) {
            mostrarStatus('Usuário ou senha inválidos.');
            passwordInput.value = '';
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar no Radar';
            return;
        }

        // ***** CRÍTICO: atualiza o timestamp de atividade IMEDIATAMENTE *****
        localStorage.setItem('ultimo_acesso_radar', Date.now().toString());
        localStorage.setItem('admin_login_time', Date.now().toString());
        
        // >>> CORREÇÃO: remove a flag de logout forçado para evitar loop <<<
        localStorage.removeItem('radar_logged_out');
        
        mostrarStatus('Login realizado!', 'success');

        const hojeStr = new Date().toDateString();
        const chaveAniversario = `aniversarios_mostrados_${usuarioEncontrado.id}`;
        const jaViuAniversario = localStorage.getItem(chaveAniversario) === hojeStr;
        let pularAniversarios = jaViuAniversario;

        if (!pularAniversarios) {
            const aniversariantes = usuarios.filter(x=>isAniversarioHoje(x.data_nascimento))
                .map(x=>({...x, nome_formatado: formatarNome(x.nome_usuario)}));
            const listaComMensagens = [];
            for (const p of aniversariantes) {
                const msg = await obterMensagemAniversario('aniversario');
                listaComMensagens.push({...p, mensagem_escolhida: msg});
            }
            window.listaAniversariantes = listaComMensagens;

            window.aniversarioEmpresa = null;
            if (isAniversarioHoje(usuarioEncontrado.data_admissao)) {
                const anos = calcularAnosEmpresa(usuarioEncontrado.data_admissao);
                const msgEmp = await obterMensagemAniversario('aniversario_empresa');
                window.aniversarioEmpresa = {
                    nome_formatado: formatarNome(usuarioEncontrado.nome_usuario),
                    anos,
                    mensagem: msgEmp.mensagem,
                    imagem_fundo: msgEmp.imagem_fundo
                };
            }
        } else {
            window.listaAniversariantes = [];
            window.aniversarioEmpresa = null;
        }

        let postagens = [];
        try { const resp = await fetch(POSTAGENS_URL); if(resp.ok) postagens = await resp.json(); } catch(e){}

        const idsVistos = JSON.parse(localStorage.getItem('postagens_vistas')||'[]');
        const setVistos = new Set(idsVistos);
        const postsNaoVistos = postagens.filter(p => !setVistos.has(p.id));
        const sortedNaoVistos = postsNaoVistos.sort((a, b) => {
            const da = parseData(a.data);
            const db = parseData(b.data);
            if (da && db) return db - da;
            if (da && !db) return -1;
            if (!da && db) return 1;
            return (parseInt(b.id) || 0) - (parseInt(a.id) || 0);
        });
        const postsParaMostrar = sortedNaoVistos.slice(0, 10);
        sortedNaoVistos.forEach(p => setVistos.add(p.id));
        localStorage.setItem('postagens_vistas', JSON.stringify([...setVistos]));

        allItems = buildItensJornal(postsParaMostrar, usuarioEncontrado, pularAniversarios);
        currentIndex = 0;
        dadosUsuarioLogado = usuarioEncontrado;

        if (allItems.length === 0) {
            if (!pularAniversarios) localStorage.setItem(chaveAniversario, hojeStr);
            fecharJornal(true);
        } else {
            if (!pularAniversarios) localStorage.setItem(chaveAniversario, hojeStr);
            renderizarItem();
            newsOverlay.classList.add('active');
        }
    } catch(erro) {
        mostrarStatus(erro.message||'Erro inesperado.');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar no Radar';
    }
}

            form.addEventListener('submit', realizarLogin);
            usernameInput.addEventListener('input', esconderStatus);
            passwordInput.addEventListener('input', esconderStatus);
            document.querySelectorAll('.input-field input').forEach(input => {
                input.addEventListener('focus', ()=>input.parentElement.querySelector('i').style.color='#1e5a7a');
                input.addEventListener('blur', ()=>input.parentElement.querySelector('i').style.color='#8c9bae');
            });
        })();
    </script>
</body>
