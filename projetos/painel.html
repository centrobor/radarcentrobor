            // ===== CONSTRUIR SLIDES =====
            function getSlideCategory(type) {
                const cats = {
                    'relogio': 'geral',
                    'logo': 'geral',
                    'video': 'novidades',
                    'previsao_tempo': 'novidades',
                    'aniversariante_individual': 'novidades',
                    'aniversariante_futuro': 'novidades',
                    'aniversariante_dia': 'novidades',
                    'aniversariantes_semana': 'novidades',
                    'monthly_bar': 'resultados',
                    'grafico_diario': 'resultados',
                    'evolucao_mensal': 'resultados',
                    'realizado_meta': 'resultados',
                    'semestre': 'resultados',
                    'postagem': 'novidades'
                };
                return cats[type] || 'geral';
            }

            function getSlideLabel(type, slide) {
                const labels = {
                    'relogio': 'Relógio',
                    'logo': 'Logo Centrobor',
                    'video': 'Vídeo',
                    'previsao_tempo': 'Previsão do Tempo',
                    'aniversariante_individual': 'Aniversariante Individual',
                    'aniversariante_futuro': 'Próximo Aniversariante',
                    'aniversariante_dia': 'Aniversariante do Dia',
                    'aniversariantes_semana': 'Aniversariantes da Semana',
                    'monthly_bar': 'Faturamento Mensal',
                    'grafico_diario': 'Evolução Diária',
                    'evolucao_mensal': 'Evolução Mensal',
                    'realizado_meta': 'Realizado x Meta',
                    'semestre': 'Semestre',
                    'postagem': 'Postagem'
                };
                if (slide?.customLabel) return slide.customLabel;
                if (type === 'aniversariante_individual' && slide?.pessoaNome) return '🎂 ' + slide.pessoaNome;
                if (type === 'aniversariante_futuro' && slide?.pessoaNome) return '⏳ ' + slide.pessoaNome;
                if (type === 'aniversariante_dia' && slide?.pessoaNome) return '🎉 ' + slide.pessoaNome;
                return labels[type] || type;
            }

            function construirListaSlides() {
                const container = document.getElementById('slideListContainer');
                let html = '';
                allSlides.forEach((slide, idx) => {
                    const type = slide.type;
                    const cat = getSlideCategory(type);
                    const label = getSlideLabel(type, slide);
                    const checked = slideVisibility[type] !== false;
                    html += `<div class="slide-item" data-type="${type}" data-cat="${cat}">
                        <input type="checkbox" ${checked?'checked':''} data-type="${type}">
                        <span class="slide-label">${label}</span>
                        <span class="slide-category ${cat}">${cat}</span>
                    </div>`;
                });
                container.innerHTML = html;
                container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.addEventListener('change', function() {
                        slideVisibility[this.dataset.type] = this.checked;
                        salvarVisibilidade();
                        aplicarFiltro(document.querySelector('.filter-buttons button.active')?.dataset
                            .filter || 'all');
                        rebuildSlides();
                    });
                });
            }

            function aplicarFiltro(categoria) {
                document.querySelectorAll('#slideListContainer .slide-item').forEach(item => {
                    item.style.display = (!categoria || categoria === 'all' || item.dataset.cat === categoria) ?
                        'flex' : 'none';
                });
                document.querySelectorAll('.filter-buttons button[data-filter]').forEach(btn => btn.classList.toggle(
                    'active', btn.dataset.filter === (categoria || 'all')));
            }

            function rebuildSlides() {
                visibleSlides = allSlides.filter(s => slideVisibility[s.type] !== false);
                if (!visibleSlides.length) visibleSlides = allSlides;

                const zone = document.getElementById('slides-zone');
                zone.querySelectorAll('.slide').forEach(el => el.remove());
                visibleSlides.forEach((s, i) => {
                    const div = document.createElement('div');
                    div.className = `slide ${i===0?'active':''}`;
                    div.dataset.index = i;
                    div.dataset.type = s.type;
                    let htmlContent = s.html;
                    if (s.type === 'video') {
                        htmlContent =
                            `<iframe id="live-youtube-iframe" src="https://www.youtube.com/embed/${currentVideoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${currentVideoId}&cc_load_policy=1&hl=pt&playsinline=1" style="width:100%;height:100%;border:none;"></iframe>`;
                    }
                    div.innerHTML = htmlContent;
                    zone.appendChild(div);
                });
                const indicators = document.getElementById('indicators');
                indicators.innerHTML = visibleSlides.map((_, i) =>
                    `<div class="dot-indicator${i===0?' active':''}" data-index="${i}"></div>`).join('');
                indicators.querySelectorAll('.dot-indicator').forEach(d => d.addEventListener('click', function() {
                    irParaSlide(parseInt(this.dataset.index));
                    resetarTimer();
                }));
                if (currentSlideIndex >= visibleSlides.length) currentSlideIndex = 0;
                irParaSlide(currentSlideIndex);
                resetarTimer();
            }

            function construirSlides(dados) {
                allSlides = [];
                Object.values(chartInstances).forEach(c => { if (c) c.destroy(); });
                chartInstances = {};

                // Slides fixos
                allSlides.push({ type: 'relogio', html: buildRelogioSlideHTML() });
                allSlides.push({ type: 'logo', html: buildLogoSlide() });

                // Aniversariantes
                const aniv = obterAniversariantesDaSemana();
                if (aniv.length) {
                    aniv.filter(a => a.diff < 0).forEach(a => allSlides.push({ type: 'aniversariante_individual',
                        html: buildBirthdayHeroSlide(a, false, a.diff), pessoaNome: a.nome }));
                    aniv.filter(a => a.diff > 0).forEach(a => allSlides.push({ type: 'aniversariante_futuro',
                        html: buildBirthdayHeroSlide(a, true, a.diff), pessoaNome: a.nome }));
                    aniv.filter(a => a.diff === 0).forEach(a => allSlides.push({ type: 'aniversariante_dia',
                        html: buildBirthdayHeroSlide(a, false, 0), pessoaNome: a.nome }));
                    allSlides.push({ type: 'aniversariantes_semana', html: buildBirthdayWeekSlide(aniv) });
                }

                // Clima
                if (currentWeatherData) {
                    const ws = buildWeatherSlide(currentWeatherData);
                    if (ws) allSlides.push({ type: 'previsao_tempo', html: ws });
                }

                // Gráficos
                allSlides.push({ type: 'monthly_bar', html: buildMonthlyBarSlide(dados) });
                allSlides.push({ type: 'grafico_diario', html: buildGraficoEvolucaoHTML(dados) });
                allSlides.push({ type: 'evolucao_mensal', html: buildEvolucaoMensalSlide(dados) });
                allSlides.push({ type: 'realizado_meta', html: buildRealizadoMetaSlide(dados) });

                // Semestres
                const now = getHoraSincronizada(),
                    ano = now.getFullYear(),
                    mes = now.getMonth() + 1;
                const semAtual = mes <= 6 ? 1 : 2;
                const semAnterior = semAtual === 1 ? 2 : 1;
                const anoAnterior = semAtual === 1 ? ano - 1 : ano;
                let prev = getFatEMetaSemestre(anoAnterior, semAnterior);
                let curr = getFatEMetaSemestre(ano, semAtual);
                if (prev.meta > 0) {
                    allSlides.push({ type: 'semestre',
                        html: buildSemestreSlide(anoAnterior, semAnterior,
                            `Semestre Anterior (${semAnterior===1?'1º':'2º'})`, prev.meta, prev.fat) });
                }
                if (curr.meta > 0) {
                    allSlides.push({ type: 'semestre',
                        html: buildSemestreSlide(ano, semAtual, `Semestre Atual (${semAtual===1?'1º':'2º'})`, curr
                            .meta, curr.fat) });
                }

                // Postagens
                const hoje = getHoraSincronizada();
                fetch(BASES.postagens).then(r => r.json()).then(postagens => {
                    const ativas = postagens.filter(p => {
                        if (!p.data_final) return true;
                        const dataFinal = parseDataBR(p.data_final);
                        if (!dataFinal) return true;
                        if (p.data) {
                            const dataInicio = parseDataBR(p.data);
                            if (dataInicio && dataInicio > hoje) return false;
                        }
                        return dataFinal >= hoje;
                    });
                    ativas.slice(0, 6).forEach(p => {
                        const tipo = p.Tipos || p.tipo || 'informativo';
                        const resumo = (p.texto_html || '').replace(/<[^>]*>/g, '').trim().substring(0,
                            280) + '...';
                        const imgTag = p.imagem ?
                            `<img src="${p.imagem}" class="slide-full-img" onerror="this.style.display='none'">` :
                            `<div style="width:100%;height:100%;background:linear-gradient(135deg,#1e3a5f,#0b1a2e);"></div>`;
                        allSlides.push({ type: 'postagem', customLabel: p.titulo,
                            html: `${imgTag}<div class="slide-overlay"><span style="display:inline-block;background:#e0f2fe;color:#0369a1;padding:4px 12px;border-radius:16px;font-size:0.7rem;font-weight:700;margin-bottom:12px;">${tipo.toUpperCase()}</span><h2>${p.titulo}</h2><div class="meta" style="margin-top:8px;"><span><i class="fas fa-calendar-alt"></i> ${p.data||''}</span><span><i class="fas fa-user"></i> ${p.autor||''}</span></div><p style="margin-top:10px;color:var(--text-muted);">${resumo}</p></div>` }
                        );
                    });
                    rebuildSlides();
                }).catch(() => {});

                // Vídeo
                allSlides.push({ type: 'video',
                    html: `<iframe id="live-youtube-iframe" src="https://www.youtube.com/embed/${currentVideoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${currentVideoId}&cc_load_policy=1&hl=pt&playsinline=1" style="width:100%;height:100%;border:none;"></iframe>`
                });

                allSlides.forEach(s => { if (slideVisibility[s.type] === undefined) slideVisibility[s.type] = true; });
                salvarVisibilidade();
                construirListaSlides();
                aplicarFiltro('all');
                rebuildSlides();
            }

            // ===== NAVEGAÇÃO =====
            function irParaSlide(idx) {
                const slidesEl = document.querySelectorAll('.slide');
                if (!slidesEl.length) return;
                idx = Math.min(Math.max(0, idx), slidesEl.length - 1);
                slidesEl.forEach(s => { s.classList.remove('active');
                    s.className = 'slide'; });
                document.querySelectorAll('.dot-indicator').forEach(d => d.classList.remove('active'));
                const slideEl = slidesEl[idx];
                slideEl.classList.add('slide-transition-' + transicoes[Math.floor(Math.random() * transicoes.length)],
                    'active');
                document.querySelector(`.dot-indicator[data-index="${idx}"]`)?.classList.add('active');
                currentSlideIndex = idx;

                const s = visibleSlides[idx];
                const bottombar = document.getElementById('bottombar');
                if (s && s.type === 'relogio') {
                    bottombar.classList.add('relogio-active');
                    atualizarTodosRelogios();
                } else {
                    bottombar.classList.remove('relogio-active');
                }

                if (s) {
                    if (s.type === 'monthly_bar') setTimeout(() => animarMonthlyBarChart(window._dadosPainel || {}),
                        200);
                    else if (s.type === 'grafico_diario') setTimeout(() => animarGraficoEvolucao(window._dadosPainel ||
                        {}), 200);
                    else if (s.type === 'evolucao_mensal') setTimeout(() => animarEvolucaoMensalSlide(window
                        ._dadosPainel || {}), 200);
                    else if (s.type === 'realizado_meta') setTimeout(() => animarRealizadoMetaSlide(window
                        ._dadosPainel || {}), 200);
                    else if (s.type === 'aniversariante_dia') dispararConfetes();
                }
            }

            function proximoSlide() { if (visibleSlides.length) irParaSlide((currentSlideIndex + 1) % visibleSlides.length); }

            function slideAnterior() { if (visibleSlides.length) irParaSlide((currentSlideIndex - 1 + visibleSlides
                    .length) % visibleSlides.length); }

            function iniciarTimer() {
                if (slideTimer) clearTimeout(slideTimer);
                if (!visibleSlides.length) return;
                const dur = visibleSlides[currentSlideIndex]?.type === 'video' ? CONFIG.videoSlideDuration : CONFIG
                    .slideInterval;
                slideTimer = setTimeout(() => { if (!paused) { proximoSlide();
                        iniciarTimer(); } else iniciarTimer(); }, dur);
            }

            function resetarTimer() { if (slideTimer) clearTimeout(slideTimer);
                iniciarTimer(); }

            function dispararConfetes() {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, zIndex: 10000 });
                    setTimeout(() => confetti({ particleCount: 100, angle: 60, spread: 55, origin: { x: 0 },
                        zIndex: 10000 }), 200);
                    setTimeout(() => confetti({ particleCount: 100, angle: 120, spread: 55, origin: { x: 1 },
                        zIndex: 10000 }), 400);
                }
            }

            // ===== RÁDIO =====
            function carregarRadio(index) {
                const radio = RADIOS[index];
                if (!radio) return;
                document.getElementById('radio-box').innerHTML = radio.iframe;
                currentRadioIndex = index;
                localStorage.setItem('radioIndex', index);
                document.querySelectorAll('#radioSelector button').forEach(b => b.classList.toggle('active-radio',
                    parseInt(b.dataset.radio) === index));
            }

            function proximaRadio() { carregarRadio((currentRadioIndex + 1) % RADIOS.length); }

            function iniciarRadioRotacao() {
                const saved = localStorage.getItem('radioIndex');
                carregarRadio(saved ? parseInt(saved) : 0);
                radioTimer = setInterval(proximaRadio, CONFIG.radioInterval);
                document.querySelectorAll('#radioSelector button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.radio);
                        carregarRadio(idx);
                        clearInterval(radioTimer);
                        radioTimer = setInterval(proximaRadio, CONFIG.radioInterval);
                        document.getElementById('radioSelector').classList.remove('active');
                    });
                });
            }

            // ===== SIDEBAR =====
            function toggleSidebar() {
                sidebarHidden = !sidebarHidden;
                document.getElementById('mainGrid').classList.toggle('sidebar-hidden', sidebarHidden);
                document.getElementById('topToggleIcon').className = sidebarHidden ? 'fas fa-chevron-left' :
                    'fas fa-chevron-right';
                document.getElementById('sidebarTopToggle').classList.toggle('hidden-sidebar', sidebarHidden);
                localStorage.setItem('sidebarHidden', sidebarHidden);
            }

            function carregarSidebarState() {
                const saved = localStorage.getItem('sidebarHidden');
                if (saved !== null) {
                    sidebarHidden = JSON.parse(saved);
                    document.getElementById('mainGrid').classList.toggle('sidebar-hidden', sidebarHidden);
                    document.getElementById('topToggleIcon').className = sidebarHidden ? 'fas fa-chevron-left' :
                        'fas fa-chevron-right';
                    document.getElementById('sidebarTopToggle').classList.toggle('hidden-sidebar', sidebarHidden);
                }
            }

            // ===== PONTO =====
            let pontoAtivo = false;
            let pontoFechamentoTimer = null;

            function verificarLembretePonto() {
                const agora = getHoraSincronizada();
                const totalMin = agora.getHours() * 60 + agora.getMinutes();
                const horarios = [
                    { label: 'Iniciar', h: 8, m: 0 },
                    { label: 'Encerrar', h: 17, m: 45 }
                ];

                let alvo = null;
                for (let h of horarios) {
                    const alvoMin = h.h * 60 + h.m;
                    if (alvoMin - totalMin >= -1 && alvoMin - totalMin <= 3) {
                        alvo = h;
                        break;
                    }
                }

                if (alvo && !pontoAtivo) {
                    const hoje = agora.toDateString();
                    const chave = `ponto_${alvo.h}_${alvo.m}_${hoje}`;
                    if (localStorage.getItem(chave) === 'exibido') return;

                    pontoAtivo = true;
                    document.getElementById('pontoTitulo').textContent = `⏰ ${alvo.label} o Expediente`;
                    document.getElementById('pontoSub').textContent = `Já bateu o ponto hoje?`;
                    document.getElementById('pontoMsgFinal').style.display = 'none';
                    document.getElementById('pontoOverlay').classList.add('active');

                    let segundosRestantes = 180;
                    atualizarTempoRestante(segundosRestantes);

                    if (pontoFechamentoTimer) clearInterval(pontoFechamentoTimer);
                    pontoFechamentoTimer = setInterval(() => {
                        segundosRestantes--;
                        atualizarTempoRestante(segundosRestantes);
                        if (segundosRestantes <= 0) {
                            clearInterval(pontoFechamentoTimer);
                            desativarPonto();
                        }
                    }, 1000);

                    localStorage.setItem(chave, 'exibido');
                }
            }

            function atualizarTempoRestante(segundos) {
                const el = document.getElementById('pontoTempoRestante');
                if (segundos > 0) {
                    const mins = Math.floor(segundos / 60);
                    const secs = segundos % 60;
                    el.textContent = `⏳ Fechando em ${mins}:${String(secs).padStart(2, '0')}`;
                    el.style.display = 'block';
                } else {
                    el.textContent = '⏳ Fechando...';
                }
            }

            function desativarPonto() {
                pontoAtivo = false;
                document.getElementById('pontoOverlay').classList.remove('active');
                if (pontoFechamentoTimer) {
                    clearInterval(pontoFechamentoTimer);
                    pontoFechamentoTimer = null;
                }
                document.getElementById('pontoMsgFinal').style.display = 'none';
            }

            document.getElementById('pontoBtn').addEventListener('click', () => {
                desativarPonto();
                const btn = document.getElementById('pontoBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ OK!';
                btn.style.background = '#4caf50';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                }, 2000);
            });

            document.getElementById('pontoFecharBtn').addEventListener('click', () => {
                desativarPonto();
            });

            setInterval(verificarLembretePonto, 10000);
            setTimeout(verificarLembretePonto, 1000);

            function limparRegistrosPontoAntigos() {
                const hoje = new Date().toDateString();
                const keys = Object.keys(localStorage);
                for (const key of keys) {
                    if (key.startsWith('ponto_') && !key.includes(hoje)) {
                        localStorage.removeItem(key);
                    }
                }
            }
            limparRegistrosPontoAntigos();

            // ===== SLIDE MANAGER =====
            function initSlideManager() {
                const panel = document.getElementById('slideManagerPanel');
                const overlay = document.getElementById('slideManagerOverlay');
                document.getElementById('menuToggle').addEventListener('click', () => { panel.classList.add('active');
                    overlay.classList.add('active'); });
                document.getElementById('closeSlideManager').addEventListener('click', () => { panel.classList.remove(
                        'active');
                    overlay.classList.remove('active'); });
                overlay.addEventListener('click', () => { panel.classList.remove('active');
                    overlay.classList.remove('active'); });

                document.querySelectorAll('.filter-buttons button[data-filter]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.filter-buttons button[data-filter]').forEach(b => b
                            .classList.remove('active'));
                        this.classList.add('active');
                        const cat = this.dataset.filter;
                        document.querySelectorAll('#slideListContainer .slide-item').forEach(item => {
                            item.style.display = (cat === 'all' || item.dataset.cat === cat) ?
                                'flex' : 'none';
                        });
                    });
                });
                document.getElementById('selectAllSlides').addEventListener('click', () => {
                    document.querySelectorAll('#slideListContainer input[type="checkbox"]').forEach(cb => {
                        cb.checked = true;
                        slideVisibility[cb.dataset.type] = true;
                    });
                    salvarVisibilidade();
                    rebuildSlides();
                });
                document.getElementById('deselectAllSlides').addEventListener('click', () => {
                    document.querySelectorAll('#slideListContainer input[type="checkbox"]').forEach(cb => {
                        cb.checked = false;
                        slideVisibility[cb.dataset.type] = false;
                    });
                    salvarVisibilidade();
                    rebuildSlides();
                });

                document.getElementById('saveDurationBtn').addEventListener('click', () => {
                    let val = parseInt(document.getElementById('durationInput').value);
                    if (isNaN(val) || val < 5) val = 15;
                    CONFIG.slideInterval = val * 1000;
                    localStorage.setItem('slideDurationSeconds', val);
                    resetarTimer();
                });

                document.getElementById('saveOffsetBtn').addEventListener('click', () => {
                    let val = parseFloat(document.getElementById('manualOffset').value);
                    if (isNaN(val)) val = 0;
                    manualOffsetHours = val;
                    localStorage.setItem('manualOffsetHours', val);
                    document.getElementById('offsetStatus').textContent =
                        `(${val}h = ${val>=0?'+':''}${val}h local)`;
                    if (val !== 0) {
                        horaExataDefinida = null;
                        localStorage.removeItem('exactTimeISO');
                        localStorage.removeItem('exactTimeFixadoEm');
                        document.getElementById('exactDateTimeStatus').textContent = '';
                    }
                    atualizarTodosRelogios();
                });

                document.getElementById('saveExactDateTimeBtn').addEventListener('click', () => {
                    const val = document.getElementById('manualExactDateTime').value;
                    if (!val) {
                        horaExataDefinida = null;
                        localStorage.removeItem('exactTimeISO');
                        localStorage.removeItem('exactTimeFixadoEm');
                        document.getElementById('exactDateTimeStatus').textContent = 'Removido.';
                        return;
                    }
                    const d = new Date(val);
                    horaExataDefinida = d;
                    localStorage.setItem('exactTimeISO', d.toISOString());
                    localStorage.setItem('exactTimeFixadoEm', Date.now());
                    document.getElementById('exactDateTimeStatus').textContent = `Fixado: ${d.toLocaleString('pt-BR')}`;
                    manualOffsetHours = 0;
                    document.getElementById('manualOffset').value = 0;
                    document.getElementById('offsetStatus').textContent = '(0h = local)';
                    atualizarTodosRelogios();
                });
            }

            // ===== CARREGAR DADOS =====
            async function carregarDadosPlanilha() {
                try {
                    const [cadastro, video, faturados, metas, metasGlobaisData, campanhas] = await Promise.all([
                        carregarJSON(BASES.cadastro).catch(() => []),
                        carregarJSON(BASES.video).catch(() => []),
                        carregarJSON(BASES.faturados).catch(() => []),
                        carregarJSON(BASES.metas).catch(() => []),
                        carregarJSON(BASES.metasGlobais).catch(() => []),
                        carregarJSON(BASES.campanhas_especiais).catch(() => [])
                    ]);
                    cadastros = cadastro;
                    videoData = video;
                    allFaturados = faturados;
                    allMetas = metas;
                    metasGlobais = metasGlobaisData;
                    campanhasData = campanhas;

                    if (video.length) {
                        const id = video[0]['id_link'] || video[0]['id'] || '';
                        if (id) currentVideoId = id;
                    }

                    const now = getHoraSincronizada(),
                        ano = now.getFullYear(),
                        mes = now.getMonth() + 1;
                    let fatAno = 0,
                        metaAno = 0;
                    for (let m = 1; m <= 12; m++) {
                        fatAno += Object.values(getFaturamentoPorVendedorMes(ano, m, null)).reduce((a, b) => a + b,
                        0);
                        metaAno += getMetaGlobal(ano, m);
                    }
                    const fatMes = Object.values(getFaturamentoPorVendedorMes(ano, mes, null)).reduce((a, b) => a + b,
                        0);
                    const metaMes = getMetaGlobal(ano, mes);

                    return { fatAno, metaAno, fatMes, metaMes };
                } catch (e) {
                    console.warn('Erro ao carregar dados:', e);
                    return { fatAno: 0, metaAno: 0, fatMes: 0, metaMes: 0 };
                }
            }

            // ===== INIT =====
            async function init() {
                carregarSidebarState();
                document.getElementById('sidebarTopToggle').addEventListener('click', toggleSidebar);

                const savedOffset = localStorage.getItem('manualOffsetHours');
                if (savedOffset) manualOffsetHours = parseFloat(savedOffset);
                const savedExactISO = localStorage.getItem('exactTimeISO');
                const savedFixadoEm = localStorage.getItem('exactTimeFixadoEm');
                if (savedExactISO && savedFixadoEm) {
                    horaExataDefinida = new Date(savedExactISO);
                    document.getElementById('manualExactDateTime').value = horaExataDefinida.toISOString().slice(0,
                    16);
                    document.getElementById('exactDateTimeStatus').textContent =
                        `Fixado: ${horaExataDefinida.toLocaleString('pt-BR')}`;
                }
                document.getElementById('manualOffset').value = manualOffsetHours;
                document.getElementById('offsetStatus').textContent =
                    `(${manualOffsetHours}h = ${manualOffsetHours>=0?'+':''}${manualOffsetHours}h local)`;

                const dados = await carregarDadosPlanilha();
                window._dadosPainel = dados;
                construirSlides(dados);
                iniciarRadioRotacao();
                initSlideManager();
                document.getElementById('loading-overlay').classList.add('hidden');

                document.getElementById('prev-slide-btn').addEventListener('click', () => { slideAnterior();
                    resetarTimer(); });
                document.getElementById('next-slide-btn').addEventListener('click', () => { proximoSlide();
                    resetarTimer(); });
                const pauseBtn = document.getElementById('pause-slide-btn');
                pauseBtn.addEventListener('click', () => {
                    paused = !paused;
                    pauseBtn.innerHTML = paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
                });

                const radioBtn = document.getElementById('radioFloatingBtn');
                const radioSelector = document.getElementById('radioSelector');
                radioBtn.addEventListener('click', (e) => { e.stopPropagation();
                    radioSelector.classList.toggle('active'); });
                document.addEventListener('click', (e) => { if (!radioSelector.contains(e.target) && e.target !==
                        radioBtn) radioSelector.classList.remove('active'); });
                document.addEventListener('keydown', (e) => { if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() ===
                        'r') { e.preventDefault();
                        radioBtn.click(); } });

                setInterval(() => window.location.reload(), CONFIG.reloadInterval);
            }

            init();
        })();
    </script>
</body>
