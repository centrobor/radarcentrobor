            async function verificarEAtualizarDados() {
                try {
                    atualizarSyncBadge('syncing', 'Verificando atualizações...');
                    const [faturados, metas, metasGlobaisData, campanhas, cadastroData, banners, dolar] = await Promise
                        .all([
                            carregarJSON(BASES.faturados).catch(() => null),
                            carregarJSON(BASES.metas).catch(() => null),
                            carregarJSON(BASES.metasGlobais).catch(() => null),
                            carregarJSON(BASES.campanhas_especiais).catch(() => null),
                            carregarJSON(BASES.cadastro).catch(() => null),
                            carregarJSON(BASES.banners).catch(() => null),
                            carregarJSON(BASES.dolar).catch(() => null)
                        ]);

                    const stored = carregarDadosDoStorage();
                    const hasChanged = (arr1, arr2) => {
                        if (!arr1 || !arr2) return true;
                        if (arr1.length !== arr2.length) return true;
                        const keys = ['Data', 'Valor Mercadoria', 'Meta (R$)',
                            'campanha', 'realizado_valor', 'titulo'];
                        for (let i = 0; i < Math.min(arr1.length, arr2.length); i++) {
                            for (let k of keys) {
                                if ((arr1[i][k] || '') !== (arr2[i][k] || '')) return true;
                            }
                        }
                        return false;
                    };

                    let mudou = false;
                    if (faturados && hasChanged(faturados, stored?.allFaturados)) mudou = true;
                    if (metas && hasChanged(metas, stored?.allMetas)) mudou = true;
                    if (metasGlobaisData && hasChanged(metasGlobaisData, stored?.metasGlobais)) mudou = true;
                    if (campanhas && hasChanged(campanhas, stored?.campanhasData)) mudou = true;
                    if (cadastroData && hasChanged(cadastroData, stored?.cadastros)) mudou = true;
                    if (banners && hasChanged(banners, stored?.bannersData)) mudou = true;

                    if (mudou) {
                        if (faturados) allFaturados = faturados;
                        if (metas) allMetas = metas;
                        if (metasGlobaisData) metasGlobais = metasGlobaisData;
                        if (campanhas) campanhasData = campanhas;
                        if (cadastroData) cadastros = cadastroData;
                        if (banners) bannersData = banners;
                        if (dolar) dolarData = dolar;

                        const now = getHoraSincronizada(),
                            ano = now.getFullYear(),
                            mes = now.getMonth() + 1;
                        const mesesNomes = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho',
                            'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
                        ];
                        let fatAno = 0,
                            metaAno = 0;
                        for (let m = 1; m <= 12; m++) {
                            fatAno += Object.values(getFaturamentoPorVendedorMes(ano, m, null)).reduce((a, b) => a +
                                b, 0);
                            metaAno += getMetaGlobal(ano, m);
                        }
                        const fatMes = Object.values(getFaturamentoPorVendedorMes(ano, mes, null)).reduce((a, b) => a +
                            b, 0);
                        const metaMes = getMetaGlobal(ano, mes);
                        let campanhaNome = 'Nenhuma campanha ativa',
                            campanhaPerc = 0,
                            campanhaRealizado = 0,
                            campanhaMeta = 1,
                            diasRestantes = 0,
                            campanhaAtiva = false;
                        const hoje = getHoraSincronizada();
                        hoje.setHours(0, 0, 0, 0);
                        const campanhasAtivas = campanhasData.filter(c => {
                            if (!c.data_inicio || !c.data_fim) return false;
                            const ini = parseDataBR(c.data_inicio),
                                fim = parseDataBR(c.data_fim);
                            return ini && fim && ini <= hoje && hoje <= fim;
                        });
                        if (campanhasAtivas.length > 0) {
                            const camp = campanhasAtivas[0];
                            campanhaNome = camp.campanha || 'Campanha';
                            campanhaRealizado = cleanNumber(camp.realizado_valor);
                            campanhaMeta = cleanNumber(camp.meta_valor);
                            campanhaPerc = campanhaMeta > 0 ? (campanhaRealizado / campanhaMeta) * 100 : 0;
                            const fim = parseDataBR(camp.data_fim);
                            if (fim) diasRestantes = Math.ceil((fim - hoje) / (1000 * 60 * 60 * 24));
                            campanhaAtiva = true;
                        }
                        window._campanhaDetalhes = campanhasAtivas.map(c => ({
                            cod: c.vendedor_cod || 'all',
                            nome: c.vendedor_nome || c.vendedor_cod || 'Time',
                            nomeCampanha: c.campanha,
                            metaTotal: cleanNumber(c.meta_valor),
                            realizadoTotal: cleanNumber(c.realizado_valor),
                            perc: cleanNumber(c.meta_valor) > 0 ? (cleanNumber(c.realizado_valor) / cleanNumber(c
                                .meta_valor)) * 100 : 0,
                            diasRestantes: (() => { const fim = parseDataBR(c.data_fim); return fim ? Math.ceil((
                                    fim - hoje) / (1000 * 60 * 60 * 24)) : 0; })()
                        }));

                        const novosDados = {
                            fatAno,
                            metaAno,
                            fatMes,
                            metaMes,
                            mesLabel: `${mesesNomes[mes-1]}/${ano}`,
                            campanhaNome,
                            campanhaPerc,
                            campanhaRealizado,
                            campanhaMeta,
                            diasRestantes,
                            campanhaAtiva,
                            allFaturados,
                            allMetas,
                            metasGlobais,
                            campanhasData,
                            cadastros,
                            bannersData,
                            dolarData
                        };
                        window._dadosPainel = novosDados;
                        salvarDadosNoStorage(novosDados);

                        processarNovasConquistas(novosDados);

                        await construirSlides(novosDados, true);
                        atualizarSyncBadge('online', 'Dados atualizados!');
                        atualizarLastUpdate();
                    } else {
                        atualizarSyncBadge('online', 'Dados atualizados');
                    }
                } catch (e) {
                    console.warn('Erro na sincronização:', e);
                    const stored = carregarDadosDoStorage();
                    if (stored) {
                        atualizarSyncBadge('offline', 'Utilizando dados locais');
                    } else {
                        atualizarSyncBadge('offline', 'Sem conexão');
                    }
                }
            }

            async function buscarNoticias() {
                try {
                    let articles = [];
                    const url = CONFIG.newsFeed || 'https://newsapi.org/v2/top-headlines?country=br&apiKey=' + CONFIG
                        .newsApiKey;
                    const resp = await fetch(url);
                    if (resp.ok) {
                        const data = await resp.json();
                        if (data.articles && data.articles.length) articles = data.articles.slice(0, 6);
                    } else {
                        throw new Error('NewsAPI status ' + resp.status);
                    }
                    if (!articles.length) {
                        const rssUrl = 'https://rss.uol.com.br/feed/noticias.xml';
                        const rssResp = await fetch(rssUrl);
                        const text = await rssResp.text();
                        const parser = new DOMParser();
                        const xml = parser.parseFromString(text, 'text/xml');
                        const items = xml.querySelectorAll('item');
                        items.forEach(item => {
                            const title = item.querySelector('title')?.textContent || '';
                            const desc = item.querySelector('description')?.textContent || '';
                            const link = item.querySelector('link')?.textContent || '';
                            const pubDate = item.querySelector('pubDate')?.textContent || '';
                            let img = '';
                            const imgMatch = desc.match(/<img[^>]+src="([^">]+)"/);
                            if (imgMatch) img = imgMatch[1];
                            articles.push({ title, description: desc.replace(/<[^>]*>/g, '').substring(0, 150),
                                url: link, publishedAt: pubDate, urlToImage: img });
                        });
                        articles = articles.slice(0, 6);
                    }
                    return articles;
                } catch (e) {
                    console.warn('Erro ao buscar notícias:', e);
                    return [];
                }
            }

                const cw = weatherData.current_weather;

                const temp = Math.round(cw.temperature);
                const code = cw.weathercode;
                function getWeatherInfo(code) {
                    const map = {
                        0: { desc: 'Céu limpo', icon: 'fa-sun' },
                        1: { desc: 'Predominantemente limpo', icon: 'fa-sun' },
                        2: { desc: 'Parcialmente nublado', icon: 'fa-cloud-sun' },
                        3: { desc: 'Nublado', icon: 'fa-cloud' },
                        45: { desc: 'Nevoeiro', icon: 'fa-smog' },
                        48: { desc: 'Nevoeiro com geada', icon: 'fa-smog' },
                        51: { desc: 'Chuvisco fino', icon: 'fa-cloud-rain' },
                        53: { desc: 'Chuvisco moderado', icon: 'fa-cloud-rain' },
                        55: { desc: 'Chuvisco denso', icon: 'fa-cloud-showers-heavy' },
                        61: { desc: 'Chuva fraca', icon: 'fa-cloud-rain' },
                        63: { desc: 'Chuva moderada', icon: 'fa-cloud-rain' },
                        65: { desc: 'Chuva forte', icon: 'fa-cloud-showers-heavy' },
                        71: { desc: 'Neve fraca', icon: 'fa-snowflake' },
                        73: { desc: 'Neve moderada', icon: 'fa-snowflake' },
                        75: { desc: 'Neve forte', icon: 'fa-snowflake' },
                        80: { desc: 'Aguaceiros fracos', icon: 'fa-cloud-rain' },
                        81: { desc: 'Aguaceiros moderados', icon: 'fa-cloud-rain' },
                        82: { desc: 'Aguaceiros fortes', icon: 'fa-cloud-showers-heavy' },
                        95: { desc: 'Tempestade', icon: 'fa-bolt' },
                        96: { desc: 'Tempestade com granizo', icon: 'fa-bolt' },
                        99: { desc: 'Tempestade severa', icon: 'fa-bolt' }
                    };
                    return map[code] || { desc: 'Desconhecido', icon: 'fa-question' };
                }
                const currentInfo = getWeatherInfo(code);
                const feelsLike = Math.round(cw.temperature - 2);
                let forecastHtml = '';
                if (daily && daily.time) {
                    for (let i = 0; i < Math.min(4, daily.time.length); i++) {
                        const d = new Date(daily.time[i]);
                        const dayName = i === 0 ? 'Hoje' : d.toLocaleDateString('pt-BR', { weekday: 'short' });
                        const max = Math.round(daily.temperature_2m_max[i]);
                        const min = Math.round(daily.temperature_2m_min[i]);
                        const info = getWeatherInfo(daily.weathercode[i]);

            function animateValue(id, start, end, duration, prefix = 'R$ ', decimals = 2) {
                const el = document.getElementById(id);
                if (!el) return;
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    const current = start + (end - start) * eased;
                    el.textContent = prefix + (decimals === 0 ? Math.round(current).toLocaleString('pt-BR') : current
                        .toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
                    if (progress < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            }

            function animatePercentValue(id, start, end, duration) {
                const el = document.getElementById(id);
                if (!el) return;
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    const current = start + (end - start) * eased;
                    el.textContent = current.toFixed(1) + '%';
                    if (progress < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            }
