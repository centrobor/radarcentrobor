                            if (elTemp) elTemp.textContent = document.getElementById('temp').textContent;
                        }, 1000);
                    }
                    animarDashboardCompleto(dados);
                    initBirthdayPhysics();
                    allSlides.forEach(s => {
                        if (s.type === 'semestre' && s.ano && s.sem) {
                            setTimeout(() => animarSemestreSlide(s.ano, s.sem, s.meta, s.fat), 300);
                        }
                        if (s.type === 'campanha_alvo' && s.campanhaData) {
                            setTimeout(() => animarCampanhaAlvo(s.campanhaData), 400);
                        }
                    });
                    updateLoadingProgress(100, 'Pronto! ✅');
                    setTimeout(() => {
                        loadingOverlay.classList.add('hidden');
                    }, 500);
                }, 600);
                iniciarTimer();
                atualizarSidebar(0);
            }

            // ===== NAVEGAÇÃO =====
            function irParaSlide(idx) {
                const slidesEl = document.querySelectorAll('.slide');
                const dotsEl = document.querySelectorAll('.dot');
                if (slidesEl.length === 0) return;
                idx = Math.min(Math.max(0, idx), slidesEl.length - 1);
                slidesEl.forEach(s => s.classList.remove('active'));
                dotsEl.forEach(d => d.classList.remove('active'));
                const slideEl = slidesEl[idx];
                const dotEl = dotsEl[idx];
                if (slideEl) slideEl.classList.add('active');
                if (dotEl) dotEl.classList.add('active');
                currentSlideIndex = idx;
                const s = visibleSlides[idx];
                if (s) {
                    if (s.type === 'loading_refresh') {
                        if (refreshTimeout) clearTimeout(refreshTimeout);
                        refreshTimeout = setTimeout(() => {
                            const logoIdx = visibleSlides.findIndex(sl => sl.type === 'logo');
                            if (logoIdx >= 0) {
                                irParaSlide(logoIdx);
                                resetarTimer();
                            }
                        }, 3500);
                    } else {
                        if (refreshTimeout) clearTimeout(refreshTimeout);
                    }
                    if (s.type === 'relogio') {
                        const agora = getHoraAtual();
                        const elHora = document.getElementById('slide-hora');
                        if (elHora) elHora.textContent = agora.toLocaleTimeString('pt-BR', { hour: '2-digit',
                            minute: '2-digit' });
                        const elData = document.getElementById('slide-data');
                        if (elData) elData.textContent = agora.toLocaleDateString('pt-BR', { weekday: 'long',
                            day: '2-digit', month: 'long', year: 'numeric' });
                        const elTemp = document.getElementById('slide-temp');
                        if (elTemp) elTemp.textContent = document.getElementById('temp').textContent;
                    } else if (s.type === 'dashboard') setTimeout(() => animarDashboardCompleto(window._dadosPainel ||
                        {}), 200);
                    else if (s.type === 'monthly_bar') setTimeout(() => animarMonthlyBarChart(window._dadosPainel ||
                        {}), 200);
                    else if (s.type === 'grafico_diario') setTimeout(() => animarGraficoEvolucao(window._dadosPainel ||
                        {}), 200);
                    else if (s.type === 'evolucao_mensal') setTimeout(() => animarEvolucaoMensalSlide(window
                        ._dadosPainel || {}), 200);
                    else if (s.type === 'realizado_meta') setTimeout(() => animarRealizadoMetaSlide(window
                        ._dadosPainel || {}), 200);
                    else if (s.type === 'conquista') dispararConfetes();
                    else if (s.type === 'aniversariantes') setTimeout(initBirthdayPhysics, 100);
                    else if (s.type === 'aniversariante_dia') dispararConfetes();
                    else if (s.type === 'campanha_alvo' && s.campanhaData) {
                        setTimeout(() => animarCampanhaAlvo(s.campanhaData), 300);
                    } else if (s.type === 'semestre' && s.ano && s.sem) {
                        setTimeout(() => animarSemestreSlide(s.ano, s.sem, s.meta, s.fat), 300);
                    }
                }
                atualizarSidebar(idx);
            }

            function proximoSlide() {
                if (visibleSlides.length === 0) return;
                const next = (currentSlideIndex + 1) % visibleSlides.length;
                irParaSlide(next);
            }

            function slideAnterior() {
                if (visibleSlides.length === 0) return;
                const prev = (currentSlideIndex - 1 + visibleSlides.length) % visibleSlides.length;
                irParaSlide(prev);
            }

            function iniciarTimer() {
                if (slideTimer) clearTimeout(slideTimer);
                if (visibleSlides.length === 0) return;
                const s = visibleSlides[currentSlideIndex];
                const duration = (s && s.type === 'video') ? CONFIG.videoSlideDuration :
                    (s && s.type === 'loading_refresh') ? 4000 : CONFIG.slideInterval;
                slideTimer = setTimeout(() => { if (!paused) { proximoSlide();
                        iniciarTimer(); } else { iniciarTimer(); } }, duration);
            }

            function resetarTimer() { if (slideTimer) clearTimeout(slideTimer);
                iniciarTimer(); }

            function dispararConfetes() {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 120, spread: 60, origin: { y: 0.6 }, zIndex: 10000 });
                    setTimeout(() => confetti({ particleCount: 80, angle: 60, spread: 50, origin: { x: 0 },
                        zIndex: 10000 }), 200);
                    setTimeout(() => confetti({ particleCount: 80, angle: 120, spread: 50, origin: { x: 1 },
                        zIndex: 10000 }), 400);
                }
            }

            // ===== SISTEMA DE RÁDIO COM ROTAÇÃO =====
            function carregarRadio(index) {
                const radio = RADIOS[index];
                if (!radio) return;
                const radioBox = document.getElementById('radio-box');
                radioBox.innerHTML = radio.widgetHTML;
                document.getElementById('radioName').textContent = radio.name;
                // Tenta iniciar a rádio automaticamente
                setTimeout(() => {
                    try {
                        const playBtn = document.querySelector(`#${radio.id} .main-play-button`);
                        if (playBtn && !playBtn.classList.contains('playing') && !playBtn.classList.contains(
                                'disabled')) {
                            playBtn.click();
                            radioStarted = true;
                        }
                        const volInput = document.querySelector(`#${radio.id} .volume-control`);
                        if (volInput) {
                            volInput.value = 50;
                            volInput.dispatchEvent(new Event('input'));
                        }
                        const audio = document.querySelector(`#${radio.id} audio`);
                        if (audio) audio.volume = 0.5;
                    } catch (e) { /* ignore */ }
                }, CONFIG.radioInitialDelay);
                currentRadioIndex = index;
                salvarRadioState(index);
            }

            function proximaRadio() {
                const nextIndex = (currentRadioIndex + 1) % RADIOS.length;
                carregarRadio(nextIndex);
            }

            function iniciarRadioRotacao() {
                const savedIndex = carregarRadioState();
                carregarRadio(savedIndex);
                radioTimer = setInterval(proximaRadio, CONFIG.radioInterval);
            }

            // ===== SISTEMA DE VÍDEO =====
            async function buscarVideoAoVivo() {
                try {
                    const apiKey = 'AIzaSyA0rkj5T_8AunHZQ5fhz6ElweGwwFwHScA';
                    const url =
                        `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CONFIG.youtubeChannelId}&eventType=live&type=video&key=${apiKey}&order=date`;
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error('YouTube API error');
                    const data = await resp.json();
                    if (data.items && data.items.length > 0) {
                        const videoId = data.items[0].id.videoId;
                        if (videoId && videoId !== currentVideoId) {
                            currentVideoId = videoId;
                            const iframe = document.getElementById('live-youtube-iframe');
                            if (iframe) {
                                iframe.src =
                                    `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${videoId}&cc_load_policy=1&hl=pt`;
                            }
                            const player = document.getElementById('youtube-player');
                            const placeholder = document.getElementById('videoPlaceholder');
                            if (player && placeholder) {
                                player.style.display = 'block';
                                placeholder.style.display = 'none';
                            }
                            console.log('Vídeo ao vivo atualizado:', videoId);
                        }
                    } else {
                        const fallbackUrl =
                            `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CONFIG.youtubeChannelId}&order=date&type=video&key=${apiKey}&maxResults=1`;
                        const fallbackResp = await fetch(fallbackUrl);
                        if (fallbackResp.ok) {
                            const fallbackData = await fallbackResp.json();
                            if (fallbackData.items && fallbackData.items.length > 0) {
                                const videoId = fallbackData.items[0].id.videoId;
                                if (videoId && videoId !== currentVideoId) {
                                    currentVideoId = videoId;
                                    const iframe = document.getElementById('live-youtube-iframe');
                                    if (iframe) {
                                        iframe.src =
                                            `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${videoId}&cc_load_policy=1&hl=pt`;
                                    }
                                    const player = document.getElementById('youtube-player');
                                    const placeholder = document.getElementById('videoPlaceholder');
                                    if (player && placeholder) {
                                        player.style.display = 'block';
                                        placeholder.style.display = 'none';
                                    }
                                    console.log('Vídeo mais recente (fallback):', videoId);
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn('Erro ao buscar vídeo ao vivo:', e);
                }
            }

            function iniciarAtualizacaoYouTube() {
                buscarVideoAoVivo();
                youtubeRefreshInterval = setInterval(buscarVideoAoVivo, CONFIG.youtubeRefreshInterval);
            }

            // ===== SISTEMA OFFINE FIRST =====
            function atualizarSyncBadge(status, msg) {
                syncBadge.className = 'sync-badge';
                if (status === 'syncing') {
                    syncBadge.classList.add('syncing');
                    syncBadge.innerHTML =
                        `<svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg> ${msg || 'Sincronizando...'}`;
                } else if (status === 'offline') {
                    syncBadge.classList.add('offline');
                    syncBadge.innerHTML =
                        `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> ${msg || 'Sem conexão'}`;
                } else if (status === 'online') {
                    syncBadge.innerHTML =
                        `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> ${msg || 'Dados atualizados'}`;
                } else {
                    syncBadge.innerHTML =
                        `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> ${msg || 'Pronto'}`;
                }
                syncText.textContent = syncBadge.textContent.trim();
            }

            async function verificarEAtualizarDados() {
                try {
                    atualizarSyncBadge('syncing', 'Verificando atualizações...');
                    const [faturados, metas, metasGlobaisData, campanhas, cadastroData, banners, dolar] = await Promise
                        .all([
                            carregarJSON(BASES.faturados).catch(() => null),
                            carregarJSON(BASES.metas).catch(() => null),
                            carregarJSON(BASES.metasGlobais).catch(() => null),
                            carregarJSON(BASES.campanhas_especiais).catch(() => null),
                            carregarJSON(BASES.cadastro).catch(() => null),
                            carregarJSON(BASES.banners).catch(() => null),
                            carregarJSON(BASES.dolar).catch(() => null)
                        ]);

                    const stored = carregarDadosDoStorage();
                    const hasChanged = (arr1, arr2) => {
                        if (!arr1 || !arr2) return true;
                        if (arr1.length !== arr2.length) return true;
                        const keys = ['Data', 'Valor Mercadoria', 'Meta (R$)', 'campanha', 'realizado_valor', 'titulo'];
                        for (let i = 0; i < Math.min(arr1.length, arr2.length); i++) {
                            for (let k of keys) {
                                if ((arr1[i][k] || '') !== (arr2[i][k] || '')) return true;
                            }
                        }
                        return false;
                    };

                    let mudou = false;
                    if (faturados && hasChanged(faturados, stored?.allFaturados)) mudou = true;
                    if (metas && hasChanged(metas, stored?.allMetas)) mudou = true;
                    if (metasGlobaisData && hasChanged(metasGlobaisData, stored?.metasGlobais)) mudou = true;
                    if (campanhas && hasChanged(campanhas, stored?.campanhasData)) mudou = true;
                    if (cadastroData && hasChanged(cadastroData, stored?.cadastros)) mudou = true;
                    if (banners && hasChanged(banners, stored?.bannersData)) mudou = true;

                    if (mudou) {
                        if (faturados) allFaturados = faturados;
                        if (metas) allMetas = metas;
                        if (metasGlobaisData) metasGlobais = metasGlobaisData;
                        if (campanhas) campanhasData = campanhas;
                        if (cadastroData) cadastros = cadastroData;
                        if (banners) bannersData = banners;
                        if (dolar) dolarData = dolar;

                        const now = getHoraAtual(),
                            ano = now.getFullYear(),
                            mes = now.getMonth() + 1;
                        const mesesNomes = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho',
                            'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
                        ];
                        let fatAno = 0,
                            metaAno = 0;
                        for (let m = 1; m <= 12; m++) {
                            fatAno += Object.values(getFaturamentoPorVendedorMes(ano, m, null)).reduce((a, b) => a +
                                b, 0);
                            metaAno += getMetaGlobal(ano, m);
                        }
                        const fatMes = Object.values(getFaturamentoPorVendedorMes(ano, mes, null)).reduce((a, b) => a +
                            b, 0);
                        const metaMes = getMetaGlobal(ano, mes);
                        let campanhaNome = 'Nenhuma campanha ativa',
                            campanhaPerc = 0,
                            campanhaRealizado = 0,
                            campanhaMeta = 1,
                            diasRestantes = 0,
                            campanhaAtiva = false;
                        const hoje = getHoraAtual();
                        hoje.setHours(0, 0, 0, 0);
                        const campanhasAtivas = campanhasData.filter(c => {
                            if (!c.data_inicio || !c.data_fim) return false;
                            const ini = parseDataBR(c.data_inicio),
                                fim = parseDataBR(c.data_fim);
                            return ini && fim && ini <= hoje && hoje <= fim;
                        });
                        if (campanhasAtivas.length > 0) {
                            const camp = campanhasAtivas[0];
                            campanhaNome = camp.campanha || 'Campanha';
                            campanhaRealizado = cleanNumber(camp.realizado_valor);
                            campanhaMeta = cleanNumber(camp.meta_valor);
                            campanhaPerc = campanhaMeta > 0 ? (campanhaRealizado / campanhaMeta) * 100 : 0;
                            const fim = parseDataBR(camp.data_fim);
                            if (fim) diasRestantes = Math.ceil((fim - hoje) / (1000 * 60 * 60 * 24));
                            campanhaAtiva = true;
                        }
                        window._campanhaDetalhes = campanhasAtivas.map(c => ({
                            cod: c.vendedor_cod || 'all',
                            nome: c.vendedor_nome || c.vendedor_cod || 'Time',
                            nomeCampanha: c.campanha,
                            metaTotal: cleanNumber(c.meta_valor),
                            realizadoTotal: cleanNumber(c.realizado_valor),
                            perc: cleanNumber(c.meta_valor) > 0 ? (cleanNumber(c.realizado_valor) / cleanNumber(c
                                .meta_valor)) * 100 : 0,
                            diasRestantes: (() => { const fim = parseDataBR(c.data_fim); return fim ? Math.ceil((
                                    fim - hoje) / (1000 * 60 * 60 * 24)) : 0; })()
                        }));

                        const novosDados = {
                            fatAno,
                            metaAno,
                            fatMes,
                            metaMes,
                            mesLabel: `${mesesNomes[mes-1]}/${ano}`,
                            campanhaNome,
                            campanhaPerc,
                            campanhaRealizado,
                            campanhaMeta,
                            diasRestantes,
                            campanhaAtiva,
                            allFaturados,
                            allMetas,
                            metasGlobais,
                            campanhasData,
                            cadastros,
                            bannersData,
                            dolarData
                        };
                        window._dadosPainel = novosDados;
                        salvarDadosNoStorage(novosDados);
                        await construirSlides(novosDados);
                        atualizarSyncBadge('online', 'Dados atualizados!');
                        atualizarLastUpdate();
                    } else {
                        atualizarSyncBadge('online', 'Dados atualizados');
                    }
                } catch (e) {
                    console.warn('Erro na sincronização:', e);
                    const stored = carregarDadosDoStorage();
                    if (stored) {
                        atualizarSyncBadge('offline', 'Utilizando dados locais');
                    } else {
                        atualizarSyncBadge('offline', 'Sem conexão');
                    }
                }
            }

            function iniciarSincronizacaoAutomatica() {
                setTimeout(verificarEAtualizarDados, 5000);
                backgroundSyncInterval = setInterval(verificarEAtualizarDados, CONFIG.backgroundSyncInterval);
            }

            function atualizarLastUpdate() {
                document.getElementById('last-update-text').textContent =
                    `Atualizado: ${getHoraAtual().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
            }
            setInterval(atualizarLastUpdate, 60000);
            atualizarLastUpdate();

            // ===== SLIDE MANAGER =====
            function initSlideManager() {
                const toggleBtn = document.getElementById('menuToggle');
                const panel = document.getElementById('slideManagerPanel');
                const overlay = document.getElementById('slideManagerOverlay');
                const closeBtn = document.getElementById('closeSlideManager');

                function openPanel() { panel.classList.add('active');
                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden'; }

                function closePanel() { panel.classList.remove('active');
                    overlay.classList.remove('active');
                    document.body.style.overflow = ''; }
                toggleBtn.addEventListener('click', openPanel);
                closeBtn.addEventListener('click', closePanel);
                overlay.addEventListener('click', closePanel);
                document.querySelectorAll('.filter-buttons button[data-filter]').forEach(btn => {
                    btn.addEventListener('click', function() { aplicarFiltro(this.dataset.filter); });
                });
                document.getElementById('selectAllSlides').addEventListener('click', function() {
                    document.querySelectorAll('#slideListContainer input[type="checkbox"]').forEach(cb => {
                        cb.checked = true;
                        slideVisibility[cb.dataset.type] = true;
                    });
                    salvarVisibilidade();
                    rebuildSlides();
                });
                document.getElementById('deselectAllSlides').addEventListener('click', function() {
                    document.querySelectorAll('#slideListContainer input[type="checkbox"]').forEach(cb => {
                        cb.checked = false;
                        slideVisibility[cb.dataset.type] = false;
                    });
                    salvarVisibilidade();
                    rebuildSlides();
                });
            }

            // ===== TOGGLE SIDEBAR =====
            function toggleSidebar() {
                sidebarHidden = !sidebarHidden;
                const mainGrid = document.getElementById('mainGrid');
                const floatToggle = document.getElementById('sidebarFloatToggle');
                const icon = floatToggle.querySelector('svg');
                if (sidebarHidden) {
                    mainGrid.classList.add('sidebar-hidden');
                    icon.innerHTML = '<path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>';
                    floatToggle.classList.remove('hidden');
                } else {
                    mainGrid.classList.remove('sidebar-hidden');
                    icon.innerHTML = '<path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>';
                    floatToggle.classList.add('hidden');
                }
                salvarSidebarState(sidebarHidden);
            }

            // ===== INIT =====
            async function init() {
                initParticles();

                // Sincroniza NTP
                await sincronizarNTP();
                setInterval(sincronizarNTP, CONFIG.ntpSyncInterval);

                // YouTube
                iniciarAtualizacaoYouTube();

                // Rádio
                iniciarRadioRotacao();

                // Sidebar
                sidebarHidden = carregarSidebarState();
                const mainGrid = document.getElementById('mainGrid');
                const floatToggle = document.getElementById('sidebarFloatToggle');
                const icon = floatToggle.querySelector('svg');
                if (sidebarHidden) {
                    mainGrid.classList.add('sidebar-hidden');
                    icon.innerHTML = '<path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>';
                    floatToggle.classList.remove('hidden');
                } else {
                    mainGrid.classList.remove('sidebar-hidden');
                    icon.innerHTML = '<path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>';
                    floatToggle.classList.add('hidden');
                }
                document.getElementById('sidebarFloatToggle').addEventListener('click', toggleSidebar);

                try {
                    window._dadosPainel = await carregarDadosReais();
                    await construirSlides(window._dadosPainel);
                    initBannerSlideshow();
                    initSlideManager();
                    iniciarSincronizacaoAutomatica();
                } catch (e) {
                    const stored = carregarDadosDoStorage();
                    if (stored) {
                        window._dadosPainel = stored;
                        allFaturados = stored.allFaturados || [];
                        allMetas = stored.allMetas || [];
                        metasGlobais = stored.metasGlobais || [];
                        campanhasData = stored.campanhasData || [];
                        cadastros = stored.cadastros || [];
                        bannersData = stored.bannersData || [];
                        dolarData = stored.dolarData || [];
                        await construirSlides(window._dadosPainel);
                        initBannerSlideshow();
                        initSlideManager();
                        atualizarSyncBadge('offline', 'Utilizando dados locais');
                    } else {
                        window._dadosPainel = { fatAno: 8632218.08, metaAno: 17392941.80, fatMes: 720000,
                            metaMes: 1449411.82, mesLabel: 'Julho/2026', campanhaNome: 'Queima de Estoque',
                            campanhaPerc: 68, campanhaRealizado: 54400, campanhaMeta: 80000, diasRestantes: 12,
                            campanhaAtiva: true, allFaturados: [], allMetas: [], metasGlobais: [],
                            campanhasData: [], cadastros: [], bannersData: [], dolarData: [] };
                        await construirSlides(window._dadosPainel);
                        initBannerSlideshow();
                        initSlideManager();
                        atualizarSyncBadge('offline', 'Sem dados');
                    }
                    iniciarSincronizacaoAutomatica();
                }
                document.getElementById('prev-slide-btn').addEventListener('click', () => { slideAnterior();
                    resetarTimer(); });
                document.getElementById('next-slide-btn').addEventListener('click', () => { proximoSlide();
                    resetarTimer(); });
                const pauseBtn = document.getElementById('pause-slide-btn');
                pauseBtn.addEventListener('click', () => {
                    paused = !paused;
                    pauseBtn.innerHTML = paused ?
                        '<svg viewBox="0 0 24 24"><path d="M8 5v14h4V5H8zm8 0v14h4V5h-4z"/></svg>' :
                        '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                });
                setInterval(() => { window.location.reload(); }, CONFIG.reloadInterval);
            }
            init();
        })();
    </script>
