<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Radar Centrobor – Gestão à Vista</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-deep: #0b1a2e;
            --primary: #1e5a7a;
            --green: #2e7d32;
            --accent: #38bdf8;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 16px;
            --bottombar-height: 100px;
            --radar-bg-color: #0a1929;
            --radar-bg-image: none;
            --radar-bg-blur: 0px;
            --radar-bg-brightness: 1;
            --radar-accent: #38bdf8;
            --radar-news-font: 3.2rem;
            --radar-clock-font: 10rem;
            --radar-title-font: 3.4rem;
            --radar-sidebar-width: 50%;
            --radar-slide-transition: 0.5s;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0b1a2e;
            color: var(--text-light);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: linear-gradient(135deg, #0a3d2e, #0b2d4a, #0a4a3a, #0b3b5a, #0a5c3a);
            background-size: cover;
            background-position: center;
            transition: background 0.6s ease, filter 0.6s ease;
        }
        body.radar-bg-solid .animated-bg { background: var(--radar-bg-color) !important; }
        body.radar-bg-image .animated-bg {
            background: var(--radar-bg-color) !important;
            background-image: var(--radar-bg-image) !important;
            filter: blur(var(--radar-bg-blur)) brightness(var(--radar-bg-brightness));
        }
        body.dark-mode .animated-bg,
        body.news-dark .animated-bg {
            background: #000 !important;
            background-image: none !important;
            filter: none !important;
        }
        body[data-radar-theme="light"] {
            --text-light: #0f172a;
            --text-muted: #475569;
            background: #f1f5f9;
            color: #0f172a;
        }
        body[data-radar-theme="light"] .animated-bg {
            background: linear-gradient(135deg, #e0f2fe, #f0f9ff, #e0e7ff) !important;
        }
        body[data-radar-theme="light"] .bottombar,
        body[data-radar-theme="light"] .sidebar-top-toggle,
        body[data-radar-theme="light"] #radioFloatingBtn,
        body[data-radar-theme="light"] #canvaMenuBtn,
        body[data-radar-theme="light"] #radioSelector,
        body[data-radar-theme="light"] .dolar-cotacao,
        body[data-radar-theme="light"] .slide-controls button {
            background: rgba(255,255,255,0.9) !important;
            color: #0f172a !important;
            border-color: rgba(0,0,0,0.08) !important;
        }
        body[data-radar-theme="light"] .clock-center .hora-grande,
        body[data-radar-theme="light"] .clock-center .data-grande { color: #0f172a !important; }
        body[data-radar-theme="light"] .logo-img { filter: brightness(0.6) !important; }
        body[data-radar-theme="light"] .relogio-slide .hora-grande { color: #0f172a; }
        body[data-radar-theme="light"] .relogio-slide .data-grande { color: rgba(15,23,42,0.85); }
        body[data-radar-theme="light"] .relogio-slide .clima-grande {
            color: #0f172a;
            background: rgba(255,255,255,0.5);
            border-color: rgba(0,0,0,0.08);
        }
        .app-layer { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

        .sidebar-top-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 60;
            background: rgba(11,26,46,0.85);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 50%;
            width: 44px; height: 44px; color: #fff; font-size: 1.2rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        body.dark-mode .sidebar-top-toggle { background: rgba(0,0,0,0.85); }
        .sidebar-top-toggle:hover { background: color-mix(in srgb, var(--radar-accent) 35%, transparent); border-color: var(--radar-accent); transform: scale(1.05); }
        .sidebar-top-toggle i { transition: transform 0.3s ease; }
        .sidebar-top-toggle.hidden-sidebar i { transform: rotate(180deg); }

        .bottombar {
            height: var(--bottombar-height);
            background: rgba(11,26,46,0.85);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; z-index: 10; order: 2; padding: 0 20px; position: relative;
            transition: height 0.5s ease, opacity 0.5s ease, padding 0.5s ease, background 0.5s ease;
            overflow: hidden;
        }
        body.dark-mode .bottombar { background: rgba(0,0,0,0.95); border-top-color: rgba(255,255,255,0.04); }
        body.news-dark .bottombar { background: rgba(0,0,0,0.95) !important; }
        .bottombar.canva-active { height: 0; padding: 0; opacity: 0; pointer-events: none; }
        .clock-center { display: flex; flex-direction: column; align-items: center; gap: 2px; transition: opacity 0.5s ease; }
        .bottombar.canva-active .clock-center { opacity: 0; pointer-events: none; }
        .clock-center .hora-grande {
            font-size: 4rem; font-weight: 700; color: #fff; letter-spacing: 3px; line-height: 1;
            font-size: calc(var(--radar-clock-font) * 0.33);
        }
        .clock-center .data-grande { font-size: 1.3rem; color: rgba(255,255,255,0.65); font-weight: 300; letter-spacing: 1px; }
        .logo-img {
            height: 38px; width: auto; object-fit: contain; position: absolute; left: 24px;
            opacity: 0.4; filter: brightness(1.2); transition: opacity 0.5s ease;
        }
        .bottombar.canva-active .logo-img { opacity: 0; }
        .dolar-cotacao {
            position: absolute; right: 80px; display: flex; align-items: center; gap: 8px;
            background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 1.2rem; font-weight: 600; color: #4caf50; letter-spacing: 0.5px;
            transition: all 0.5s ease;
        }
        .bottombar.canva-active .dolar-cotacao { opacity: 0; pointer-events: none; }
        .dolar-cotacao i { color: #facc15; font-size: 1rem; }
        .menu-toggle {
            background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer;
            padding: 8px 10px; border-radius: 10px; transition: 0.2s; position: absolute; right: 20px;
        }
        .bottombar.canva-active .menu-toggle { display: none; }
        .menu-toggle:hover { background: rgba(255,255,255,0.08); }
        #canvaMenuBtn {
            position: fixed; top: 16px; left: 16px; z-index: 70;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
            width: 40px; height: 40px; color: #fff; font-size: 1.1rem;
            cursor: pointer; display: none; align-items: center; justify-content: center;
            transition: background 0.2s; box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        #canvaMenuBtn:hover { background: color-mix(in srgb, var(--radar-accent) 30%, transparent); }
        .watermark {
            position: fixed; bottom: 55px; right: 25px; z-index: 20;
            color: rgba(255,255,255,0.55); font-size: 1.8rem; font-weight: 600;
            text-align: right; pointer-events: none; opacity: 0;
            transition: opacity 0.5s ease, bottom 0.5s ease, right 0.5s ease;
            text-shadow: 0 2px 12px rgba(0,0,0,0.7); line-height: 1;
        }
        .watermark.active { opacity: 1; bottom: 20px; right: 20px; }
        .bottombar.relogio-active .clock-center { opacity: 0; pointer-events: none; }
        .bottombar.relogio-active .dolar-cotacao {
            right: 50%; transform: translateX(50%);
            background: rgba(76,175,80,0.15);
            font-size: 1.6rem; padding: 10px 24px; border-color: #4caf50;
        }
        body.dolar-slide-active .dolar-cotacao {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        .main-grid {
            flex: 1; display: flex; gap: 16px; padding: 16px; min-height: 0; z-index: 1;
            order: 1; position: relative; overflow: hidden; transition: gap 0.4s, flex-direction 0.4s;
        }
        body[data-radar-sidebar-pos="left"] .main-grid { flex-direction: row-reverse; }

        .slides-zone {
            flex: 1; min-width: 0; position: relative; border-radius: var(--radius-xl);
            overflow: hidden; background: transparent; border: 1px solid rgba(255,255,255,0.06);
            aspect-ratio: 16/9; max-height: 100%; min-height: 300px; width: 100%;
            transition: flex 0.4s;
        }
        .sidebar-right {
            flex: 0 0 var(--radar-sidebar-width);
            max-width: 70%;
            display: flex; flex-direction: column; gap: 16px; min-height: 0;
            transition: flex 0.4s, opacity 0.4s; overflow: hidden;
            opacity: 1;
        }
        .main-grid.sidebar-hidden .sidebar-right { flex: 0 0 0; opacity: 0; margin: 0; padding: 0; gap: 0; overflow: hidden; }
        .video-box {
            flex: 1; border-radius: var(--radius-lg); overflow: hidden;
            background: rgba(0,0,0,0.6); min-height: 200px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .radio-embed {
            background: rgba(0,0,0,0.5); border-radius: var(--radius-md); overflow: hidden;
            flex-shrink: 0; height: 75px; border: 1px solid rgba(255,255,255,0.06);
        }
        .radio-embed iframe { width: 100%; height: 100%; border: none; }
        .radio-embed.hidden { display: none !important; }
        .sidebar-right.no-radio .video-box { flex: 1; }
        .second-slide-pane {
            flex: 1; border-radius: var(--radius-lg); overflow: hidden;
            background: rgba(0,0,0,0.6); min-height: 200px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative; display: none;
        }
        body[data-radar-layout="two-slides"] .second-slide-pane { display: block; }
        body[data-radar-layout="two-slides"] .video-box,
        body[data-radar-layout="two-slides"] .radio-embed { display: none !important; }

        #single-player {
            position: fixed;
            z-index: 4;
            border: 0;
            background: #000;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #second-player {
            position: fixed;
            z-index: 3;
            border: 0;
            background: #000;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #video-title-bar {
            position: fixed;
            z-index: 5;
            display: none;
            align-items: center;
            gap: 14px;
            padding: 14px 26px;
            background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.65) 70%, rgba(0,0,0,0) 100%);
            color: #fff;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            pointer-events: none;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            text-shadow: 0 2px 12px rgba(0,0,0,0.7);
        }
        #video-title-bar.active { display: flex; }
        #video-title-bar i {
            font-size: 2rem;
            color: #ffffff;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.6));
            animation: ballSpin 8s linear infinite;
        }
        #video-title-bar .title-text {
            background: linear-gradient(90deg, #ffffff 0%, #e2e8f0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body[data-radar-animation="none"] #video-title-bar i,
        body[data-radar-animation="subtle"] #video-title-bar i { animation: none; }
        @keyframes ballSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            transition: opacity var(--radar-slide-transition) ease, transform var(--radar-slide-transition) ease;
            transform: scale(0.98);
            display: flex; align-items: center; justify-content: center; text-align: center;
            pointer-events: none; border-radius: var(--radius-xl); overflow: hidden;
        }
        .slide::before {
            content: ''; position: absolute; inset: 0; z-index: 0;
            background: linear-gradient(135deg, rgba(10,60,40,0.25) 0%, rgba(11,45,70,0.25) 50%, rgba(10,70,50,0.25) 100%);
            pointer-events: none; border-radius: var(--radius-xl);
        }
        .slide > * { position: relative; z-index: 1; }
        .slide.active { opacity: 1; transform: scale(1); z-index: 2; pointer-events: auto; }
        body[data-radar-transition="slide"] .slide { transform: translateX(100%); }
        body[data-radar-transition="slide"] .slide.active { transform: translateX(0); }
        body[data-radar-transition="zoom"] .slide { transform: scale(0.6); }
        body[data-radar-transition="zoom"] .slide.active { transform: scale(1); }
        body[data-radar-transition="none"] .slide { transition: none; }

        .slide.weather-active::before { display: none !important; }
        .slide[data-type="previsao_tempo"] { background-color: #000; }
        .slide.weather-active { background-color: #000 !important; }
        .slide[data-type="dolar"]::before,
        .slide[data-type="noticias_rss"]::before,
        .slide[data-type="video"]::before,
        .slide[data-type="relogio"]::before { display: none !important; }
        .slide[data-type="video"], .slide[data-type="relogio"] { background: transparent; }
        body.dark-mode .slide { background-color: #000; }
        body.dark-mode .slide[data-type="video"] { background: transparent; }

        .relogio-slide { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: transparent; }
        .relogio-content { padding: 50px 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 40%; }
        .relogio-slide .hora-grande {
            font-size: var(--radar-clock-font);
            font-weight: 700; color: #fff; letter-spacing: 4px; line-height: 1;
        }
        .relogio-slide .data-grande { font-size: 2.6rem; color: rgba(255,255,255,0.95); margin-top: 12px; font-weight: 300; letter-spacing: 2px; }
        .relogio-slide .clima-grande {
            font-size: 2rem; color: rgba(255,255,255,0.95); margin-top: 16px;
            display: flex; align-items: center; gap: 16px;
            background: rgba(0,0,0,0.3); padding: 8px 24px; border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .logo-slide { display: flex; align-items: center; justify-content: center; height: 100%; width: 100%; padding: 20px; }
        .logo-slide img { max-height: 55%; max-width: 75%; object-fit: contain; filter: drop-shadow(0 0 40px rgba(0,0,0,0.5)); }

        .birthday-hero-slide { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .bg-blur { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.12; z-index: 0; }
        .hero-content {
            position: relative; z-index: 1; text-align: center; padding: 45px 65px;
            background: rgba(0,0,0,0.55); border-radius: var(--radius-xl);
            border: 1px solid rgba(255,215,0,0.25); max-width: 90%;
        }
        .hero-avatar {
            width: 120px; height: 120px; border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            display: flex; align-items: center; justify-content: center;
            font-size: 4rem; color: #fff; margin: 0 auto 16px;
        }
        .hero-name { font-size: 4rem; font-weight: 800; color: #fff; text-shadow: 0 3px 30px rgba(0,0,0,0.6); margin-bottom: 8px; }
        .hero-date { font-size: 1.8rem; color: #ffd700; font-weight: 500; }
        .hero-msg {
            font-size: 1.4rem; color: rgba(255,255,255,0.9); margin-top: 16px;
            background: rgba(255,215,0,0.1); padding: 10px 24px; border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.2); display: inline-block;
        }
        .hero-days { font-size: 1.2rem; color: rgba(255,255,255,0.7); margin-top: 12px; }
        .birthday-week-slide { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        .week-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.08; z-index: 0; }
        .birthday-week-slide h2 { position: relative; z-index: 1; color: #fff; font-size: 2.4rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
        .birthday-week-grid {
            position: relative; z-index: 1;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px; width: 100%; max-width: 1000px; max-height: 70%;
            overflow-y: auto; padding: 10px 4px;
        }
        .birthday-week-card {
            background: rgba(255,255,255,0.06); border-radius: var(--radius-md);
            padding: 20px 16px; text-align: center; border: 1px solid rgba(255,255,255,0.12);
        }
        .avatar-sm {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(255,215,0,0.15); display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #ffd700; margin: 0 auto 8px;
            border: 2px solid rgba(255,215,0,0.2);
        }
        .b-name { font-weight: 700; color: #fff; font-size: 1.1rem; }
        .b-role { font-size: 0.8rem; color: rgba(255,255,255,0.7); }
        .b-date { font-size: 0.8rem; color: #ffd700; font-weight: 600; }
        .b-days { font-size: 0.7rem; color: rgba(255,255,255,0.5); }

        .weather-slide {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 18px 28px; overflow: hidden; background-color: #000;
        }
        .weather-slide .weather-bg {
            position: absolute; inset: 0; z-index: 0;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            filter: brightness(0.65); background-color: #000;
        }
        .weather-slide .weather-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(160deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }
        .weather-slide .weather-content { position: relative; z-index: 2; width: 100%; max-width: 1180px; display: flex; flex-direction: column; gap: 28px; }
        .weather-slide .weather-top { display: flex; align-items: center; justify-content: flex-start; gap: 40px; }
        .weather-slide .weather-current { display: flex; align-items: center; gap: 36px; }
        .weather-slide .temp-big { font-size: 9rem; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -4px; }
        .weather-slide .current-info { text-align: left; }
        .weather-slide .current-condition { font-size: 2.5rem; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
        .weather-slide .current-condition i { font-size: 3.2rem; color: #facc15; }
        .weather-slide .current-details { display: flex; gap: 24px; font-size: 1.25rem; color: rgba(255,255,255,0.75); }
        .weather-slide .current-details span { display: flex; align-items: center; gap: 8px; }
        .weather-slide .hourly-row { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .weather-slide .hourly-row::-webkit-scrollbar { display: none; }
        .weather-slide .hour-card { background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 20px 22px; min-width: 120px; text-align: center; flex-shrink: 0; }
        .weather-slide .hour-time { font-size: 1.1rem; color: rgba(255,255,255,0.65); font-weight: 600; margin-bottom: 8px; }
        .weather-slide .hour-icon { font-size: 2.3rem; color: #fff; margin: 8px 0; }
        .weather-slide .hour-temp { font-size: 1.7rem; font-weight: 700; color: #fff; }
        .weather-slide .daily-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
        .weather-slide .day-card { background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.13); border-radius: 20px; padding: 22px 14px; text-align: center; }
        .weather-slide .day-name { font-size: 1.15rem; font-weight: 600; color: rgba(255,255,255,0.8); margin-bottom: 8px; }
        .weather-slide .day-icon { font-size: 2.5rem; color: #fff; margin: 10px 0; }
        .weather-slide .day-temps { font-size: 1.45rem; font-weight: 700; color: #fff; }
        .weather-slide .day-temps span { color: rgba(255,255,255,0.5); font-weight: 500; font-size: 1.2rem; }

        .noticias-rss-slide { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .noticias-rss-slide .rss-bg { position: absolute; inset: 0; background-size: cover; background-position: center; background-repeat: no-repeat; z-index: 0; background-color: #000; }
        .noticias-rss-slide .rss-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.78) 85%); z-index: 1; }
        .noticias-rss-slide .rss-header {
            position: absolute; top: 28px; left: 32px; z-index: 3;
            display: flex; align-items: center; gap: 12px;
            background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 20px 10px 16px; border-radius: 40px;
        }

            const drawProgressPlugin = {
                id: 'radarDrawProgress',
                beforeDatasetsDraw(chart) {
                    const progress = chart._drawProgress;
                    // Se não definido ou já no final, nada é cortado
                    if (progress === undefined || progress >= 1) return;
                    const { ctx, chartArea } = chart;
                    if (!chartArea) return;

                    // Calcula a largura visível com base no progresso (0 = nada, 1 = tudo)
                    const totalW = chartArea.right - chartArea.left;
                    const visibleW = totalW * progress;

                    ctx.save();
                    ctx.beginPath();
                    // Retângulo que revela só a parte já "desenhada"
                    ctx.rect(chartArea.left, chartArea.top, visibleW, chartArea.bottom - chartArea.top);
                    ctx.clip();
                    chart._clipped = true;
                },
                afterDatasetsDraw(chart) {
                    if (chart._clipped) {
                        chart.ctx.restore();
                        chart._clipped = false;
                    }
                }
            };

            function animateNumber(el, target, duration = 2400, formatter = (v) => v.toFixed(2).replace('.', ',')) {
                if (!el) return;
                if (!radarNumbersAnimated || radarAnimation === 'none') {
                    el.textContent = formatter(target);
                    return;
                }
                if (el._animRaf) cancelAnimationFrame(el._animRaf);

                const rawAtual = (el.textContent || '').replace(/[^\d,.-]/g, '').replace(',', '.');
                const from = parseFloat(rawAtual) || 0;
                const start = performance.now();

                function step(t) {
                    const p = Math.min(1, (t - start) / duration);
                    const eased = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
                    const v = from + (target - from) * eased;
                    el.textContent = formatter(v);
                    if (p < 1) {
                        el._animRaf = requestAnimationFrame(step);
                    } else {
                        el.textContent = formatter(target);
                        el._animRaf = null;
                    }
                }
                el._animRaf = requestAnimationFrame(step);
            }

                if (code <= 48) return 'fa-cloud';
                if (code <= 67) return 'fa-cloud-rain';

            }
            function getWeatherDesc(code) {
                if (code <= 1) return 'Céu limpo';
                if (code <= 3) return 'Parcialmente nublado';
                if (code <= 48) return 'Nublado';
                if (code <= 67) return 'Chuva';
                if (code <= 77) return 'Neve';
                return 'Tempestade';
            }
            function getWeatherBackground(code, now) {
                const hour = now.getHours();
                const isDay = hour >= 6 && hour < 18;
                const isSunset = hour >= 17 && hour < 19;
                let category = 'cloudy';
                if (code === 0) {
                    if (isSunset) category = 'clear_sunset';
                    else if (isDay) category = 'clear_day';
                    else category = 'clear_night';
                } else if (code >= 1 && code <= 3) {
                    category = isDay ? 'partly_day' : 'partly_night';
                } else if (code >= 4 && code <= 48) category = 'cloudy';
                else if (code >= 51 && code <= 67) category = 'rainy';
                else if (code >= 71 && code <= 77) category = 'snowy';
                else if (code >= 80) category = 'storm';
                const images = WEATHER_BACKGROUNDS[category] || WEATHER_BACKGROUNDS.cloudy;
                let selected;
                if (images.length === 1) selected = images[0];
                else {
                    const available = images.filter(img => img !== lastWeatherBg);
                    selected = available.length ? available[Math.floor(Math.random() * available.length)] : images[0];
                }
                lastWeatherBg = selected;
                return selected;
            }

            function buildWeatherSlide(data) {
                if (!data?.current_weather) return null;
                const agora = getHoraSincronizada();
                const cw = data.current_weather;
                const temp = Math.round(cw.temperature);
                const icon = getWeatherIcon(cw.weathercode);
                const desc = getWeatherDesc(cw.weathercode);
                const bgImage = getWeatherBackground(cw.weathercode, agora);
                const hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
                let startIndex = 0;
                if (data.daily && data.daily.time) {
                    for (let i = 0; i < data.daily.time.length; i++) {
                        const d = new Date(data.daily.time[i]);
                        const diaAPI = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                        if (diaAPI.getTime() === hoje.getTime()) { startIndex = i; break; }
                    }
                }
                let hourlyHtml = '';
                if (data.hourly?.time) {
                    let count = 0;
                    for (let i = 0; i < data.hourly.time.length && count < 6; i++) {
                        const t = new Date(data.hourly.time[i]);
                        if (t > agora) {
                            const h = t.getHours().toString().padStart(2, '0') + 'h';
                            const te = Math.round(data.hourly.temperature_2m[i]);
                            const ic = getWeatherIcon(data.hourly.weathercode[i]);
                            hourlyHtml += `<div class="hour-card"><div class="hour-time">${h}</div><div class="hour-icon"><i class="fas ${ic}"></i></div><div class="hour-temp">${te}°</div></div>`;
                            count++;
                        }
                    }
                }
                let dailyHtml = '';
                if (data.daily?.time) {
                    for (let i = startIndex; i < Math.min(startIndex + 5, data.daily.time.length); i++) {
                        const d = new Date(data.daily.time[i]);
                        const isHoje = (i === startIndex);
                        const name = isHoje ? 'Hoje' : d.toLocaleDateString('pt-BR', { weekday: 'short' });
                        const max = Math.round(data.daily.temperature_2m_max[i]);
                        const min = Math.round(data.daily.temperature_2m_min[i]);
                        const ic = getWeatherIcon(data.daily.weathercode[i]);
                        dailyHtml += `<div class="day-card"><div class="day-name">${name}</div><div class="day-icon"><i class="fas ${ic}"></i></div><div class="day-temps">${max}° <span>/ ${min}°</span></div></div>`;
                    }
                }
                return `<div class="weather-slide">
                    <div class="weather-bg" style="background-image: url('${bgImage}'); background-color: #000;"></div>
                    <div class="weather-overlay"></div>
                    <div class="weather-content">
                        <div class="weather-top"><div class="weather-current">
                            <div class="temp-big">${temp}°</div>
                            <div class="current-info">

                        <div class="daily-row">${dailyHtml}</div>
                    </div>

            function limparTextoHtml(html) {
                if (!html) return '';
                return String(html).replace(/<[^>]+>/g, ' ').replace(/&nbsp;|&amp;|&quot;|&#39;|&lt;|&gt;/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
            }
            function isBlacklisted(texto) {
                if (!texto) return false;
                const t = texto.toLowerCase();
                return NEWS_BLACKLIST.some(b => t.includes(b));
            }
            function pontuarNoticia(item, isTecMundo) {
                const titulo = (item.title || '').toLowerCase();
                const desc = limparTextoHtml(item.description || item.content || '');
                const cats = Array.isArray(item.categories) ? item.categories.join(' ').toLowerCase() : String(item.categories || '').toLowerCase();
                const textoFull = `${titulo} ${titulo} ${desc} ${cats}`;
                if (isBlacklisted(textoFull)) return { score: -100, categoria: 'bloqueada', matches: [] };
                let score = 0;
                const matches = [];
                let bestCat = 'geral';
                let bestWeight = 0;
                for (const [catName, cat] of Object.entries(NEWS_CATEGORIES)) {
                    let hits = 0;
                    for (const word of cat.words) {
                        const w = word.toLowerCase().trim();
                        if (w.length < 2) continue;
                        if (textoFull.includes(w)) { hits++; matches.push(w); }
                    }
                    if (hits > 0) {
                        score += hits * cat.weight;
                        if (cat.weight > bestWeight) { bestWeight = cat.weight; bestCat = catName; }
                    }
                }
                if (matches.length === 0) return { score: 0, categoria: 'geral', matches: [], ageHours: 9999 };
                if (isTecMundo) { score += 2; if (bestCat === 'geral') bestCat = 'tecnologia_ia'; }
                let ageHours = 9999;
                if (item.pubDate) {
                    const ts = new Date(item.pubDate).getTime();
                    if (!isNaN(ts)) {
                        ageHours = (Date.now() - ts) / 3600000;
                        if (ageHours < 0) ageHours = 0;
                        if (ageHours < 1) score += 8;
                        else if (ageHours < 3) score += 6;
                        else if (ageHours < 6) score += 4;
                        else if (ageHours < 12) score += 3;
                        else if (ageHours < 24) score += 2;
                        else if (ageHours < 48) score += 0.5;
                        else if (ageHours > 72) score -= 3;
                        else if (ageHours > 48) score -= 1;
                    }
                }
                const uniqueCats = new Set();
                for (const cat of Object.values(NEWS_CATEGORIES)) {
                    if (cat.words.some(w => textoFull.includes(w.toLowerCase().trim()))) uniqueCats.add(cat);
                }
                if (uniqueCats.size >= 2) score += 2;
                if (uniqueCats.size >= 3) score += 2;
                return { score, categoria: bestCat, matches: [...new Set(matches)].slice(0, 8), ageHours };
            }

            function isImagemInvalida(src) {
                if (!src || typeof src !== 'string') return true;
                const s = src.toLowerCase();
                if (s.includes('g1.png') || s.includes('/144x0/') || s.includes('pox/g1')) return true;
                if (s.includes('logo') || s.includes('icon') || s.includes('favicon')) return true;
                if (s.includes('placeholder') || s.includes('default-image')) return true;
                if (/\/\d{1,3}x\d{1,3}\//.test(s) && !/\/\d{3,}x\d{3,}\//.test(s)) return true;
                return false;
            }

            function extrairImagemRss(item) {
                let candidatas = [];
                if (item.thumbnail && !isImagemInvalida(item.thumbnail)) candidatas.push(item.thumbnail);
                if (item.enclosure && item.enclosure.link) {
                    const link = item.enclosure.link;
                    const type = (item.enclosure.type || '').toLowerCase();
                    if ((type.includes('image') || /\.(jpe?g|png|webp|gif)(\?|$)/i.test(link)) && !isImagemInvalida(link)) candidatas.push(link);
                }
                const htmls = [item.content, item.description].filter(Boolean);
                for (const html of htmls) {
                    const matches = [...String(html).matchAll(/<img[^>]+src=["']([^"']+)["'][^>]*>/gi)];
                    for (const m of matches) {
                        let src = m[1];
                        if (src.startsWith('//')) src = 'https:' + src;
                        if (src.startsWith('http') && !isImagemInvalida(src)) candidatas.push(src);
                    }
                }
                const preferidas = candidatas.filter(u => /s2-g1\.glbimg|i\.s3\.glbimg|tecmundo|uol|estadao|folha|reuters|apnews|nytimes|cnn|bbc/i.test(u) || /\/\d{3,}x\d{3,}\//.test(u) || /\.(jpe?g|png|webp)(\?|$)/i.test(u));
                if (preferidas.length) return preferidas[0];
                if (candidatas.length) return candidatas[0];
                return 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1600&q=80';
            }

            function diversificarNoticias(lista) {
                if (lista.length <= 3) return lista;
                const porCat = {};
                lista.forEach(n => { const c = n.categoria || 'geral'; if (!porCat[c]) porCat[c] = []; porCat[c].push(n); });
                const cats = Object.keys(porCat).sort((a, b) => porCat[b].length - porCat[a].length);
                const resultado = [];
                let houve = true;
                while (houve && resultado.length < lista.length) {
                    houve = false;
                    for (const c of cats) {
                        if (porCat[c] && porCat[c].length) {
                            if (resultado.length && resultado[resultado.length - 1].categoria === c && cats.length > 1) continue;
                            resultado.push(porCat[c].shift());
                            houve = true;
                        }
                    }
                    if (!houve) {
                        for (const c of cats) {
                            if (porCat[c] && porCat[c].length) { resultado.push(porCat[c].shift()); houve = true; break; }
                        }
                    }
                }
                return resultado;
            }

            function nomeFonteDoFeed(url) {
                const u = (url || '').toLowerCase();
                if (u.includes('g1.globo')) return 'G1';

            async function buscarNoticiasRss() {
                let todas = [];
                const urlsEmbaralhadas = shuffleArray(CONFIG.noticiasRssUrls);
                const qtdFeeds = Math.min(urlsEmbaralhadas.length, Math.max(8, Math.floor(8 + Math.random() * 6)));
                const urlsParaBuscar = urlsEmbaralhadas.slice(0, qtdFeeds);

                for (const url of urlsParaBuscar) {
                    try {
                        const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
                        const resposta = await fetch(proxyUrl);
                        if (!resposta.ok) continue;
                        const json = await resposta.json();
                        if (json && json.status === 'ok' && Array.isArray(json.items) && json.items.length) {
                            const isTec = url.includes('tecmundo');
                            const fonteFeed = nomeFonteDoFeed(url);
                            const items = json.items.map(item => {
                                const { score, categoria, matches, ageHours } = pontuarNoticia(item, isTec);
                                return { title: item.title || 'Sem título', link: item.link || '#', pubDate: item.pubDate || item.published || '', fonte: fonteFeed, imagem: extrairImagemRss(item), score, categoria, matches, ageHours: ageHours ?? 9999 };
                            });
                            todas = todas.concat(items);
                        }
                    } catch (e) {}
                }

                const vistos = new Set();
                let unicas = todas.filter(item => {
                    const chave = item.title.toLowerCase().trim();
                    if (vistos.has(chave)) return false;
                    vistos.add(chave);
                    return true;
                });

                const minScore = CONFIG.noticiasMinScore || 3;
                unicas = unicas.filter(n => n.score >= minScore && Array.isArray(n.matches) && n.matches.length > 0 && n.categoria !== 'bloqueada' && n.categoria !== 'geral' && (n.ageHours <= 72 || n.score >= 12));
                unicas.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return (a.ageHours || 9999) - (b.ageHours || 9999);
                });

                let lista = diversificarNoticias(unicas).slice(0, CONFIG.noticiasMaxItems);
                if (lista.length < 4) {
                    const fallback = todas.filter(n => n.score > 0 && n.matches && n.matches.length > 0 && (n.ageHours <= 72 || n.score >= 10))
                        .sort((a, b) => b.score - a.score || (a.ageHours || 9999) - (b.ageHours || 9999)).slice(0, 15);
                    const vistos2 = new Set(lista.map(n => n.title.toLowerCase()));
                    fallback.forEach(n => {
                        const k = n.title.toLowerCase();
                        if (!vistos2.has(k)) { vistos2.add(k); lista.push(n); }
                    });
                    lista = diversificarNoticias(lista).slice(0, CONFIG.noticiasMaxItems);
                }

                const corte = Math.max(4, Math.ceil(lista.length * 0.6));
                const topo = shuffleArray(lista.slice(0, corte));
                const resto = lista.slice(corte);
                noticiasRss = topo.concat(resto);
                lastNewsFetch = Date.now();
            }

            function parseDataInicioBR(str) {
                if (!str) return null;
                const p = str.split(/[/-]/);
                if (p.length < 3) return null;
                return new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10), 0, 0, 0);

            function parseValorBR(str) {
                if (!str || str === '') return 0;
                const s = String(str).replace(/[R$\s]/g, '').replace(/\./g, '').replace(',', '.');

                return isNaN(n) ? 0 : n;

            function animarRingCountdown(valorFinal, totalDias, duracaoTotal = 2000) {
                const el = document.getElementById('ringNumber');
                const circle = document.getElementById('ringCircle');
                const percentEl = document.getElementById('ringPercent');
                if (!el || !circle || ringAnimRunning) return;
                ringAnimRunning = true;

                const inicio = 31;
                const animar = radarNumbersAnimated && radarAnimation !== 'none';
                const circumference = 2 * Math.PI * 130;

                const percFinal = Math.min(100, Math.round(((totalDias - valorFinal) / totalDias) * 100));
                const offsetFinal = circumference - (percFinal / 100) * circumference;

                el.textContent = inicio;
                circle.style.strokeDasharray = circumference;
                circle.style.strokeDashoffset = circumference;

                if (!animar) {
                    el.textContent = valorFinal;
                    circle.style.strokeDashoffset = offsetFinal;
                    if (percentEl) percentEl.innerHTML = `${percFinal}% <span>do período concluído</span>`;
                    ringAnimRunning = false;
                    return;
                }

                const totalSteps = Math.max(1, inicio - valorFinal);
                const stepTime = Math.max(40, Math.floor(duracaoTotal / totalSteps));
                let atual = inicio;

                const timer = setInterval(() => {
                    atual--;
                    if (atual < valorFinal) {
                        clearInterval(timer);
                        el.textContent = valorFinal;
                        circle.style.strokeDashoffset = offsetFinal;
                        if (percentEl) percentEl.innerHTML = `${percFinal}% <span>do período concluído</span>`;
                        ringAnimRunning = false;
                        return;
                    }
                    el.textContent = atual;
                    const percAtual = Math.min(100, Math.round(((totalDias - atual) / totalDias) * 100));
                    circle.style.strokeDashoffset = circumference - (percAtual / 100) * circumference;
                    if (percentEl) percentEl.innerHTML = `${percAtual}% <span>do período concluído</span>`;
                }, stepTime);
            }

            async function obterDadosDolarCompletos() {
                const [atualApi, histApi] = await Promise.all([buscarDolarAtual(), buscarDolarHistorico(30)]);
                if (histApi && histApi.labels && histApi.labels.length >= 2) {
                    let cotacao = atualApi ? atualApi.cotacao : histApi.valores[histApi.valores.length - 1];
                    let variacao = atualApi ? atualApi.variacao : 0;
                    if (!atualApi && histApi.valores.length >= 2) {
                        const u = histApi.valores[histApi.valores.length - 1];
                        const p = histApi.valores[histApi.valores.length - 2];
                        if (p > 0) variacao = ((u - p) / p) * 100;
                    }
                    if (!cotacao) cotacao = histApi.valores[histApi.valores.length - 1];
                    return { labels: histApi.labels, valores: histApi.valores, cotacao, variacao, fonte: 'api' };
                }
                const sheet = await buscarDolarDoSheet();
                if (sheet) return sheet;
                const cache = Store.get('dolarCache', null);
                if (cache && cache.valor) {
                    const num = parseValorBR(cache.valor);
                    if (num > 0) return { labels: ['Hoje'], valores: [num], cotacao: num, variacao: 0, fonte: 'cache' };
                }
                return null;
            }

            function atualizarMetaDolarUI(valorAtual, variacao) {
                const elVar = document.getElementById('dolarSlideVariacao');
                if (elVar) {
                    if (variacao !== undefined && !isNaN(variacao)) {
                        elVar.textContent = `${variacao > 0 ? '+' : ''}${variacao.toFixed(2)}%`;
                        elVar.className = `dolar-variacao ${variacao >= 0 ? 'positiva' : 'negativa'}`;
                    } else {
                        elVar.textContent = '--';
                        elVar.className = 'dolar-variacao';
                    }
                }
                const elAtualizacao = document.getElementById('dolarSlideAtualizacao');
                if (elAtualizacao) {
                    const agora = new Date();
                    elAtualizacao.textContent = `Atualizado: ${agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
                }
            }

            function setTextoDolar(valor, syncBarra = false) {
                const el = document.getElementById('dolarSlideValor');
                if (!el) return;
                if (valor == null || isNaN(valor)) { el.textContent = '--'; return; }
                animateNumber(el, valor, 2400, (v) => `R$ ${v.toFixed(2).replace('.', ',')}`);
                if (syncBarra) atualizarBarraDolar(valor);
            }

            // ============================================================
            // ⭐ GRÁFICO DO DÓLAR — linha se desenha da esquerda pra direita
            //     (clip crescente no canvas, sincronizado com o número subindo)
            // ============================================================
            function renderizarGraficoDolar(dados, valorAtual, variacao) {
                const canvas = document.getElementById('chartDolarCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (chartDolar) { chartDolar.destroy(); chartDolar = null; }

                atualizarMetaDolarUI(valorAtual, variacao);

                const temDados = dados && Array.isArray(dados.labels) && Array.isArray(dados.valores) && dados.valores.length >= 2;
                const labelsFull = temDados ? dados.labels : ['--'];
                const valoresFull = temDados ? dados.valores : [valorAtual || 0];
                const valorFinal = (valorAtual != null && !isNaN(valorAtual)) ? valorAtual : (valoresFull[valoresFull.length - 1] || 0);

                // Dispara a animação do número subindo em paralelo
                setTextoDolar(valorFinal, true);

                const h = canvas.clientHeight || 280;
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, 'rgba(255,255,255,0.22)');
                grad.addColorStop(1, 'rgba(255,255,255,0.01)');

                const shouldAnimate = radarDolarAnimated && radarAnimation !== 'none';
                const drawDuration = 2400; // mesma duração do número subindo

                chartDolar = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labelsFull,
                        datasets: [{
                            label: 'USD/BRL',
                            data: valoresFull,
                            borderColor: '#ffffff',
                            backgroundColor: grad,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 2.2,
                            pointHoverRadius: 4,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: '#ffffff',
                            borderWidth: 3.5,
                            borderCapStyle: 'round',
                            borderJoinStyle: 'round'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        // Desligamos a animação padrão do Chart.js — quem manda é o plugin
                        animation: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: 'rgba(255,255,255,0.45)', maxTicksLimit: 8, maxRotation: 0 } },
                            y: { grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: 'rgba(255,255,255,0.45)', callback: function(value) { return 'R$ ' + Number(value).toFixed(2); } } }
                        }
                    },
                    plugins: [drawProgressPlugin]
                });

                // ⭐ Esconde tudo imediatamente (progress 0) e anima até 1 (tudo visível)
                chartDolar._drawProgress = 0;
                chartDolar.draw(); // aplica o clip de 0 = nada visível

                if (shouldAnimate) {
                    const start = performance.now();
                    function stepDraw(t) {
                        if (!chartDolar) return;
                        const p = Math.min(1, (t - start) / drawDuration);
                        // easeOutQuart: desenho rápido no início, desacelera no fim
                        const eased = 1 - Math.pow(1 - p, 3);
                        chartDolar._drawProgress = eased;
                        chartDolar.draw();
                        if (p < 1) requestAnimationFrame(stepDraw);
                    }
                    requestAnimationFrame(stepDraw);
                } else {
                    chartDolar._drawProgress = 1;
                    chartDolar.draw();
                }
            }

            async function carregarSlideDolar() {
                dolarSlideActive = true;
                const elValor = document.getElementById('dolarSlideValor');
                if (elValor) elValor.textContent = '--';
                const elAtualizacao = document.getElementById('dolarSlideAtualizacao');
                if (elAtualizacao) elAtualizacao.textContent = 'Carregando...';
                const dados = await obterDadosDolarCompletos();
                if (dados) {
                    dolarAtual = dados.cotacao;
                    dolarVariacao = dados.variacao;
                    atualizarBarraDolar(dados.cotacao);
                    renderizarGraficoDolar({ labels: dados.labels, valores: dados.valores }, dados.cotacao, dados.variacao);
                } else {
                    setTextoDolar(null);
                    atualizarMetaDolarUI(null, null);
                    const el = document.getElementById('dolarSlideAtualizacao');

                } else {
                    allSlides.push({ type: 'previsao_tempo', html: `<div class="weather-slide"><div class="weather-bg" style="background-image: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=1600&q=80'); background-color: #000;"></div><div class="weather-overlay"></div><div class="weather-content"><div class="temp-big">--°</div></div></div>`, customLabel: 'Clima / Previsão' });
                }

                    aniv.filter(a => a.diff > 0).forEach(a => allSlides.push({ type: 'aniversariante_futuro', html: buildBirthdayHeroSlide(a, true, a.diff), customLabel: 'Próximo – ' + a.nome }));

                }

                allSlides.push({ type: 'video', html: `<div style="width:100%;height:100%;background:transparent;"></div>`, customLabel: 'Centrobor Esportes' });
                allSlides.push({ type: 'canva', html: `<iframe src="https://www.canva.com/design/DAHRodHp2gU/uZVqsviM03HQiXeRmccLfQ/view?embed" style="width:100%; height:100%; border:none;" allow="fullscreen"></iframe>`, customLabel: 'RADAR CENTROBOR' });

                const infoCamp = processarCampanha();
