            // ----- Função para extrair cor média da imagem -----
            function extrairCorMediaImagem(url, callback) {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = function() {
                    try {
                        const canvas = document.createElement('canvas');
                        // Reduz tamanho para performance
                        const maxSize = 80;
                        let w = img.width, h = img.height;
                        if (w > maxSize || h > maxSize) {
                            const ratio = Math.min(maxSize / w, maxSize / h);
                            w = Math.floor(w * ratio);
                            h = Math.floor(h * ratio);
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const imageData = ctx.getImageData(0, 0, w, h);
                        const data = imageData.data;
                        let r = 0, g = 0, b = 0, count = 0;
                        // Amostra a cada 4 pixels para performance
                        for (let i = 0; i < data.length; i += 16) {
                            r += data[i];
                            g += data[i+1];
                            b += data[i+2];
                            count++;
                        }
                        if (count === 0) { callback(null); return; }
                        r = Math.round(r / count);
                        g = Math.round(g / count);
                        b = Math.round(b / count);
                        // Escurece bastante para garantir contraste com textos claros e fundo limpo
                        const escurecida = `rgb(${Math.round(r*0.28)}, ${Math.round(g*0.28)}, ${Math.round(b*0.28)})`;
                        callback(escurecida);
                    } catch (e) {
                        callback(null);
                    }
                };
                img.onerror = function() {
                    callback(null);
                };
                img.src = url;
            }

            // ----- Armazenar estilo original da bottombar e do animated-bg para restaurar -----
            let bottombarOriginalStyle = null;
            let animatedBgOriginalStyle = null;

            function aplicarCorFundoClima(cor) {
                const corFinal = cor || '#000000';

                // Slide atual
                const slideEl = document.querySelector('.slide.active[data-type="previsao_tempo"]');
                if (slideEl) {
                    slideEl.style.backgroundColor = corFinal;
                    const bgEl = slideEl.querySelector('.weather-bg');
                    if (bgEl) bgEl.style.backgroundColor = corFinal;
                    const weatherSlide = slideEl.querySelector('.weather-slide');
                    if (weatherSlide) weatherSlide.style.backgroundColor = corFinal;
                }

                // Bottombar
                const bb = document.getElementById('bottombar');
                if (bb) {
                    if (!bottombarOriginalStyle) {
                        bottombarOriginalStyle = {
                            background: bb.style.background,
                            backdropFilter: bb.style.backdropFilter,
                            borderTopColor: bb.style.borderTopColor
                        };
                    }
                    bb.style.background = corFinal;
                    bb.style.backdropFilter = 'none';
                    bb.style.borderTopColor = 'rgba(255,255,255,0.1)';
                }

                // Animated-bg (fundo da página inteira) — este era o que faltava
                const animBg = document.querySelector('.animated-bg');
                if (animBg) {
                    if (!animatedBgOriginalStyle) {
                        animatedBgOriginalStyle = {
                            background: animBg.style.background,
                            backgroundImage: animBg.style.backgroundImage,
                            animation: animBg.style.animation,
                            filter: animBg.style.filter
                        };
                    }
                    animBg.style.background = corFinal;
                    animBg.style.backgroundImage = 'none';
                    animBg.style.animation = 'none';
                    animBg.style.filter = 'none';
                }
            }

            function restaurarFundoOriginal() {
                // Restaura bottombar
                if (bottombarOriginalStyle) {
                    const bb = document.getElementById('bottombar');
                    if (bb) {
                        bb.style.background = bottombarOriginalStyle.background || '';
                        bb.style.backdropFilter = bottombarOriginalStyle.backdropFilter || '';
                        bb.style.borderTopColor = bottombarOriginalStyle.borderTopColor || '';
                    }
                    bottombarOriginalStyle = null;
                }

                // Restaura animated-bg
                if (animatedBgOriginalStyle) {
                    const animBg = document.querySelector('.animated-bg');
                    if (animBg) {
                        animBg.style.background = animatedBgOriginalStyle.background || '';
                        animBg.style.backgroundImage = animatedBgOriginalStyle.backgroundImage || '';
                        animBg.style.animation = animatedBgOriginalStyle.animation || '';
                        animBg.style.filter = animatedBgOriginalStyle.filter || '';
                    }
                    animatedBgOriginalStyle = null;
                }

                // Limpa estilos inline do slide de clima
                document.querySelectorAll('.slide[data-type="previsao_tempo"]').forEach(el => {
                    el.style.backgroundColor = '';
                    const bg = el.querySelector('.weather-bg');
                    if (bg) bg.style.backgroundColor = '';
                    const ws = el.querySelector('.weather-slide');
                    if (ws) ws.style.backgroundColor = '';
                });
            }

            function construirSlides() {
                allSlides = [];
                allSlides.push({ type: 'relogio', html: `<div class="relogio-slide"><div class="relogio-content"><div class="hora-grande" id="slide-hora">00:00</div><div class="data-grande" id="slide-data">Carregando...</div><div class="clima-grande"><i class="fas fa-sun" id="slide-clima-icon"></i> <span id="slide-temp">--°C</span></div></div></div>` });
                allSlides.push({ type: 'logo', html: `<div class="logo-slide"><img src="https://www.centrobor.com.br/wp-content/uploads/2026/01/centrobor-logo-branca-scaled.webp" alt="Centrobor"></div>` });
                
                if (currentWeatherData) {
                    const ws = buildWeatherSlide(currentWeatherData);
                    if (ws) allSlides.push({ type: 'previsao_tempo', html: ws, customLabel: 'Clima / Previsão' });
                } else {
                    allSlides.push({ type: 'previsao_tempo', html: `<div class="weather-slide"><div class="weather-bg" style="background-image: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=1600&q=80'); background-color: #000;"></div><div class="weather-overlay"></div><div class="weather-content"><div class="temp-big">--°</div></div></div>`, customLabel: 'Clima / Previsão' });
                }

                allSlides.push({
                    type: 'noticias_rss',
                    html: buildNoticiasRssSlide(),
                    customLabel: 'Notícias (G1 + TecMundo)'
                });

                allSlides.push({
                    type: 'dolar',
                    html: buildDolarSlide(),
                    customLabel: 'Dólar (Economia)'
                });

                const aniv = obterAniversariantesDaSemana();
                if (aniv.length) {
                    aniv.filter(a => a.diff < 0).forEach(a => allSlides.push({ type: 'aniversariante_individual', html: buildBirthdayHeroSlide(a, false, a.diff), customLabel: 'Aniversário – ' + a.nome }));
                    aniv.filter(a => a.diff > 0).forEach(a => allSlides.push({ type: 'aniversariante_futuro', html: buildBirthdayHeroSlide(a, true, a.diff), customLabel: 'Próximo – ' + a.nome }));
                    aniv.filter(a => a.diff === 0).forEach(a => allSlides.push({ type: 'aniversariante_dia', html: buildBirthdayHeroSlide(a, false, 0), customLabel: 'Hoje – ' + a.nome }));
                    allSlides.push({ type: 'aniversariantes_semana', html: buildBirthdayWeekSlide(aniv), customLabel: 'Aniversariantes da Semana' });
                }
                allSlides.push({ type: 'video', html: `<iframe id="live-youtube-iframe" src="https://www.youtube.com/embed/${currentVideoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${currentVideoId}&cc_load_policy=1&hl=pt&playsinline=1" style="width:100%;height:100%;border:none;"></iframe>` });
                allSlides.push({ type: 'canva', html: `<iframe src="https://www.canva.com/design/DAHRodHp2gU/uZVqsviM03HQiXeRmccLfQ/view?embed" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`, customLabel: 'RADAR CENTROBOR' });

                const infoCamp = processarCampanha();
                if (infoCamp) {
                    const htmlCamp = buildCampanhaSlide(infoCamp);
                    if (htmlCamp) {
                        allSlides.push({
                            type: 'campanha_reta_final',
                            html: htmlCamp,
                            customLabel: 'Campanha Comercial – ' + infoCamp.nome,
                            campanhaInfo: infoCamp
                        });
                    }
                }

                allSlides.forEach(s => { if (slideVisibility[s.type] === undefined) slideVisibility[s.type] = true; });
                salvarVisibilidade();
            }

            function rebuildSlides() {
                visibleSlides = allSlides.filter(s => slideVisibility[s.type] !== false);
                if (!visibleSlides.length) visibleSlides = allSlides;
                const zone = document.getElementById('slides-zone');
                zone.querySelectorAll('.slide').forEach(el => el.remove());
                visibleSlides.forEach((s, i) => {
                    const div = document.createElement('div');
                    div.className = `slide ${i === 0 ? 'active' : ''}`;
                    div.dataset.index = i;
                    div.dataset.type = s.type;
                    div.innerHTML = s.html;
                    zone.appendChild(div);
                });
                document.getElementById('indicators').innerHTML = visibleSlides.map((_, i) =>
                    `<div class="dot-indicator${i === 0 ? ' active' : ''}" data-index="${i}"></div>`).join('');
                document.querySelectorAll('.dot-indicator').forEach(d => d.addEventListener('click', function() {
                    irParaSlide(parseInt(this.dataset.index));
                    resetarTimer();
                }));
                if (currentSlideIndex >= visibleSlides.length) currentSlideIndex = 0;
                irParaSlide(currentSlideIndex);
                resetarTimer();
            }

            function irParaSlide(idx) {
                const slidesEl = document.querySelectorAll('.slide');
                if (!slidesEl.length) return;
                idx = Math.min(Math.max(0, idx), slidesEl.length - 1);
                slidesEl.forEach(s => { s.classList.remove('active'); s.className = 'slide'; });
                document.querySelectorAll('.dot-indicator').forEach(d => d.classList.remove('active'));
                const slideEl = slidesEl[idx];
                slideEl.classList.add('slide-transition-' + transicoes[Math.floor(Math.random() * transicoes.length)], 'active');
                document.querySelector(`.dot-indicator[data-index="${idx}"]`)?.classList.add('active');
                currentSlideIndex = idx;
                const s = visibleSlides[idx];
                const body = document.body;
                const bottombar = document.getElementById('bottombar');
                const watermark = document.getElementById('watermark');

                const isFullscreen = s && (s.type === 'canva' || s.type === 'campanha_reta_final');
                if (isFullscreen) {
                    body.classList.add('canva-fullscreen');
                    bottombar.classList.add('canva-active');
                    watermark.classList.add('active');
                } else {
                    body.classList.remove('canva-fullscreen');
                    bottombar.classList.remove('canva-active');
                    watermark.classList.remove('active');
                }

                if (s && s.type === 'relogio') bottombar.classList.add('relogio-active');
                else bottombar.classList.remove('relogio-active');

                if (s?.type === 'aniversariante_dia') dispararConfetes();
                if (s?.type === 'relogio') atualizarTodosRelogios();

                // NOTÍCIAS RSS
                if (s?.type === 'noticias_rss') {
                    const staleMs = 4 * 60 * 1000;
                    const precisaAtualizar = !noticiasRss.length || (Date.now() - lastNewsFetch > staleMs);

                    if (precisaAtualizar) {
                        buscarNoticiasRss().then(() => {
                            setTimeout(() => {
                                if (noticiasRss.length) {
                                    const start = Math.floor(Math.random() * noticiasRss.length);
                                    atualizarNoticiaCarrossel(start);
                                }
                                iniciarCarrosselNoticias();
                            }, 300);
                        });
                    } else {
                        if (noticiasRss.length > 4) {
                            const corte = Math.max(4, Math.ceil(noticiasRss.length * 0.6));
                            const topo = shuffleArray(noticiasRss.slice(0, corte));
                            noticiasRss = topo.concat(noticiasRss.slice(corte));
                        }
                        setTimeout(() => {
                            if (noticiasRss.length) {
                                const start = Math.floor(Math.random() * Math.min(4, noticiasRss.length));
                                atualizarNoticiaCarrossel(start);
                            }
                            iniciarCarrosselNoticias();
                        }, 300);
                    }
                    noticiasSlideAtivo = true;
                } else {
                    pararCarrosselNoticias();
                    noticiasSlideAtivo = false;
                }

                // DÓLAR
                if (s?.type === 'dolar') {
                    dolarSlideActive = true;
                    const wrapper = slideEl.querySelector('.dolar-grafico-wrapper');
                    if (wrapper) {
                        const oldCanvas = wrapper.querySelector('canvas');
                        if (oldCanvas) oldCanvas.remove();
                        const newCanvas = document.createElement('canvas');
                        newCanvas.id = 'chartDolarCanvas';
                        wrapper.appendChild(newCanvas);
                    }
                    setTimeout(() => carregarSlideDolar(), 80);
                } else {
                    if (dolarAtualizacaoTimer) {
                        clearInterval(dolarAtualizacaoTimer);
                        dolarAtualizacaoTimer = null;
                    }
                    dolarSlideActive = false;
                    pararAnimacaoDolar();
                    if (chartDolar) {
                        chartDolar.destroy();
                        chartDolar = null;
                    }
                }

                if (s?.type === 'noticias_rss' || s?.type === 'dolar') {
                    document.body.classList.add('news-dark');
                } else {
                    document.body.classList.remove('news-dark');
                }

                if (s?.type === 'dolar') {
                    document.body.classList.add('dolar-slide-active');
                } else {
                    document.body.classList.remove('dolar-slide-active');
                }

                if (s?.type === 'campanha_reta_final' && s.campanhaInfo) {
                    setTimeout(() => iniciarSequenciaCampanha(s.campanhaInfo), 350);
                } else {
                    if (campanhaCountdownInterval) { clearInterval(campanhaCountdownInterval); campanhaCountdownInterval = null; }
                    if (campanhaAnimTimeout) { clearTimeout(campanhaAnimTimeout); campanhaAnimTimeout = null; }
                    ringAnimRunning = false;
                }

                // ===== CLIMA: aplicar cor na bottombar + no fundo da página + no slide =====
                document.querySelectorAll('.slide.weather-active').forEach(el => el.classList.remove('weather-active'));

                if (s?.type === 'previsao_tempo') {
                    // Adiciona a classe para remover o pseudo-elemento (::before)
                    slideEl.classList.add('weather-active');

                    // Já aplica preto imediatamente para evitar o azul enquanto carrega a cor
                    aplicarCorFundoClima('#000000');

                    const bgEl = slideEl.querySelector('.weather-bg');
                    if (bgEl) {
                        const style = window.getComputedStyle(bgEl);
                        const bgImage = style.backgroundImage;
                        const urlMatch = bgImage.match(/url\(["']?(.*?)["']?\)/);
                        if (urlMatch && urlMatch[1]) {
                            const imageUrl = urlMatch[1];
                            extrairCorMediaImagem(imageUrl, function(cor) {
                                // Só aplica se ainda estivermos no slide de clima
                                if (document.querySelector('.slide.active[data-type="previsao_tempo"]')) {
                                    aplicarCorFundoClima(cor || '#000000');
                                }
                            });
                        }
                    }
                } else {
                    // Saiu do clima → restaura tudo
                    restaurarFundoOriginal();
                }
            }

            function proximoSlide() { if (visibleSlides.length) irParaSlide((currentSlideIndex + 1) % visibleSlides.length); }
            function slideAnterior() { if (visibleSlides.length) irParaSlide((currentSlideIndex - 1 + visibleSlides.length) % visibleSlides.length); }
            function iniciarTimer() {
                if (slideTimer) clearTimeout(slideTimer);
                if (!visibleSlides.length) return;
                const s = visibleSlides[currentSlideIndex];
                let dur = CONFIG.slideInterval;
                if (s?.type === 'video') dur = CONFIG.videoSlideDuration;
                if (s?.type === 'campanha_reta_final') dur = CONFIG.campanhaSlideDuration;
                if (s?.type === 'noticias_rss') dur = CONFIG.noticiasRssSlideDuration;
                if (s?.type === 'dolar') dur = CONFIG.slideInterval;
                slideTimer = setTimeout(() => { if (!paused) { proximoSlide(); iniciarTimer(); } else iniciarTimer(); }, dur);
            }
            function resetarTimer() { if (slideTimer) clearTimeout(slideTimer); iniciarTimer(); }
            function dispararConfetes() {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 120, spread: 65, origin: { y: 0.6 } });
                    setTimeout(() => confetti({ particleCount: 80, angle: 60, spread: 50, origin: { x: 0 } }), 180);
                }
            }

            // ===== RÁDIO =====
            function carregarRadio(index) {
                const radio = RADIOS[index];
                if (!radio) return;
                document.getElementById('radio-box').innerHTML = radio.iframe;
                currentRadioIndex = index;
                localStorage.setItem('radioIndex', index);
                document.querySelectorAll('#radioSelector button').forEach(b => b.classList.toggle('active-radio', parseInt(b.dataset.radio) === index));
            }
            function proximaRadio() { carregarRadio((currentRadioIndex + 1) % RADIOS.length); }
            function iniciarRadioRotacao() {
                const saved = localStorage.getItem('radioIndex');
                carregarRadio(saved ? parseInt(saved) : 0);
                radioTimer = setInterval(proximaRadio, CONFIG.radioInterval);
                document.querySelectorAll('#radioSelector button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        carregarRadio(parseInt(this.dataset.radio));
                        clearInterval(radioTimer);
                        radioTimer = setInterval(proximaRadio, CONFIG.radioInterval);
                        document.getElementById('radioSelector').classList.remove('active');
                    });
                });
            }

            // ===== SIDEBAR =====
            function toggleSidebar() {
                sidebarHidden = !sidebarHidden;
                document.getElementById('mainGrid').classList.toggle('sidebar-hidden', sidebarHidden);
                document.getElementById('topToggleIcon').className = sidebarHidden ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
                document.getElementById('sidebarTopToggle').classList.toggle('hidden-sidebar', sidebarHidden);
                localStorage.setItem('sidebarHidden', sidebarHidden);
            }
            function carregarSidebarState() {
                const saved = localStorage.getItem('sidebarHidden');
                if (saved !== null) {
                    sidebarHidden = JSON.parse(saved);
                    document.getElementById('mainGrid').classList.toggle('sidebar-hidden', sidebarHidden);
                    document.getElementById('topToggleIcon').className = sidebarHidden ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
                    document.getElementById('sidebarTopToggle').classList.toggle('hidden-sidebar', sidebarHidden);
                }
            }

            // ===== PONTO =====
            let pontoAtivo = false, pontoFechamentoTimer = null;

            function verificarLembretePonto() {
                const agora = getHoraSincronizada();
                const totalMin = agora.getHours() * 60 + agora.getMinutes();
                const horarios = [
                    { label: 'Iniciar', h: 8, m: 0 },
                    { label: 'Encerrar', h: 17, m: 45 }
                ];
                let alvo = null;
                for (let h of horarios) {
                    const alvoMin = h.h * 60 + h.m;
                    if (alvoMin - totalMin >= -1 && alvoMin - totalMin <= 3) { alvo = h; break; }
                }
                if (alvo && !pontoAtivo) {
                    const hoje = agora.toDateString();
                    const chave = `ponto_${alvo.h}_${alvo.m}_${hoje}`;
                    if (localStorage.getItem(chave) === 'exibido') return;
                    pontoAtivo = true;

                    document.getElementById('pontoTitulo').textContent = 'Não Esqueça de Bater o Ponto';
                    document.getElementById('pontoOverlay').classList.add('active');

                    let seg = 120;
                    atualizarTempoRestante(seg);

                    if (pontoFechamentoTimer) clearInterval(pontoFechamentoTimer);
                    pontoFechamentoTimer = setInterval(() => {
                        seg--;
                        atualizarTempoRestante(seg);
                        if (seg <= 0) {
                            clearInterval(pontoFechamentoTimer);
                            desativarPonto();
                        }
                    }, 1000);

                    localStorage.setItem(chave, 'exibido');
                }
            }

            function atualizarTempoRestante(s) {
                const el = document.getElementById('pontoTempoRestante');
                if (s > 0) {
                    const m = Math.floor(s / 60), sec = s % 60;
                    el.textContent = `${m}:${String(sec).padStart(2,'0')} min`;
                    el.style.display = 'block';
                } else {
                    el.textContent = 'Fechando...';
                }
            }

            function desativarPonto() {
                pontoAtivo = false;
                document.getElementById('pontoOverlay').classList.remove('active');
                if (pontoFechamentoTimer) {
                    clearInterval(pontoFechamentoTimer);
                    pontoFechamentoTimer = null;
                }
            }

            setInterval(verificarLembretePonto, 10000);
            setTimeout(verificarLembretePonto, 1000);

            function limparRegistrosPontoAntigos() {
                const hoje = new Date().toDateString();
                Object.keys(localStorage).filter(k => k.startsWith('ponto_') && !k.includes(hoje)).forEach(k => localStorage.removeItem(k));
            }
            limparRegistrosPontoAntigos();

            // ===== MENU DE PERSONALIZAÇÃO =====
            function initSlideManager() {
                const panel = document.getElementById('slideManagerPanel');
                const overlay = document.getElementById('slideManagerOverlay');
                function openPanel() { panel.classList.add('active'); overlay.classList.add('active'); }
                function closePanel() { panel.classList.remove('active'); overlay.classList.remove('active'); }
                document.getElementById('menuToggle').addEventListener('click', openPanel);
                document.getElementById('canvaMenuBtn').addEventListener('click', openPanel);
                document.getElementById('closeSlideManager').addEventListener('click', closePanel);
                overlay.addEventListener('click', closePanel);
                document.querySelectorAll('.filter-buttons button[data-filter]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.filter-buttons button[data-filter]').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        const cat = this.dataset.filter;
                        document.querySelectorAll('#slideListContainer .slide-item').forEach(i => {
                            i.style.display = (cat === 'all' || i.dataset.cat === cat) ? 'flex' : 'none';
                        });
                    });
                });
                document.getElementById('selectAllSlides').addEventListener('click', () => {
                    document.querySelectorAll('#slideListContainer input[type="checkbox"]').forEach(cb => {
                        cb.checked = true; slideVisibility[cb.dataset.type] = true;
                    });
                    salvarVisibilidade(); rebuildSlides();
                });
                document.getElementById('deselectAllSlides').addEventListener('click', () => {
                    document.querySelectorAll('#slideListContainer input[type="checkbox"]').forEach(cb => {
                        cb.checked = false; slideVisibility[cb.dataset.type] = false;
                    });
                    salvarVisibilidade(); rebuildSlides();
                });
                document.getElementById('saveDurationBtn').addEventListener('click', () => {
                    let v = parseInt(document.getElementById('durationInput').value);
                    if (isNaN(v) || v < 5) v = 15;
                    CONFIG.slideInterval = v * 1000;
                    localStorage.setItem('slideDurationSeconds', v);
                    resetarTimer();
                });
                document.getElementById('saveOffsetBtn').addEventListener('click', () => {
                    let v = parseFloat(document.getElementById('manualOffset').value);
                    if (isNaN(v)) v = 0;
                    manualOffsetHours = v;
                    localStorage.setItem('manualOffsetHours', v);
                    document.getElementById('offsetStatus').textContent = `(${v}h = ${v >= 0 ? '+' : ''}${v}h local)`;
                    if (v !== 0) {
                        horaExataDefinida = null;
                        localStorage.removeItem('exactTimeISO');
                        localStorage.removeItem('exactTimeFixadoEm');
                        document.getElementById('exactDateTimeStatus').textContent = '';
                    }
                    atualizarTodosRelogios();
                });
                document.getElementById('saveExactDateTimeBtn').addEventListener('click', () => {
                    const val = document.getElementById('manualExactDateTime').value;
                    if (!val) {
                        horaExataDefinida = null;
                        localStorage.removeItem('exactTimeISO');
                        localStorage.removeItem('exactTimeFixadoEm');
                        document.getElementById('exactDateTimeStatus').textContent = 'Removido.';
                        return;
                    }
                    const d = new Date(val);
                    horaExataDefinida = d;
                    localStorage.setItem('exactTimeISO', d.toISOString());
                    localStorage.setItem('exactTimeFixadoEm', Date.now());
                    document.getElementById('exactDateTimeStatus').textContent = `Fixado: ${d.toLocaleString('pt-BR')}`;
                    manualOffsetHours = 0;
                    document.getElementById('manualOffset').value = 0;
                    document.getElementById('offsetStatus').textContent = '(0h = local)';
                    atualizarTodosRelogios();
                });

                const darkToggle = document.getElementById('darkModeToggle');
                const darkStatus = document.getElementById('darkModeStatus');
                const savedDark = localStorage.getItem('darkModeGlobal');
                if (savedDark !== null) {
                    darkModeEnabled = savedDark === 'true';
                }
                darkToggle.checked = darkModeEnabled;
                darkStatus.textContent = darkModeEnabled ? 'Ativado' : 'Desativado';
                if (darkModeEnabled) document.body.classList.add('dark-mode');
                else document.body.classList.remove('dark-mode');
                darkToggle.addEventListener('change', function() {
                    darkModeEnabled = this.checked;
                    localStorage.setItem('darkModeGlobal', darkModeEnabled);
                    darkStatus.textContent = darkModeEnabled ? 'Ativado' : 'Desativado';
                    if (darkModeEnabled) document.body.classList.add('dark-mode');
                    else document.body.classList.remove('dark-mode');
                });

                function popularListaSlides() {
                    const container = document.getElementById('slideListContainer');
                    container.innerHTML = allSlides.map(s => {
                        const cat = (s.type === 'relogio' || s.type === 'logo' || s.type === 'noticias_rss' || s.type === 'dolar') ? 'geral' : 'novidades';
                        const label = s.customLabel || (s.type === 'relogio' ? 'Relógio' : s.type === 'logo' ? 'Logo' : s.type === 'video' ? 'Vídeo' : s.type);
                        const checked = slideVisibility[s.type] !== false;
                        return `<div class="slide-item" data-type="${s.type}" data-cat="${cat}">
                            <input type="checkbox" ${checked ? 'checked' : ''} data-type="${s.type}">
                            <span class="slide-label">${label}</span>
                            <span class="slide-category ${cat}">${cat}</span>
                        </div>`;
                    }).join('');
                    container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                        cb.addEventListener('change', function() {
                            slideVisibility[this.dataset.type] = this.checked;
                            salvarVisibilidade();
                            rebuildSlides();
                        });
                    });
                }
                popularListaSlides();
            }

            // ===== INICIALIZAÇÃO =====
            async function carregarDadosPlanilha() {
                try {
                    const [cadastro, video, campanhas] = await Promise.all([
                        fetch(BASES.cadastro).then(r => r.json()).catch(() => []),
                        fetch(BASES.video).then(r => r.json()).catch(() => []),
                        fetch(BASES.campanhas).then(r => r.json()).catch(() => [])
                    ]);
                    cadastros = cadastro;
                    videoData = video;
                    campanhasData = campanhas || [];
                    if (video.length) {
                        const id = video[0]['id_link'] || video[0]['id'] || video[0]['ID'];
                        if (id) currentVideoId = id;
                    }
                } catch (e) {}
            }

            async function init() {
                carregarSidebarState();
                document.getElementById('sidebarTopToggle').addEventListener('click', toggleSidebar);
                const savedDarkInit = localStorage.getItem('darkModeGlobal');
                if (savedDarkInit !== null) darkModeEnabled = savedDarkInit === 'true';
                if (darkModeEnabled) document.body.classList.add('dark-mode');
                else document.body.classList.remove('dark-mode');
                const savedOffset = localStorage.getItem('manualOffsetHours');
                if (savedOffset) manualOffsetHours = parseFloat(savedOffset);
                const savedExactISO = localStorage.getItem('exactTimeISO');
                const savedFixadoEm = localStorage.getItem('exactTimeFixadoEm');
                if (savedExactISO && savedFixadoEm) {
                    horaExataDefinida = new Date(savedExactISO);
                    document.getElementById('manualExactDateTime').value = horaExataDefinida.toISOString().slice(0, 16);
                    document.getElementById('exactDateTimeStatus').textContent = `Fixado: ${horaExataDefinida.toLocaleString('pt-BR')}`;
                }
                document.getElementById('manualOffset').value = manualOffsetHours;
                document.getElementById('offsetStatus').textContent = `(${manualOffsetHours}h = ${manualOffsetHours >= 0 ? '+' : ''}${manualOffsetHours}h local)`;
                const savedDur = localStorage.getItem('slideDurationSeconds');
                if (savedDur) {
                    CONFIG.slideInterval = parseInt(savedDur) * 1000;
                    document.getElementById('durationInput').value = parseInt(savedDur);
                }
                await carregarDadosPlanilha();
                construirSlides();
                rebuildSlides();
                iniciarRadioRotacao();
                initSlideManager();
                document.getElementById('loading-overlay').classList.add('hidden');
                document.getElementById('prev-slide-btn').addEventListener('click', () => { slideAnterior(); resetarTimer(); });
                document.getElementById('next-slide-btn').addEventListener('click', () => { proximoSlide(); resetarTimer(); });
                const pauseBtn = document.getElementById('pause-slide-btn');
                pauseBtn.addEventListener('click', () => {
                    paused = !paused;
                    pauseBtn.innerHTML = paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
                });
                const radioBtn = document.getElementById('radioFloatingBtn');
                const radioSelector = document.getElementById('radioSelector');
                radioBtn.addEventListener('click', (e) => { e.stopPropagation(); radioSelector.classList.toggle('active'); });
                document.addEventListener('click', (e) => {
                    if (!radioSelector.contains(e.target) && e.target !== radioBtn) radioSelector.classList.remove('active');
                });
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'r') {
                        e.preventDefault();
                        radioBtn.click();
                    }
                });
                setInterval(() => window.location.reload(), CONFIG.reloadInterval);

                await buscarNoticiasRss();
                const slideAtivo = document.querySelector('.slide.active[data-type="noticias_rss"]');
                if (slideAtivo && noticiasRss.length) {
                    const start = Math.floor(Math.random() * Math.min(4, noticiasRss.length));
                    atualizarNoticiaCarrossel(start);
                    iniciarCarrosselNoticias();
                }
            }
            init();
        })();
    </script>
</body>
</html>
