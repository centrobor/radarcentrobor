<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Radar Centrobor – Gestão à Vista</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-deep: #0b1a2e;
            --primary: #1e5a7a;
            --green: #2e7d32;
            --accent: #38bdf8;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 16px;
            --bottombar-height: 100px;
            --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0b1a2e;
            color: var(--text-light);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        .animated-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0a3d2e, #0b2d4a, #0a4a3a, #0b3b5a, #0a5c3a);
            background-size: 400% 400%;
            animation: gradienteAnimado 18s ease-in-out infinite alternate;
        }
        @keyframes gradienteAnimado {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 30%; }
            50% { background-position: 100% 70%; }
            75% { background-position: 0% 70%; }
            100% { background-position: 0% 50%; }
        }
        .app-layer { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
        .sidebar-top-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 60;
            background: rgba(11,26,46,0.5); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 50%;
            width: 44px; height: 44px; color: #fff; font-size: 1.2rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .sidebar-top-toggle:hover { background: rgba(56,189,248,0.25); border-color: var(--accent); transform: scale(1.05); }
        .sidebar-top-toggle i { transition: transform 0.3s ease; }
        .sidebar-top-toggle.hidden-sidebar i { transform: rotate(180deg); }

        .bottombar {
            height: var(--bottombar-height);
            background: rgba(11,26,46,0.55); backdrop-filter: blur(18px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; z-index: 10; order: 2; padding: 0 20px; position: relative;
            transition: all 0.3s ease;
        }
        .clock-center {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            transition: opacity 0.3s ease;
        }
        .clock-center .hora-grande {
            font-size: 4rem; font-weight: 700; color: #fff; letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(0,0,0,0.4), 0 0 80px rgba(56,189,248,0.15); line-height: 1;
        }
        .clock-center .data-grande {
            font-size: 1.3rem; color: rgba(255,255,255,0.65); font-weight: 300; letter-spacing: 1px;
        }
        .logo-img {
            height: 38px; width: auto; object-fit: contain; position: absolute; left: 24px;
            opacity: 0.4; filter: brightness(1.2);
        }
        .dolar-cotacao {
            position: absolute; right: 80px; display: flex; align-items: center; gap: 8px;
            background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 30px;
            backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
            font-size: 1.2rem; font-weight: 600; color: #4caf50; letter-spacing: 0.5px;
        }
        .dolar-cotacao i { color: #facc15; font-size: 1rem; }
        .menu-toggle {
            background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer;
            padding: 8px 10px; border-radius: 10px; transition: 0.2s; position: absolute; right: 20px;
        }
        .menu-toggle:hover { background: rgba(255,255,255,0.08); }

        .bottombar.relogio-active .clock-center { opacity: 0; pointer-events: none; }
        .bottombar.relogio-active .dolar-cotacao {
            right: 50%; transform: translateX(50%); background: rgba(76,175,80,0.15);
            font-size: 1.6rem; padding: 10px 24px; border-color: #4caf50; transition: all 0.4s ease;
        }

        /* Slide Manager */
        .slide-manager-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index:100; opacity:0; pointer-events:none; transition:0.3s; }
        .slide-manager-overlay.active { opacity:1; pointer-events:all; }
        .slide-manager-panel {
            position: fixed; top:0; right:-420px; width:380px; max-width:90vw; height:100%;
            background: rgba(15,31,46,0.95); backdrop-filter:blur(24px); z-index:110;
            transition: right 0.35s; display:flex; flex-direction:column;
            box-shadow:-4px 0 30px rgba(0,0,0,0.5); border-left:1px solid rgba(255,255,255,0.08);
            padding:24px 20px 30px; overflow-y:auto;
        }
        .slide-manager-panel.active { right:0; }
        .panel-header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:16px; margin-bottom:20px; }
        .panel-header h3 { color:#fff; font-weight:700; font-size:1.2rem; }
        .close-btn { background:none; border:none; color:#94a3b8; font-size:1.5rem; cursor:pointer; padding:4px 8px; border-radius:8px; }
        .close-btn:hover { background:rgba(255,255,255,0.08); color:#fff; }
        .filter-buttons { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
        .filter-buttons button {
            background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:var(--text-muted);
            padding:6px 14px; border-radius:30px; font-size:0.7rem; font-weight:600; cursor:pointer;
            transition:0.2s; text-transform:uppercase; letter-spacing:0.5px; display:flex; align-items:center; gap:5px;
        }
        .filter-buttons button:hover { background:rgba(255,255,255,0.1); color:#fff; }
        .filter-buttons button.active { background:var(--accent); color:#0b1a2e; border-color:var(--accent); }
        .select-all-btn { background:rgba(46,125,50,0.15)!important; border-color:#4caf50!important; color:#4caf50!important; }
        .deselect-all-btn { background:rgba(211,47,47,0.15)!important; border-color:#d32f2f!important; color:#d32f2f!important; }
        .time-offset-config, .slide-duration-config {
            display:flex; align-items:center; gap:12px; margin:12px 0 16px;
            padding:12px 16px; background:rgba(255,255,255,0.04); border-radius:var(--radius-md);
            border:1px solid rgba(255,255,255,0.06); flex-wrap:wrap;
        }
        .time-offset-config label, .slide-duration-config label { font-size:0.8rem; font-weight:600; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
        .time-offset-config input, .slide-duration-config input {
            width:80px; padding:4px 8px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
            background:rgba(0,0,0,0.3); color:#fff; font-weight:600; font-size:0.9rem; text-align:center;
        }
        .time-offset-config button, .slide-duration-config button {
            background:var(--accent); border:none; color:#0b1a2e; font-weight:700; padding:4px 14px;
            border-radius:20px; font-size:0.75rem; cursor:pointer; transition:0.2s;
        }
        .offset-status { font-size:0.7rem; color:var(--text-muted); margin-left:4px; }

        .slide-list { flex:1; overflow-y:auto; padding-right:4px; }
        .slide-item {
            display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px;
            margin-bottom:4px; transition:0.15s; border-bottom:1px solid rgba(255,255,255,0.03);
        }
        .slide-item:hover { background:rgba(255,255,255,0.04); }
        .slide-item input[type="checkbox"] { width:18px; height:18px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
        .slide-label { flex:1; color:var(--text-light); font-size:0.85rem; font-weight:500; }
        .slide-category { font-size:0.6rem; background:rgba(255,255,255,0.06); padding:2px 10px; border-radius:30px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px; }
        .slide-category.geral { color:#38bdf8; border:1px solid rgba(56,189,248,0.15); }
        .slide-category.novidades { color:#f59e0b; border:1px solid rgba(245,158,11,0.15); }

        .main-grid {
            flex:1; display:flex; gap:16px; padding:16px; min-height:0; z-index:1;
            order:1; position:relative; overflow:hidden; transition: gap 0.4s;
        }
        .slides-zone {
            flex:1; min-width:0; position:relative; border-radius:var(--radius-xl);
            overflow:hidden; background:transparent; border:1px solid rgba(255,255,255,0.06);
            aspect-ratio:16/9; max-height:100%; min-height:300px; width:100%;
            box-shadow:var(--shadow-card); transition: flex 0.4s;
        }
        .sidebar-right {
            flex:0 0 370px; display:flex; flex-direction:column; gap:16px; min-height:0;
            transition: flex 0.4s, opacity 0.4s, transform 0.4s; overflow:hidden;
            transform:scaleX(1); transform-origin:right center; opacity:1;
        }
        .main-grid.sidebar-hidden .sidebar-right { flex:0 0 0; opacity:0; transform:scaleX(0); margin:0; padding:0; gap:0; overflow:hidden; }
        .video-box { flex:1; border-radius:var(--radius-lg); overflow:hidden; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); min-height:200px; box-shadow:var(--shadow-card); border:1px solid rgba(255,255,255,0.06); }
        .video-box iframe { width:100%; height:100%; border:none; }
        .radio-embed { background:rgba(0,0,0,0.4); backdrop-filter:blur(4px); border-radius:var(--radius-md); overflow:hidden; flex-shrink:0; height:75px; border:1px solid rgba(255,255,255,0.06); }
        .radio-embed iframe { width:100%; height:100%; border:none; }

        /* Slides */
        .slide {
            position:absolute; top:0; left:0; width:100%; height:100%;
            opacity:0; transition: opacity 0.8s, transform 0.8s; transform:scale(0.98);
            display:flex; align-items:center; justify-content:center; text-align:center;
            will-change: transform, opacity; pointer-events:none; border-radius:var(--radius-xl);
            overflow:hidden;
        }
        .slide::before {
            content:''; position:absolute; inset:0; z-index:0;
            background: linear-gradient(135deg, rgba(10,60,40,0.35) 0%, rgba(11,45,70,0.35) 50%, rgba(10,70,50,0.35) 100%);
            background-size: 300% 300%;
            animation: slideGradientShift 12s ease-in-out infinite alternate;
            pointer-events:none; border-radius:var(--radius-xl);
        }
        @keyframes slideGradientShift { 0%{background-position:0% 50%;} 100%{background-position:100% 50%;} }
        .slide>* { position:relative; z-index:1; }
        .slide.active { opacity:1; transform:scale(1); z-index:2; pointer-events:auto; }
        .slide-transition-fade.active { animation: slideFadeIn 0.9s ease forwards; }
        .slide-transition-zoom.active { animation: slideZoomIn 0.9s ease forwards; }
        .slide-transition-flip.active { animation: slideFlipIn 0.9s ease forwards; }
        .slide-transition-cube.active { animation: slideCubeIn 0.9s ease forwards; }
        .slide-transition-coverflow.active { animation: slideCoverflowIn 0.9s ease forwards; }
        .slide-transition-slide.active { animation: slideSlideIn 0.9s ease forwards; }
        .slide-transition-parallax.active { animation: slideParallaxIn 0.9s ease forwards; }
        @keyframes slideFadeIn { 0%{opacity:0;}100%{opacity:1;} }
        @keyframes slideZoomIn { 0%{opacity:0;transform:scale(0.8);}100%{opacity:1;transform:scale(1);} }
        @keyframes slideFlipIn { 0%{opacity:0;transform:rotateY(90deg);}100%{opacity:1;transform:rotateY(0);} }
        @keyframes slideCubeIn { 0%{opacity:0;transform:translateZ(-300px) rotateY(30deg);}100%{opacity:1;transform:translateZ(0) rotateY(0);} }
        @keyframes slideCoverflowIn { 0%{opacity:0;transform:translateX(60%) scale(0.8) rotateY(-20deg);}100%{opacity:1;transform:translateX(0) scale(1) rotateY(0);} }
        @keyframes slideSlideIn { 0%{opacity:0;transform:translateX(100%);}100%{opacity:1;transform:translateX(0);} }
        @keyframes slideParallaxIn { 0%{opacity:0;transform:translateY(60px) scale(0.95);}100%{opacity:1;transform:translateY(0) scale(1);} }

        .relogio-slide { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
        .relogio-content {
    padding: 50px 70px;
    background: rgb(0 0 0 / 0%);
    border-radius: var(--radius-xl);
    border: 0px solid rgb(255 255 255 / 0%);
    box-shadow: 0 8px 40px rgb(0 0 0 / 0%);
    text-shadow: 0 2px 20px rgb(0 0 0 / 0%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 40%;
}
        .relogio-slide .hora-grande { font-size:17rem; font-weight:700; color:#fff; letter-spacing:4px; text-shadow:0 0 60px rgba(56,189,248,0.3); line-height:1; }
        .relogio-slide .data-grande { font-size:2.6rem; color:rgba(255,255,255,0.95); margin-top:12px; font-weight:300; letter-spacing:2px; }
        .relogio-slide .clima-grande { font-size:2rem; color:rgba(255,255,255,0.95); margin-top:16px; display:flex; align-items:center; gap:16px; background:rgba(0,0,0,0.3); padding:8px 24px; border-radius:40px; backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.08); }
        .logo-slide { display:flex; align-items:center; justify-content:center; height:100%; width:100%; padding:20px; }
        .logo-slide img { max-height:55%; max-width:75%; object-fit:contain; animation:logoZoom 4s ease-in-out infinite; filter:drop-shadow(0 0 40px rgba(0,0,0,0.5)); }
        @keyframes logoZoom { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }

        /* Demais estilos de aniversariantes, clima, etc., mantidos como antes */
        .birthday-hero-slide { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
        .bg-blur { position:absolute; top:0;left:0;width:100%;height:100%; object-fit:cover; opacity:0.12; filter:blur(8px); z-index:0; }
        .hero-content { position:relative; z-index:1; text-align:center; padding:45px 65px; background:rgba(0,0,0,0.45); backdrop-filter:blur(18px); border-radius:var(--radius-xl); border:1px solid rgba(255,215,0,0.25); box-shadow:0 0 80px rgba(255,215,0,0.12); max-width:90%; }
        .hero-avatar { width:120px; height:120px; border-radius:50%; background:linear-gradient(135deg,#ffd700,#f59e0b); display:flex; align-items:center; justify-content:center; font-size:4rem; color:#fff; margin:0 auto 16px; box-shadow:0 0 50px rgba(255,215,0,0.35); }
        .hero-name { font-size:4rem; font-weight:800; color:#fff; text-shadow:0 3px 30px rgba(0,0,0,0.6); margin-bottom:8px; }
        .hero-date { font-size:1.8rem; color:#ffd700; font-weight:500; }
        .hero-msg { font-size:1.4rem; color:rgba(255,255,255,0.9); margin-top:16px; background:rgba(255,215,0,0.1); padding:10px 24px; border-radius:40px; border:1px solid rgba(255,215,0,0.2); display:inline-block; }
        .hero-days { font-size:1.2rem; color:rgba(255,255,255,0.7); margin-top:12px; }
        .birthday-week-slide { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; }
        .week-bg { position:absolute; top:0;left:0;width:100%;height:100%; object-fit:cover; opacity:0.08; filter:blur(6px); z-index:0; }
        .birthday-week-slide h2 { position:relative; z-index:1; color:#fff; font-size:2.4rem; font-weight:800; margin-bottom:20px; text-shadow:0 2px 25px rgba(0,0,0,0.5); display:flex; align-items:center; gap:12px; }
        .birthday-week-grid { position:relative; z-index:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px; width:100%; max-width:1000px; max-height:70%; overflow-y:auto; padding:10px 4px; }
        .birthday-week-card { background:rgba(255,255,255,0.06); backdrop-filter:blur(14px); border-radius:var(--radius-md); padding:20px 16px; text-align:center; border:1px solid rgba(255,255,255,0.12); box-shadow:0 8px 24px rgba(0,0,0,0.2); transition: transform 0.3s; }
        .birthday-week-card:hover { transform:translateY(-6px); }
        .avatar-sm { width:60px; height:60px; border-radius:50%; background:rgba(255,215,0,0.15); display:flex; align-items:center; justify-content:center; font-size:2rem; color:#ffd700; margin:0 auto 8px; border:2px solid rgba(255,215,0,0.2); }
        .b-name { font-weight:700; color:#fff; font-size:1.1rem; }
        .b-role { font-size:0.8rem; color:rgba(255,255,255,0.7); }
        .b-date { font-size:0.8rem; color:#ffd700; font-weight:600; }
        .b-days { font-size:0.7rem; color:rgba(255,255,255,0.5); }

        .weather-slide { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 40px; }
        .weather-bg { position:absolute; top:0;left:0;width:100%;height:100%; object-fit:cover; opacity:0.1; filter:blur(8px); }
        .weather-content { position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:20px; width:92%; max-width:1200px; }
        .weather-main { grid-column:1/-1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding-bottom:20px; }
        .temp-big { font-size:6rem; font-weight:700; color:#fff; text-shadow:0 2px 40px rgba(0,0,0,0.5); }
        .condition { font-size:2rem; font-weight:400; color:rgba(255,255,255,0.9); display:flex; align-items:center; gap:16px; }
        .condition i { font-size:2.6rem; color:#facc15; }
        .weather-detail { background:rgba(255,255,255,0.06); backdrop-filter:blur(12px); border-radius:var(--radius-md); padding:18px 12px; text-align:center; border:1px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; gap:4px; min-height:90px; justify-content:center; }
        .weather-detail .label { font-size:0.8rem; text-transform:uppercase; color:rgba(255,255,255,0.6); letter-spacing:0.5px; }
        .weather-detail .value { font-size:1.6rem; font-weight:600; color:#fff; }
        .forecast { grid-column:1/-1; display:flex; justify-content:space-around; gap:16px; flex-wrap:wrap; margin-top:12px; }
        .forecast .day { background:rgba(255,255,255,0.06); backdrop-filter:blur(8px); border-radius:var(--radius-md); padding:14px 18px; min-width:90px; text-align:center; border:1px solid rgba(255,255,255,0.06); flex:1; max-width:160px; }
        .day-name { font-size:0.9rem; color:rgba(255,255,255,0.8); font-weight:600; }
        .day-icon { font-size:2.2rem; margin:6px 0; }
        .day-desc { font-size:0.8rem; color:rgba(255,255,255,0.7); }
        .day-temp { font-size:1.3rem; font-weight:600; color:#fff; }

        .slide-controls { position:absolute; bottom:16px; right:16px; z-index:15; display:flex; gap:8px; }
        .slide-controls button { background:rgba(0,0,0,0.5); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.1); color:white; width:36px; height:36px; border-radius:50%; font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:0.2s; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
        .slide-controls button:hover { background:rgba(56,189,248,0.45); }
        .slide-indicators { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:5; }
        .dot-indicator { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.4); transition:all 0.3s; cursor:pointer; }
        .dot-indicator.active { background:#fff; transform:scale(1.6); box-shadow:0 0 10px rgba(56,189,248,0.6); }

        .loading-overlay { position:fixed; top:0;left:0;width:100%;height:100%; background:linear-gradient(135deg,#0b1a2e,#0d2137,#0a1628); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; transition:opacity 0.5s; }
        .loading-overlay.hidden { opacity:0; pointer-events:none; }
        .loading-logo img { height:200px; object-fit:contain; }
        .loading-status { position:absolute; bottom:80px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px; font-size:0.9rem; color:rgba(255,255,255,0.7); }
        .donut-spinner { width:24px; height:24px; border:3px solid rgba(56,189,248,0.15); border-top:3px solid var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }

    <script>
        (function() {
            const CONFIG = {
                lat: -23.5505,
                lon: -46.6333,
                slideInterval: 15000,
                videoSlideDuration: 30000,
                reloadInterval: 600000,
                backgroundSyncInterval: 120000,
                radioInterval: 14400000,
                youtubeRefreshInterval: 60000,

            };
            const RADIOS = [
                { id: 'tunein1', name: 'Jovem Pan News', iframe: '<iframe src="https://tunein.com/embed/player/s8129/" style="width:100%; height:75px;" scrolling="no" frameborder="no" allow="autoplay"></iframe>' },
                { id: 'tunein2', name: 'Mix FM', iframe: '<iframe src="https://tunein.com/embed/player/s86725/" style="width:100%; height:75px;" scrolling="no" frameborder="no" allow="autoplay"></iframe>' },
                { id: 'tunein3', name: 'Antena 1', iframe: '<iframe src="https://tunein.com/embed/player/s67624/" style="width:100%; height:75px;" scrolling="no" frameborder="no" allow="autoplay"></iframe>' }
            ];
            const SHEET_ID = '1S9Crqa7EBgybANgqoRe2a0YKG8FGeHAqIRJswdI69bI';
            const BASES = {
                banners: `https://opensheet.elk.sh/${SHEET_ID}/banners`,
                cadastro: `https://opensheet.elk.sh/${SHEET_ID}/cadastro`,
                video: `https://opensheet.elk.sh/${SHEET_ID}/video`,
                dolar: `https://opensheet.elk.sh/${SHEET_ID}/dolar`,
            };

            let allSlides = [], visibleSlides = [];
            let currentSlideIndex = 0, slideTimer = null, paused = false;
            let cadastros = [], bannersData = [], videoData = [];
            let slideVisibility = {};
            let sidebarHidden = false;
            let currentRadioIndex = 0, radioTimer = null;
            let currentVideoId = 'dQw4w9WgXcQ';
            const transicoes = ['fade','zoom','flip','cube','coverflow','slide','parallax'];
            let currentWeatherData = null;

            // Horário manual
            let manualOffsetHours = 0;
            let horaExataDefinida = null;

            function getHoraSincronizada() {
                if (horaExataDefinida) {
                    const fixadoEm = localStorage.getItem('exactTimeFixadoEm');
                    if (fixadoEm) {
                        const inicio = new Date(parseInt(fixadoEm));
                        const diff = Date.now() - inicio.getTime();
                        return new Date(horaExataDefinida.getTime() + diff);
                    }
                    return new Date(horaExataDefinida.getTime());
                }
                if (manualOffsetHours !== 0) {
                    return new Date(Date.now() + manualOffsetHours * 3600000);
                }
                return new Date();
            }

            function atualizarTodosRelogios() {
                const agora = getHoraSincronizada();
                document.getElementById('bottom-hora').textContent = agora.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
                document.getElementById('bottom-data').textContent = agora.toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
                const elHora = document.getElementById('slide-hora');
                if (elHora) elHora.textContent = agora.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
                const elData = document.getElementById('slide-data');
                if (elData) elData.textContent = agora.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
                const elTemp = document.getElementById('slide-temp');
                if (elTemp && currentWeatherData) {
                    const temp = Math.round(currentWeatherData.current_weather?.temperature || 0);
                    elTemp.textContent = `${temp}°C`;
                }
                const elIcon = document.getElementById('slide-clima-icon');
                if (elIcon && currentWeatherData) {
                    const code = currentWeatherData.current_weather?.weathercode || 0;
                    if (code <= 3) elIcon.className = 'fas fa-sun';
                    else if (code <= 48) elIcon.className = 'fas fa-cloud';
                    else if (code <= 67) elIcon.className = 'fas fa-cloud-rain';
                    else elIcon.className = 'fas fa-bolt';
                }
            }
            setInterval(atualizarTodosRelogios, 1000);

            // Clima
            async function buscarClima() {
                try {
                    const resp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}&current_weather=true&timezone=America/Sao_Paulo&daily=weathercode,temperature_2m_max,temperature_2m_min&forecast_days=5`);
                    const data = await resp.json();
                    if (data.current_weather) {
                        currentWeatherData = data;
                        const temp = Math.round(data.current_weather.temperature);
                        const tempEl = document.getElementById('temp');
                        if (tempEl) tempEl.textContent = `${temp}°C`;
                        const icon = document.querySelector('#clima-box i');
                        if (icon) {
                            const code = data.current_weather.weathercode;
                            if (code <= 3) icon.className = 'fas fa-sun';
                            else if (code <= 48) icon.className = 'fas fa-cloud';
                            else if (code <= 67) icon.className = 'fas fa-cloud-rain';
                            else icon.className = 'fas fa-bolt';
                        }
                        // Atualizar slide de clima se estiver visível
                        const slideWeather = document.querySelector('.slide[data-type="previsao_tempo"]');
                        if (slideWeather) {
                            const ws = buildWeatherSlide(data);
                            if (ws) slideWeather.innerHTML = ws;
                        }
                        atualizarTodosRelogios();
                    }
                } catch (e) {
                    console.error('Erro ao buscar clima:', e);
                }
            }
            buscarClima();
            setInterval(buscarClima, 900000);

            // Dólar - busca SEMPRE o ÚLTIMO registro da planilha
            // Dólar - busca o PRIMEIRO registro (mais recente) da planilha
async function buscarCotacaoDolar() {
    try {
        const response = await fetch(BASES.dolar);
        const dados = await response.json();
        
        if (dados && dados.length > 0) {
            // Pega o PRIMEIRO registro (índice 0) que é o mais recente
            const registroMaisRecente = dados[0];
            
            // Procura pelo campo 'valor' que é o nome da coluna
            let valor = registroMaisRecente['valor'] || 
                       registroMaisRecente['Valor'] || 
                       registroMaisRecente['cotacao'] ||
                       registroMaisRecente['Cotacao'] ||
                       registroMaisRecente['DOLAR'] ||
                       registroMaisRecente['dolar'];
            
            // Se não encontrou, tenta qualquer valor numérico
            if (valor === null || valor === undefined) {
                const valores = Object.values(registroMaisRecente).filter(v => 
                    v !== null && v !== '' && !isNaN(parseFloat(String(v).replace(',', '.')))
                );
                if (valores.length > 0) {
                    valor = valores[0];
                }
            }
            
            if (valor !== null && valor !== undefined) {
                // Converte para string e trata
                let strValor = String(valor).replace(/[R\$\s]/g, '').trim();
                
                let numValor;
                if (strValor.includes(',')) {
                    // Tem vírgula, é separador decimal (formato brasileiro)
                    numValor = parseFloat(strValor.replace(/\./g, '').replace(',', '.'));
                } else if (strValor.includes('.')) {
                    // Tem ponto, pode ser separador decimal
                    numValor = parseFloat(strValor);
                } else {
                    // Número inteiro
                    numValor = parseFloat(strValor);
                }
                
                // Verifica se o valor é válido e formata
                if (!isNaN(numValor) && numValor > 0) {
                    // Formata com duas casas decimais usando vírgula como separador
                    const valorFormatado = numValor.toFixed(2).replace('.', ',');
                    document.getElementById('dolarValor').textContent = `R$ ${valorFormatado}`;
                    
                    // Salva no localStorage para cache
                    localStorage.setItem('dolarCache', JSON.stringify({
                        valor: valorFormatado,
                        data: registroMaisRecente['Data'] || '',
                        timestamp: Date.now(),
                        raw: numValor
                    }));
                } else {
                    document.getElementById('dolarValor').textContent = 'R$ --';
                }
            } else {
                // Tenta usar o cache
                const cache = localStorage.getItem('dolarCache');
                if (cache) {
                    try {
                        const parsed = JSON.parse(cache);
                        if (parsed.valor) {
                            document.getElementById('dolarValor').textContent = `R$ ${parsed.valor}`;
                        }
                    } catch (e) {}
                } else {
                    document.getElementById('dolarValor').textContent = 'R$ --';
                }
            }
        } else {
            // Tenta usar o cache
            const cache = localStorage.getItem('dolarCache');
            if (cache) {
                try {
                    const parsed = JSON.parse(cache);
                    if (parsed.valor) {
                        document.getElementById('dolarValor').textContent = `R$ ${parsed.valor}`;
                    }
                } catch (e) {}
            } else {
                document.getElementById('dolarValor').textContent = 'R$ --';
            }
        }
    } catch (e) {
        console.error('Erro ao buscar dólar:', e);
        // Tenta usar o cache em caso de erro
        const cache = localStorage.getItem('dolarCache');
        if (cache) {
            try {
                const parsed = JSON.parse(cache);
                if (parsed.valor) {
                    document.getElementById('dolarValor').textContent = `R$ ${parsed.valor}`;
                }
            } catch (e) {}
        } else {
            document.getElementById('dolarValor').textContent = 'R$ --';
        }
    }
}
            
            // Executa a busca e agenda atualizações
            buscarCotacaoDolar();
            setInterval(buscarCotacaoDolar, CONFIG.dolarRefreshInterval);

            // Vídeo
            function atualizarIframesVideo(id) {
                const iframeSlide = document.getElementById('live-youtube-iframe');
                if (iframeSlide) iframeSlide.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${id}&cc_load_policy=1&hl=pt&playsinline=1`;
                const iframeSidebar = document.getElementById('youtube-player');
                if (iframeSidebar) iframeSidebar.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${id}&cc_load_policy=1&hl=pt&playsinline=1`;
            }
            async function buscarVideoDaPlanilha() {
                try {
                    const data = await fetch(BASES.video).then(r => r.json());
                    videoData = data;
                    if (data && data.length > 0) {
                        const id = data[0]['id_link'] || data[0]['id'] || data[0]['ID'] || '';
                        if (id && id !== currentVideoId) {
                            currentVideoId = id;
                            atualizarIframesVideo(currentVideoId);
                            const idx = allSlides.findIndex(s => s.type === 'video');
                            if (idx !== -1) {
                                allSlides[idx].html = `<iframe id="live-youtube-iframe" src="https://www.youtube.com/embed/${currentVideoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${currentVideoId}&cc_load_policy=1&hl=pt&playsinline=1" style="width:100%;height:100%;border:none;"></iframe>`;
                                rebuildSlides();
                            }
                        }
                    }
                } catch (e) {}
            }
            buscarVideoDaPlanilha();
            setInterval(buscarVideoDaPlanilha, CONFIG.youtubeRefreshInterval);

            // Aniversariantes
            const BG_ANIVERSARIO = 'https://img.magnific.com/vetores-gratis/bandeira-de-aniversario-azul-com-baloes-e-confete_107791-30996.jpg?semt=ais_hybrid&w=740&q=80';
            function obterAniversariantesDaSemana() {
                const hoje = getHoraSincronizada();
                const hojeLimpo = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
                return cadastros.filter(c => {
                    if (!c.data_nascimento) return false;
                    const partes = c.data_nascimento.split(/[/-]/);
                    if (partes.length < 2) return false;
                    const d = parseInt(partes[0]), m = parseInt(partes[1]);
                    const dataNasc = new Date(hoje.getFullYear(), m-1, d);
                    const diff = Math.floor((dataNasc - hojeLimpo) / (1000*60*60*24));
                    return diff >= -7 && diff <= 7;
                }).map(c => {
                    const partes = c.data_nascimento.split(/[/-]/);
                    const d = parseInt(partes[0]), m = parseInt(partes[1]);
                    const dataNasc = new Date(hoje.getFullYear(), m-1, d);
                    const diff = Math.floor((dataNasc - hojeLimpo) / (1000*60*60*24));
                    return { nome: c.nome_usuario || c.nome || 'Colaborador', cargo: c.cargo || '', dia: d, mes: m, diff, inicial: (c.nome_usuario || c.nome || '?').charAt(0).toUpperCase() };
                }).sort((a,b) => a.diff - b.diff);
            }
            function buildBirthdayHeroSlide(pessoa, isFuture, days) {
                const mensagens = ['🎉 Celebrando mais um ano de vida!','🌟 Que a jornada continue brilhante!','🎂 Agradecemos por fazer parte da nossa equipe!','🚀 Parabéns por mais uma volta ao sol!'];
                const msg = mensagens[Math.floor(Math.random()*mensagens.length)];
                const dataStr = `${String(pessoa.dia).padStart(2,'0')}/${String(pessoa.mes).padStart(2,'0')}`;
                const daysText = isFuture ? `Faltam apenas ${days} dias` : (days===0 ? '🎉 Hoje é o dia!' : `Já comemorou há ${Math.abs(days)} dias`);
                return `<div class="birthday-hero-slide"><div class="bg-blur" style="background:url('${BG_ANIVERSARIO}') center/cover;"></div><div class="hero-content"><div class="hero-avatar">${pessoa.inicial}</div><div class="hero-name">${pessoa.nome}</div><div class="hero-date">${dataStr}</div><div class="hero-days">${daysText}</div><div class="hero-msg">${msg}</div></div></div>`;
            }
            function buildBirthdayWeekSlide(aniversariantes) {
                const cards = aniversariantes.map(a => `
                    <div class="birthday-week-card">
                        <div class="avatar-sm">${a.inicial}</div>
                        <div class="b-name">${a.nome}</div>
                        <div class="b-role">${a.cargo}</div>
                        <div class="b-date">${String(a.dia).padStart(2,'0')}/${String(a.mes).padStart(2,'0')}</div>
                        <div class="b-days">${a.diff===0?'🎉 Hoje!':a.diff>0?`Em ${a.diff} dias`:`Há ${Math.abs(a.diff)} dias`}</div>
                    </div>`).join('');
                return `<div class="birthday-week-slide"><div class="week-bg" style="background:url('${BG_ANIVERSARIO}') center/cover;"></div><h2><i class="fas fa-birthday-cake"></i> Aniversariantes da Semana</h2><div class="birthday-week-grid">${cards}</div></div>`;
            }
            function buildWeatherSlide(weatherData) {
                if (!weatherData?.current_weather) return null;
                const cw = weatherData.current_weather, daily = weatherData.daily;
                const temp = Math.round(cw.temperature);
                const getWeatherInfo = code => {
                    const map = {
                        0:{desc:'Céu limpo',icon:'fa-sun'},
                        1:{desc:'Predomin. limpo',icon:'fa-sun'},
                        2:{desc:'Parcial. nublado',icon:'fa-cloud-sun'},
                        3:{desc:'Nublado',icon:'fa-cloud'},
                        45:{desc:'Nevoeiro',icon:'fa-smog'},
                        61:{desc:'Chuva fraca',icon:'fa-cloud-rain'},
                        95:{desc:'Tempestade',icon:'fa-bolt'}
                    };
                    return map[code] || {desc:'Desconhecido',icon:'fa-question'};
                };
                const info = getWeatherInfo(cw.weathercode);
                let forecastHtml = '';
                if (daily?.time) for (let i=0; i<Math.min(4,daily.time.length); i++) {
                    const d = new Date(daily.time[i]), dayName = i===0?'Hoje':d.toLocaleDateString('pt-BR',{weekday:'short'});
                    const max = Math.round(daily.temperature_2m_max[i]), min = Math.round(daily.temperature_2m_min[i]);
                    const inf = getWeatherInfo(daily.weathercode[i]);
                    forecastHtml += `<div class="day"><div class="day-name">${dayName}</div><div class="day-icon"><i class="fas ${inf.icon}"></i></div><div class="day-desc">${inf.desc}</div><div class="day-temp">${max}° / ${min}°</div></div>`;
                }
                return `<div class="weather-slide"><div class="weather-bg" style="background:url('https://img.magnific.com/vetores-gratis/fundo-de-ceu-pastel-em-aquarela-pintado-a-mao_23-2148902768.jpg') center/cover;"></div><div class="weather-content"><div class="weather-main"><div class="temp-big">${temp}°C</div><div class="condition"><i class="fas ${info.icon}"></i> ${info.desc}</div></div><div class="weather-detail"><span class="label">Sensação</span><span class="value">${Math.round(temp-2)}°C</span></div><div class="weather-detail"><span class="label">Umidade</span><span class="value">${cw.relative_humidity || '--'}%</span></div><div class="weather-detail"><span class="label">Vento</span><span class="value">${Math.round(cw.windspeed)} km/h</span></div><div class="forecast">${forecastHtml}</div></div></div>`;
            }

            function salvarVisibilidade() { localStorage.setItem('slideVisibility', JSON.stringify(slideVisibility)); }
            function carregarVisibilidade() {
                const saved = localStorage.getItem('slideVisibility');
                if (saved) slideVisibility = JSON.parse(saved);
            }
            carregarVisibilidade();

            function construirSlides() {
                allSlides = [];
                allSlides.push({ type: 'relogio', html: `<div class="relogio-slide"><div class="relogio-content"><div class="hora-grande" id="slide-hora">00:00</div><div class="data-grande" id="slide-data">Carregando...</div><div class="clima-grande"><i class="fas fa-sun" id="slide-clima-icon"></i> <span id="slide-temp">--°C</span></div></div></div>` });
                allSlides.push({ type: 'logo', html: `<div class="logo-slide"><img src="https://www.centrobor.com.br/wp-content/uploads/2026/01/centrobor-logo-branca-scaled.webp" alt="Centrobor"></div>` });
                if (currentWeatherData) {
                    const ws = buildWeatherSlide(currentWeatherData);
                    if (ws) allSlides.push({ type: 'previsao_tempo', html: ws });
                }
                const aniv = obterAniversariantesDaSemana();
                if (aniv.length) {
                    aniv.filter(a=>a.diff<0).forEach(a=>allSlides.push({type:'aniversariante_individual',html:buildBirthdayHeroSlide(a,false,a.diff),customLabel:'🎂 '+a.nome}));
                    aniv.filter(a=>a.diff>0).forEach(a=>allSlides.push({type:'aniversariante_futuro',html:buildBirthdayHeroSlide(a,true,a.diff),customLabel:'⏳ '+a.nome}));
                    aniv.filter(a=>a.diff===0).forEach(a=>allSlides.push({type:'aniversariante_dia',html:buildBirthdayHeroSlide(a,false,0),customLabel:'🎉 '+a.nome}));
                    allSlides.push({type:'aniversariantes_semana',html:buildBirthdayWeekSlide(aniv),customLabel:'Aniversariantes da Semana'});
                }
                allSlides.push({type:'video',html:`<iframe id="live-youtube-iframe" src="https://www.youtube.com/embed/${currentVideoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${currentVideoId}&cc_load_policy=1&hl=pt&playsinline=1" style="width:100%;height:100%;border:none;"></iframe>`});
                allSlides.forEach(s => { if (slideVisibility[s.type]===undefined) slideVisibility[s.type]=true; });
                salvarVisibilidade();
            }

            function rebuildSlides() {
                visibleSlides = allSlides.filter(s => slideVisibility[s.type]!==false);
                if (!visibleSlides.length) visibleSlides = allSlides;
                const zone = document.getElementById('slides-zone');
                zone.querySelectorAll('.slide').forEach(el=>el.remove());
                visibleSlides.forEach((s,i)=>{
                    const div = document.createElement('div');
                    div.className = `slide ${i===0?'active':''}`;
                    div.dataset.index = i;
                    div.dataset.type = s.type;
                    div.innerHTML = s.html;
                    zone.appendChild(div);
                });
                document.getElementById('indicators').innerHTML = visibleSlides.map((_,i)=>`<div class="dot-indicator${i===0?' active':''}" data-index="${i}"></div>`).join('');
                document.querySelectorAll('.dot-indicator').forEach(d=>d.addEventListener('click',function(){irParaSlide(parseInt(this.dataset.index));resetarTimer();}));
                if (currentSlideIndex>=visibleSlides.length) currentSlideIndex=0;
                irParaSlide(currentSlideIndex);
                resetarTimer();
            }

            function irParaSlide(idx) {
                const slidesEl = document.querySelectorAll('.slide');
                if (!slidesEl.length) return;
                idx = Math.min(Math.max(0,idx), slidesEl.length-1);
                slidesEl.forEach(s=>{s.classList.remove('active'); s.className='slide';});
                document.querySelectorAll('.dot-indicator').forEach(d=>d.classList.remove('active'));
                const slideEl = slidesEl[idx];
                slideEl.classList.add('slide-transition-'+transicoes[Math.floor(Math.random()*transicoes.length)], 'active');
                document.querySelector(`.dot-indicator[data-index="${idx}"]`)?.classList.add('active');
                currentSlideIndex = idx;
                const s = visibleSlides[idx];
                const bottombar = document.getElementById('bottombar');
                if (s && s.type === 'relogio') {
                    bottombar.classList.add('relogio-active');
                } else {
                    bottombar.classList.remove('relogio-active');
                }
                if (s?.type === 'aniversariante_dia') dispararConfetes();
                if (s?.type === 'relogio') atualizarTodosRelogios();
            }

            function proximoSlide() { if (visibleSlides.length) irParaSlide((currentSlideIndex+1)%visibleSlides.length); }
            function slideAnterior() { if (visibleSlides.length) irParaSlide((currentSlideIndex-1+visibleSlides.length)%visibleSlides.length); }
            function iniciarTimer() {
                if (slideTimer) clearTimeout(slideTimer);
                if (!visibleSlides.length) return;
                const dur = visibleSlides[currentSlideIndex]?.type==='video' ? CONFIG.videoSlideDuration : CONFIG.slideInterval;
                slideTimer = setTimeout(()=>{if(!paused){proximoSlide();iniciarTimer();}else iniciarTimer();}, dur);
            }
            function resetarTimer() { if(slideTimer) clearTimeout(slideTimer); iniciarTimer(); }
            function dispararConfetes() { if (typeof confetti === 'function') { confetti({particleCount:150,spread:70,origin:{y:0.6}}); setTimeout(()=>confetti({particleCount:100,angle:60,spread:55,origin:{x:0}}),200); } }

            // Rádio
            function carregarRadio(index) {
                const radio = RADIOS[index];
                if (!radio) return;
                document.getElementById('radio-box').innerHTML = radio.iframe;
                currentRadioIndex = index;
                localStorage.setItem('radioIndex', index);
                document.querySelectorAll('#radioSelector button').forEach(b => b.classList.toggle('active-radio', parseInt(b.dataset.radio)===index));
            }
            function proximaRadio() { carregarRadio((currentRadioIndex+1)%RADIOS.length); }
            function iniciarRadioRotacao() {
                const saved = localStorage.getItem('radioIndex');
                carregarRadio(saved ? parseInt(saved) : 0);
                radioTimer = setInterval(proximaRadio, CONFIG.radioInterval);
                document.querySelectorAll('#radioSelector button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.radio);
                        carregarRadio(idx);
                        clearInterval(radioTimer);
                        radioTimer = setInterval(proximaRadio, CONFIG.radioInterval);
                        document.getElementById('radioSelector').classList.remove('active');
                    });
                });
            }

            // Sidebar
            function toggleSidebar() {
                sidebarHidden = !sidebarHidden;
                document.getElementById('mainGrid').classList.toggle('sidebar-hidden', sidebarHidden);
                document.getElementById('topToggleIcon').className = sidebarHidden ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
                document.getElementById('sidebarTopToggle').classList.toggle('hidden-sidebar', sidebarHidden);
                localStorage.setItem('sidebarHidden', sidebarHidden);
            }
            function carregarSidebarState() {
                const saved = localStorage.getItem('sidebarHidden');
                if (saved !== null) {
                    sidebarHidden = JSON.parse(saved);
                    document.getElementById('mainGrid').classList.toggle('sidebar-hidden', sidebarHidden);
                    document.getElementById('topToggleIcon').className = sidebarHidden ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
                    document.getElementById('sidebarTopToggle').classList.toggle('hidden-sidebar', sidebarHidden);
                }
            }

            // Ponto - Horários: 8:00 e 17:45
            let pontoAtivo = false;
            let pontoFechamentoTimer = null;

            function verificarLembretePonto() {
                const agora = getHoraSincronizada();
                const totalMin = agora.getHours() * 60 + agora.getMinutes();
                const horarios = [
                    { label: 'Iniciar', h: 8, m: 0 },
                    { label: 'Encerrar', h: 17, m: 45 }
                ];
                
                let alvo = null;
                for (let h of horarios) {
                    const alvoMin = h.h * 60 + h.m;
                    if (alvoMin - totalMin >= -1 && alvoMin - totalMin <= 3) {
                        alvo = h;
                        break;
                    }
                }

                if (alvo && !pontoAtivo) {
                    const hoje = agora.toDateString();
                    const chave = `ponto_${alvo.h}_${alvo.m}_${hoje}`;
                    if (localStorage.getItem(chave) === 'exibido') return;

                    pontoAtivo = true;
                    document.getElementById('pontoTitulo').textContent = `⏰ ${alvo.label} o Expediente`;
                    document.getElementById('pontoSub').textContent = `Já bateu o ponto hoje?`;
                    document.getElementById('pontoMsgFinal').style.display = 'none';
                    document.getElementById('pontoOverlay').classList.add('active');
                    
                    let segundosRestantes = 180;
                    atualizarTempoRestante(segundosRestantes);
                    
                    if (pontoFechamentoTimer) clearInterval(pontoFechamentoTimer);
                    pontoFechamentoTimer = setInterval(() => {
                        segundosRestantes--;
                        atualizarTempoRestante(segundosRestantes);
                        if (segundosRestantes <= 0) {
                            clearInterval(pontoFechamentoTimer);
                            desativarPonto();
                        }
                    }, 1000);
                    
                    localStorage.setItem(chave, 'exibido');
                }
            }

            function atualizarTempoRestante(segundos) {
                const el = document.getElementById('pontoTempoRestante');
                if (segundos > 0) {
                    const mins = Math.floor(segundos / 60);
                    const secs = segundos % 60;
                    el.textContent = `⏳ Fechando em ${mins}:${String(secs).padStart(2, '0')}`;
                    el.style.display = 'block';
                } else {
                    el.textContent = '⏳ Fechando...';
                }
            }

            function desativarPonto() {
                pontoAtivo = false;
                document.getElementById('pontoOverlay').classList.remove('active');
                if (pontoFechamentoTimer) {
                    clearInterval(pontoFechamentoTimer);
                    pontoFechamentoTimer = null;
                }
                document.getElementById('pontoMsgFinal').style.display = 'none';
            }

            document.getElementById('pontoBtn').addEventListener('click', () => {
                desativarPonto();
                const btn = document.getElementById('pontoBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ OK!';
                btn.style.background = '#4caf50';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                }, 2000);
            });

            document.getElementById('pontoFecharBtn').addEventListener('click', () => {
                desativarPonto();
            });

            setInterval(verificarLembretePonto, 10000);
            setTimeout(verificarLembretePonto, 1000);

            function limparRegistrosPontoAntigos() {
                const hoje = new Date().toDateString();
                const keys = Object.keys(localStorage);
                for (const key of keys) {
                    if (key.startsWith('ponto_') && !key.includes(hoje)) {
                        localStorage.removeItem(key);
                    }
                }
            }
            limparRegistrosPontoAntigos();

            // Slide Manager
            function initSlideManager() {
                const panel = document.getElementById('slideManagerPanel');
                const overlay = document.getElementById('slideManagerOverlay');
                document.getElementById('menuToggle').addEventListener('click', ()=>{ panel.classList.add('active'); overlay.classList.add('active'); });
                document.getElementById('closeSlideManager').addEventListener('click', ()=>{ panel.classList.remove('active'); overlay.classList.remove('active'); });
                overlay.addEventListener('click', ()=>{ panel.classList.remove('active'); overlay.classList.remove('active'); });

                document.querySelectorAll('.filter-buttons button[data-filter]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.filter-buttons button[data-filter]').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        const cat = this.dataset.filter;
                        document.querySelectorAll('#slideListContainer .slide-item').forEach(item => {
                            item.style.display = (cat === 'all' || item.dataset.cat === cat) ? 'flex' : 'none';
                        });
                    });
                });
                document.getElementById('selectAllSlides').addEventListener('click', ()=>{
                    document.querySelectorAll('#slideListContainer input[type="checkbox"]').forEach(cb => { cb.checked = true; slideVisibility[cb.dataset.type] = true; });
                    salvarVisibilidade(); rebuildSlides();
                });
                document.getElementById('deselectAllSlides').addEventListener('click', ()=>{
                    document.querySelectorAll('#slideListContainer input[type="checkbox"]').forEach(cb => { cb.checked = false; slideVisibility[cb.dataset.type] = false; });
                    salvarVisibilidade(); rebuildSlides();
                });

                document.getElementById('saveDurationBtn').addEventListener('click', ()=>{
                    let val = parseInt(document.getElementById('durationInput').value);
                    if (isNaN(val) || val<5) val=15;
                    CONFIG.slideInterval = val*1000;
                    localStorage.setItem('slideDurationSeconds', val);
                    resetarTimer();
                });
                document.getElementById('saveOffsetBtn').addEventListener('click', ()=>{
                    let val = parseFloat(document.getElementById('manualOffset').value);
                    if (isNaN(val)) val=0;
                    manualOffsetHours = val;
                    localStorage.setItem('manualOffsetHours', val);
                    document.getElementById('offsetStatus').textContent = `(${val}h = ${val>=0?'+':''}${val}h local)`;
                    if (val !== 0) {
                        horaExataDefinida = null;
                        localStorage.removeItem('exactTimeISO'); localStorage.removeItem('exactTimeFixadoEm');
                        document.getElementById('exactDateTimeStatus').textContent = '';
                    }
                    atualizarTodosRelogios();
                });
                document.getElementById('saveExactDateTimeBtn').addEventListener('click', ()=>{
                    const val = document.getElementById('manualExactDateTime').value;
                    if (!val) {
                        horaExataDefinida = null;
                        localStorage.removeItem('exactTimeISO'); localStorage.removeItem('exactTimeFixadoEm');
                        document.getElementById('exactDateTimeStatus').textContent = 'Removido.';
                        return;
                    }
                    const d = new Date(val);
                    horaExataDefinida = d;
                    localStorage.setItem('exactTimeISO', d.toISOString());
                    localStorage.setItem('exactTimeFixadoEm', Date.now());
                    document.getElementById('exactDateTimeStatus').textContent = `Fixado: ${d.toLocaleString('pt-BR')}`;
                    manualOffsetHours = 0;
                    document.getElementById('manualOffset').value = 0;
                    document.getElementById('offsetStatus').textContent = '(0h = local)';
                    atualizarTodosRelogios();
                });

                function popularListaSlides() {
                    const container = document.getElementById('slideListContainer');
                    container.innerHTML = allSlides.map(s => {
                        const cat = s.type==='relogio'||s.type==='logo'?'geral':'novidades';
                        const label = s.customLabel || (s.type==='relogio'?'Relógio':s.type==='logo'?'Logo':s.type==='video'?'Vídeo':s.type);
                        const checked = slideVisibility[s.type] !== false;
                        return `<div class="slide-item" data-type="${s.type}" data-cat="${cat}">
                            <input type="checkbox" ${checked?'checked':''} data-type="${s.type}">
                            <span class="slide-label">${label}</span>
                            <span class="slide-category ${cat}">${cat}</span>
                        </div>`;
                    }).join('');
                    container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                        cb.addEventListener('change', function() {
                            slideVisibility[this.dataset.type] = this.checked;
                            salvarVisibilidade();
                            rebuildSlides();
                        });
                    });
                }
                popularListaSlides();
            }

            async function carregarDadosPlanilha() {
                try {
                    const [cadastro, video] = await Promise.all([
                        fetch(BASES.cadastro).then(r => r.json()).catch(() => []),
                        fetch(BASES.video).then(r => r.json()).catch(() => [])
                    ]);
                    cadastros = cadastro;
                    videoData = video;
                    if (video.length) {
                        const id = video[0]['id_link'] || video[0]['id'] || video[0]['ID'];
                        if (id) currentVideoId = id;
                    }
                } catch (e) {}
            }

            async function init() {
                carregarSidebarState();
                document.getElementById('sidebarTopToggle').addEventListener('click', toggleSidebar);

                const savedOffset = localStorage.getItem('manualOffsetHours');
                if (savedOffset) manualOffsetHours = parseFloat(savedOffset);
                const savedExactISO = localStorage.getItem('exactTimeISO');
                const savedFixadoEm = localStorage.getItem('exactTimeFixadoEm');
                if (savedExactISO && savedFixadoEm) {
                    horaExataDefinida = new Date(savedExactISO);
                    document.getElementById('manualExactDateTime').value = horaExataDefinida.toISOString().slice(0,16);
                    document.getElementById('exactDateTimeStatus').textContent = `Fixado: ${horaExataDefinida.toLocaleString('pt-BR')}`;
                }
                document.getElementById('manualOffset').value = manualOffsetHours;
                document.getElementById('offsetStatus').textContent = `(${manualOffsetHours}h = ${manualOffsetHours>=0?'+':''}${manualOffsetHours}h local)`;
                const savedDur = localStorage.getItem('slideDurationSeconds');
                if (savedDur) {
                    CONFIG.slideInterval = parseInt(savedDur)*1000;
                    document.getElementById('durationInput').value = parseInt(savedDur);
                }

                await carregarDadosPlanilha();
                construirSlides();
                rebuildSlides();
                iniciarRadioRotacao();
                initSlideManager();
                document.getElementById('loading-overlay').classList.add('hidden');

                document.getElementById('prev-slide-btn').addEventListener('click', ()=>{ slideAnterior(); resetarTimer(); });
                document.getElementById('next-slide-btn').addEventListener('click', ()=>{ proximoSlide(); resetarTimer(); });
                const pauseBtn = document.getElementById('pause-slide-btn');
                pauseBtn.addEventListener('click', ()=>{ paused = !paused; pauseBtn.innerHTML = paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>'; });

                const radioBtn = document.getElementById('radioFloatingBtn');
                const radioSelector = document.getElementById('radioSelector');
                radioBtn.addEventListener('click', (e)=>{ e.stopPropagation(); radioSelector.classList.toggle('active'); });
                document.addEventListener('click', (e)=>{ if (!radioSelector.contains(e.target) && e.target!==radioBtn) radioSelector.classList.remove('active'); });
                document.addEventListener('keydown', (e)=>{ if (e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='r') { e.preventDefault(); radioBtn.click(); } });

                setInterval(() => window.location.reload(), CONFIG.reloadInterval);
            }
            init();
        })();
    </script>
</body>
</html>
