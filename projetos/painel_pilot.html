<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Radar Centrobor – Gestão à Vista</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        /* ===== ESTILOS COMPLETOS ===== */
        :root {
            --bg-deep: #0b1a2e;
            --primary: #1e5a7a;
            --green: #2e7d32;
            --accent: #38bdf8;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 16px;
            --bottombar-height: 100px;
            --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0b1a2e;
            color: var(--text-light);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: linear-gradient(135deg, #0a3d2e, #0b2d4a, #0a4a3a, #0b3b5a, #0a5c3a);
            background-size: 400% 400%;
            animation: gradienteAnimado 18s ease-in-out infinite alternate;
            transition: background 0.9s ease, filter 0.9s ease, opacity 0.9s ease;
        }
        body.dark-mode .animated-bg {
            background: linear-gradient(135deg, #050a0f, #0a1018, #061018, #0a0e16, #050c10);
            background-size: 400% 400%;
            filter: brightness(0.55) saturate(0.7);
        }
        body.news-dark .animated-bg {
            background: #050505 !important;
            background-image: none !important;
            animation: none !important;
            filter: brightness(0.2) !important;
        }
        @keyframes gradienteAnimado {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 30%; }
            50% { background-position: 100% 70%; }
            75% { background-position: 0% 70%; }
            100% { background-position: 0% 50%; }
        }
        .app-layer { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
        .sidebar-top-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 60;
            background: rgba(11,26,46,0.5); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 50%;
            width: 44px; height: 44px; color: #fff; font-size: 1.2rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .sidebar-top-toggle:hover { background: rgba(56,189,248,0.25); border-color: var(--accent); transform: scale(1.05); }
        .sidebar-top-toggle i { transition: transform 0.3s ease; }
        .sidebar-top-toggle.hidden-sidebar i { transform: rotate(180deg); }

        .bottombar {
            height: var(--bottombar-height);
            background: rgba(11,26,46,0.55); backdrop-filter: blur(18px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; z-index: 10; order: 2; padding: 0 20px; position: relative;
            transition: height 0.5s ease, opacity 0.5s ease, padding 0.5s ease, background 0.9s ease, border-color 0.9s ease;
            overflow: hidden;
        }
        body.dark-mode .bottombar {
            background: rgba(5, 8, 14, 0.88);
            border-top-color: rgba(255,255,255,0.04);
        }
        body.news-dark .bottombar {
            background: rgba(0, 0, 0, 0.95) !important;
            border-top-color: rgba(255,255,255,0.03) !important;
        }
        .bottombar.canva-active { height: 0; padding: 0; opacity: 0; pointer-events: none; }
        .clock-center { display: flex; flex-direction: column; align-items: center; gap: 2px; transition: opacity 0.5s ease; }
        .bottombar.canva-active .clock-center { opacity: 0; pointer-events: none; }
        .clock-center .hora-grande {
            font-size: 4rem; font-weight: 700; color: #fff; letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(0,0,0,0.4), 0 0 80px rgba(56,189,248,0.15); line-height: 1;
        }
        .clock-center .data-grande { font-size: 1.3rem; color: rgba(255,255,255,0.65); font-weight: 300; letter-spacing: 1px; }
        .logo-img {
            height: 38px; width: auto; object-fit: contain; position: absolute; left: 24px;
            opacity: 0.4; filter: brightness(1.2); transition: opacity 0.5s ease;
        }
        .bottombar.canva-active .logo-img { opacity: 0; }
        .dolar-cotacao {
            position: absolute; right: 80px; display: flex; align-items: center; gap: 8px;
            background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 30px;
            backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
            font-size: 1.2rem; font-weight: 600; color: #4caf50; letter-spacing: 0.5px;
            transition: all 0.5s ease;
        }
        .bottombar.canva-active .dolar-cotacao { opacity: 0; pointer-events: none; }
        .dolar-cotacao i { color: #facc15; font-size: 1rem; }
        .menu-toggle {
            background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer;
            padding: 8px 10px; border-radius: 10px; transition: 0.2s; position: absolute; right: 20px;
        }
        .bottombar.canva-active .menu-toggle { display: none; }
        .menu-toggle:hover { background: rgba(255,255,255,0.08); }

        #canvaMenuBtn {
            position: fixed; top: 16px; left: 16px; z-index: 70;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
            width: 40px; height: 40px; color: #fff; font-size: 1.1rem;
            cursor: pointer; display: none; align-items: center; justify-content: center;
            transition: background 0.2s; box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        #canvaMenuBtn:hover { background: rgba(56,189,248,0.3); }

        .watermark {
            position: fixed; bottom: 55px; right: 25px; z-index: 20;
            color: rgba(255,255,255,0.55); font-size: 1.8rem; font-weight: 600;
            text-align: right; pointer-events: none; opacity: 0;
            transition: opacity 0.5s ease, bottom 0.5s ease, right 0.5s ease;
            text-shadow: 0 2px 12px rgba(0,0,0,0.7); line-height: 1;
        }
        .watermark.active { opacity: 1; bottom: 20px; right: 20px; }

        .bottombar.relogio-active .clock-center { opacity: 0; pointer-events: none; }
        .bottombar.relogio-active .dolar-cotacao {
            right: 50%; transform: translateX(50%); background: rgba(76,175,80,0.15);
            font-size: 1.6rem; padding: 10px 24px; border-color: #4caf50;
        }
        body.dolar-slide-active .dolar-cotacao {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        .slide-manager-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index:100; opacity:0; pointer-events:none; transition:0.3s; }
        .slide-manager-overlay.active { opacity:1; pointer-events:all; }
        .slide-manager-panel {
            position: fixed; top:0; right:-420px; width:380px; max-width:90vw; height:100%;
            background: rgba(15,31,46,0.95); backdrop-filter:blur(24px); z-index:110;
            transition: right 0.35s; display:flex; flex-direction:column;
            box-shadow:-4px 0 30px rgba(0,0,0,0.5); border-left:1px solid rgba(255,255,255,0.08);
            padding:24px 20px 30px; overflow-y:auto;
        }
        .slide-manager-panel.active { right:0; }
        .panel-header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:16px; margin-bottom:20px; }
        .panel-header h3 { color:#fff; font-weight:700; font-size:1.2rem; }
        .close-btn { background:none; border:none; color:#94a3b8; font-size:1.5rem; cursor:pointer; padding:4px 8px; border-radius:8px; }
        .close-btn:hover { background:rgba(255,255,255,0.08); color:#fff; }
        .filter-buttons { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
        .filter-buttons button {
            background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:var(--text-muted);
            padding:6px 14px; border-radius:30px; font-size:0.7rem; font-weight:600; cursor:pointer;
            transition:0.2s; text-transform:uppercase; letter-spacing:0.5px; display:flex; align-items:center; gap:5px;
        }
        .filter-buttons button:hover { background:rgba(255,255,255,0.1); color:#fff; }
        .filter-buttons button.active { background:var(--accent); color:#0b1a2e; border-color:var(--accent); }
        .select-all-btn { background:rgba(46,125,50,0.15)!important; border-color:#4caf50!important; color:#4caf50!important; }
        .deselect-all-btn { background:rgba(211,47,47,0.15)!important; border-color:#d32f2f!important; color:#d32f2f!important; }
        .time-offset-config, .slide-duration-config {
            display:flex; align-items:center; gap:12px; margin:12px 0 16px;
            padding:12px 16px; background:rgba(255,255,255,0.04); border-radius:var(--radius-md);
            border:1px solid rgba(255,255,255,0.06); flex-wrap:wrap;
        }
        .time-offset-config label, .slide-duration-config label { font-size:0.8rem; font-weight:600; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
        .time-offset-config input, .slide-duration-config input {
            width:80px; padding:4px 8px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
            background:rgba(0,0,0,0.3); color:#fff; font-weight:600; font-size:0.9rem; text-align:center;
        }
        .time-offset-config button, .slide-duration-config button {
            background:var(--accent); border:none; color:#0b1a2e; font-weight:700; padding:4px 14px;
            border-radius:20px; font-size:0.75rem; cursor:pointer;
        }
        .offset-status { font-size:0.7rem; color:var(--text-muted); margin-left:4px; }
        .slide-list { flex:1; overflow-y:auto; padding-right:4px; }
        .slide-item {
            display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px;
            margin-bottom:4px; transition:0.15s; border-bottom:1px solid rgba(255,255,255,0.03);
        }
        .slide-item:hover { background:rgba(255,255,255,0.04); }
        .slide-item input[type="checkbox"] { width:18px; height:18px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
        .slide-label { flex:1; color:var(--text-light); font-size:0.85rem; font-weight:500; }
        .slide-category { font-size:0.6rem; background:rgba(255,255,255,0.06); padding:2px 10px; border-radius:30px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px; }
        .slide-category.geral { color:#38bdf8; border:1px solid rgba(56,189,248,0.15); }
        .slide-category.novidades { color:#f59e0b; border:1px solid rgba(245,158,11,0.15); }

        .main-grid {
            flex:1; display:flex; gap:16px; padding:16px; min-height:0; z-index:1;
            order:1; position:relative; overflow:hidden; transition: gap 0.4s;
        }
        .slides-zone {
            flex:1; min-width:0; position:relative; border-radius:var(--radius-xl);
            overflow:hidden; background:transparent; border:1px solid rgba(255,255,255,0.06);
            aspect-ratio:16/9; max-height:100%; min-height:300px; width:100%;
            box-shadow:var(--shadow-card); transition: flex 0.4s;
        }
        .sidebar-right {
            flex:0 0 370px; display:flex; flex-direction:column; gap:16px; min-height:0;
            transition: flex 0.4s, opacity 0.4s, transform 0.4s; overflow:hidden;
            transform:scaleX(1); transform-origin:right center; opacity:1;
        }
        .main-grid.sidebar-hidden .sidebar-right { flex:0 0 0; opacity:0; transform:scaleX(0); margin:0; padding:0; gap:0; overflow:hidden; }
        .video-box { flex:1; border-radius:var(--radius-lg); overflow:hidden; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); min-height:200px; box-shadow:var(--shadow-card); border:1px solid rgba(255,255,255,0.06); transition: background 0.9s ease, border-color 0.9s ease; }
        .video-box iframe { width:100%; height:100%; border:none; }
        .radio-embed { background:rgba(0,0,0,0.4); backdrop-filter:blur(4px); border-radius:var(--radius-md); overflow:hidden; flex-shrink:0; height:75px; border:1px solid rgba(255,255,255,0.06); transition: background 0.9s ease, border-color 0.9s ease; }
        .radio-embed iframe { width:100%; height:100%; border:none; }

        body.dark-mode .slides-zone {
            border-color: rgba(255,255,255,0.04);
            box-shadow: 0 2px 20px rgba(0,0,0,0.55);
        }
        body.dark-mode .video-box {
            background: rgba(0,0,0,0.82);
            border-color: rgba(255,255,255,0.05);
        }
        body.dark-mode .radio-embed {
            background: rgba(0,0,0,0.7);
            border-color: rgba(255,255,255,0.05);
        }
        body.dark-mode .sidebar-top-toggle,
        body.dark-mode #radioFloatingBtn,
        body.dark-mode #canvaMenuBtn {
            background: rgba(0,0,0,0.55);
            border-color: rgba(255,255,255,0.08);
        }
        body.dark-mode .slide-manager-panel {
            background: rgba(8,12,18,0.97);
            border-left-color: rgba(255,255,255,0.05);
        }
        body.dark-mode .dolar-cotacao {
            background: rgba(0,0,0,0.45);
            border-color: rgba(255,255,255,0.08);
        }
        body.dark-mode .slide::before {
            background: linear-gradient(135deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.25) 50%, rgba(0,0,0,0.4) 100%);
        }

        /* Remover o pseudo-elemento com gradiente azul no slide de clima */
        .slide.weather-active::before {
            display: none !important;
        }
        /* Garantir que o fundo do slide de clima seja preto por padrão */
        .slide[data-type="previsao_tempo"] {
            background-color: #000;
        }
        .slide.weather-active {
            background-color: #000 !important;
        }
        .slide.weather-active .weather-slide {
            background-color: inherit;
        }

        .slide[data-type="dolar"]::before,
        .slide[data-type="noticias_rss"]::before {
            display: none !important;
        }
        .dolar-slide {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px 28px;
            background: #050505;
            position: relative;
            overflow: hidden;
        }
        .dolar-slide .dolar-header {
            position: absolute;
            top: 28px;
            left: 32px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 20px 10px 16px;
            border-radius: 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.35);
        }
        .dolar-slide .dolar-header i {
            font-size: 1.35rem;
            color: #fff;
        }
        .dolar-slide .dolar-header span {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .dolar-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 24px;
            max-width: 1500px;
            padding-top: 36px;
        }
        .dolar-grafico-wrapper {
            flex: 2.6;
            height: 88%;
            min-width: 0;
            position: relative;
        }
        .dolar-grafico-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .dolar-valor-wrapper {
            flex: 0 0 280px;
            min-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 8px;
        }
        .dolar-rotulo {
            font-size: 2.1rem;
            font-weight: 600;
            color: rgba(255,255,255,0.55);
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .dolar-valor-grande {
            font-size: 8.5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: none;
            line-height: 0.95;
            letter-spacing: -4px;
            font-variant-numeric: tabular-nums;
        }
        .dolar-variacao {
            font-size: 1.85rem;
            font-weight: 700;
            margin-top: 6px;
            padding: 6px 22px;
            border-radius: 40px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
        }
        .dolar-variacao.positiva { color: #18f221; }
        .dolar-variacao.negativa { color: #cb1515; }
        .dolar-atualizacao {
            font-size: 1rem;
            color: rgba(255,255,255,0.35);
            margin-top: 12px;
        }

        .slide { position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; transition: opacity 0.8s, transform 0.8s; transform:scale(0.98); display:flex; align-items:center; justify-content:center; text-align:center; will-change: transform, opacity; pointer-events:none; border-radius:var(--radius-xl); overflow:hidden; }
        .slide::before { content:''; position:absolute; inset:0; z-index:0; background: linear-gradient(135deg, rgba(10,60,40,0.25) 0%, rgba(11,45,70,0.25) 50%, rgba(10,70,50,0.25) 100%); background-size: 300% 300%; animation: slideGradientShift 12s ease-in-out infinite alternate; pointer-events:none; border-radius:var(--radius-xl); }
        @keyframes slideGradientShift { 0%{background-position:0% 50%;} 100%{background-position:100% 50%;} }
        .slide>* { position:relative; z-index:1; }
        .slide.active { opacity:1; transform:scale(1); z-index:2; pointer-events:auto; }
        .slide-transition-fade.active { animation: slideFadeIn 0.9s ease forwards; }
        .slide-transition-zoom.active { animation: slideZoomIn 0.9s ease forwards; }
        .slide-transition-flip.active { animation: slideFlipIn 0.9s ease forwards; }
        .slide-transition-cube.active { animation: slideCubeIn 0.9s ease forwards; }
        .slide-transition-coverflow.active { animation: slideCoverflowIn 0.9s ease forwards; }
        .slide-transition-slide.active { animation: slideSlideIn 0.9s ease forwards; }
        .slide-transition-parallax.active { animation: slideParallaxIn 0.9s ease forwards; }
        @keyframes slideFadeIn { 0%{opacity:0;}100%{opacity:1;} }
        @keyframes slideZoomIn { 0%{opacity:0;transform:scale(0.8);}100%{opacity:1;transform:scale(1);} }
        @keyframes slideFlipIn { 0%{opacity:0;transform:rotateY(90deg);}100%{opacity:1;transform:rotateY(0);} }
        @keyframes slideCubeIn { 0%{opacity:0;transform:translateZ(-300px) rotateY(30deg);}100%{opacity:1;transform:translateZ(0) rotateY(0);} }
        @keyframes slideCoverflowIn { 0%{opacity:0;transform:translateX(60%) scale(0.8) rotateY(-20deg);}100%{opacity:1;transform:translateX(0) scale(1) rotateY(0);} }
        @keyframes slideSlideIn { 0%{opacity:0;transform:translateX(100%);}100%{opacity:1;transform:translateX(0);} }
        @keyframes slideParallaxIn { 0%{opacity:0;transform:translateY(60px) scale(0.95);}100%{opacity:1;transform:translateY(0) scale(1);} }

        .relogio-slide { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
        .relogio-content { padding: 50px 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 40%; }
        .relogio-slide .hora-grande { font-size:17rem; font-weight:700; color:#fff; letter-spacing:4px; line-height:1; }
        .relogio-slide .data-grande { font-size:2.6rem; color:rgba(255,255,255,0.95); margin-top:12px; font-weight:300; letter-spacing:2px; }
        .relogio-slide .clima-grande { font-size:2rem; color:rgba(255,255,255,0.95); margin-top:16px; display:flex; align-items:center; gap:16px; background:rgba(0,0,0,0.3); padding:8px 24px; border-radius:40px; backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.08); }
        .logo-slide { display:flex; align-items:center; justify-content:center; height:100%; width:100%; padding:20px; }
        .logo-slide img { max-height:55%; max-width:75%; object-fit:contain; animation:logoZoom 4s ease-in-out infinite; filter:drop-shadow(0 0 40px rgba(0,0,0,0.5)); }
        @keyframes logoZoom { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }

        .birthday-hero-slide { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
        .bg-blur { position:absolute; top:0;left:0;width:100%;height:100%; object-fit:cover; opacity:0.12; filter:blur(8px); z-index:0; }
        .hero-content { position:relative; z-index:1; text-align:center; padding:45px 65px; background:rgba(0,0,0,0.45); backdrop-filter:blur(18px); border-radius:var(--radius-xl); border:1px solid rgba(255,215,0,0.25); box-shadow:0 0 80px rgba(255,215,0,0.12); max-width:90%; }
        .hero-avatar { width:120px; height:120px; border-radius:50%; background:linear-gradient(135deg,#ffd700,#f59e0b); display:flex; align-items:center; justify-content:center; font-size:4rem; color:#fff; margin:0 auto 16px; box-shadow:0 0 50px rgba(255,215,0,0.35); }

            function shuffleArray(arr) {
                const a = Array.isArray(arr) ? [...arr] : [];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function getHoraSincronizada() {
                if (horaExataDefinida) {
                    const fixadoEm = localStorage.getItem('exactTimeFixadoEm');
                    if (fixadoEm) {
                        const inicio = new Date(parseInt(fixadoEm));
                        const diff = Date.now() - inicio.getTime();
                        return new Date(horaExataDefinida.getTime() + diff);
                    }
                    return new Date(horaExataDefinida.getTime());
                }
                if (manualOffsetHours !== 0) {
                    return new Date(Date.now() + manualOffsetHours * 3600000);
                }
                return new Date();
            }

                const elIcon = document.getElementById('slide-clima-icon');

                    const code = currentWeatherData.current_weather?.weathercode || 0;
                    if (code <= 3) elIcon.className = 'fas fa-sun';
                    else if (code <= 48) elIcon.className = 'fas fa-cloud';
                    else if (code <= 67) elIcon.className = 'fas fa-cloud-rain';
                    else elIcon.className = 'fas fa-bolt';
                }
            }

            // ===== CLIMA =====
            async function buscarClima() {
                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}&current_weather=true&hourly=temperature_2m,weathercode&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=America/Sao_Paulo&forecast_days=5`;
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.current_weather) {
                        currentWeatherData = data;
                        const slideWeather = document.querySelector('.slide[data-type="previsao_tempo"]');
                        if (slideWeather) {
                            const ws = buildWeatherSlide(data);
                            if (ws) slideWeather.innerHTML = ws;
                        }
                        atualizarTodosRelogios();
                    }
                } catch (e) { console.error('Erro clima:', e); }
            }
            buscarClima();
            setInterval(buscarClima, 900000);

            function atualizarBarraDolar(num) {
                if (num == null || isNaN(num) || num <= 0) return;
                const el = document.getElementById('dolarValor');
                if (el) el.textContent = `R$ ${num.toFixed(2).replace('.', ',')}`;
                localStorage.setItem('dolarCache', JSON.stringify({
                    valor: num.toFixed(2).replace('.', ','),
                    timestamp: Date.now()
                }));
            }

            async function buscarCotacaoDolar() {
                try {
                    if (typeof obterDadosDolarCompletos === 'function') {
                        const dados = await obterDadosDolarCompletos();
                        if (dados && dados.cotacao > 0) {
                            dolarAtual = dados.cotacao;
                            dolarVariacao = dados.variacao || 0;
                            atualizarBarraDolar(dados.cotacao);
                            return;
                        }
                    }
                    const response = await fetch(BASES.dolar);
                    const dados = await response.json();
                    if (dados && dados.length > 0) {
                        const r = dados[0];
                        let valor = r['valor'] || r['Valor'] || r['cotacao'] || r['Cotacao'] || r['DOLAR'] || r['dolar'];

                if (code <= 67) return 'fa-cloud-rain';
                if (code <= 77) return 'fa-snowflake';

            }
            function getWeatherDesc(code) {
                if (code <= 1) return 'Céu limpo';
                if (code <= 3) return 'Parcialmente nublado';

            function getWeatherBackground(code, now) {
                const hour = now.getHours();
                const isDay = hour >= 6 && hour < 18;
                const isSunset = hour >= 17 && hour < 19;

                let category = 'cloudy';
                if (code === 0) {
                    if (isSunset) category = 'clear_sunset';
                    else if (isDay) category = 'clear_day';
                    else category = 'clear_night';
                } else if (code >= 1 && code <= 3) {
                    if (isDay) category = 'partly_day';
                    else category = 'partly_night';
                } else if (code >= 4 && code <= 48) {
                    category = 'cloudy';
                } else if (code >= 51 && code <= 67) {
                    category = 'rainy';
                } else if (code >= 71 && code <= 77) {
                    category = 'snowy';
                } else if (code >= 80) {
                    category = 'storm';
                }

                const images = WEATHER_BACKGROUNDS[category] || WEATHER_BACKGROUNDS.cloudy;
                let selected = null;
                if (images.length === 1) {
                    selected = images[0];
                } else {
                    const available = images.filter(img => img !== lastWeatherBg);
                    if (available.length === 0) {
                        selected = images[0];
                    } else {
                        selected = available[Math.floor(Math.random() * available.length)];
                    }
                }
                lastWeatherBg = selected;
                return selected;

            // ================== NOTÍCIAS RSS ==================
            function limparTextoHtml(html) {
                if (!html) return '';
                return String(html)
                    .replace(/<[^>]+>/g, ' ')
                    .replace(/&nbsp;|&amp;|&quot;|&#39;|&lt;|&gt;/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim()
                    .toLowerCase();
            }

            function isBlacklisted(texto) {
                if (!texto) return false;
                const t = texto.toLowerCase();
                return NEWS_BLACKLIST.some(b => t.includes(b));
            }

            function pontuarNoticia(item, isTecMundo) {
                const titulo = (item.title || '').toLowerCase();
                const desc = limparTextoHtml(item.description || item.content || '');
                const cats = Array.isArray(item.categories)
                    ? item.categories.join(' ').toLowerCase()
                    : String(item.categories || '').toLowerCase();
                const textoFull = `${titulo} ${titulo} ${desc} ${cats}`;

                if (isBlacklisted(textoFull)) {
                    return { score: -100, categoria: 'bloqueada', matches: [] };
                }

                let score = 0;
                const matches = [];
                let bestCat = 'geral';
                let bestWeight = 0;

                for (const [catName, cat] of Object.entries(NEWS_CATEGORIES)) {
                    let hits = 0;
                    for (const word of cat.words) {
                        const w = word.toLowerCase().trim();
                        if (w.length < 2) continue;
                        if (textoFull.includes(w)) {
                            hits++;
                            matches.push(w);
                        }
                    }
                    if (hits > 0) {
                        const catScore = hits * cat.weight;
                        score += catScore;
                        if (cat.weight > bestWeight) {
                            bestWeight = cat.weight;
                            bestCat = catName;
                        }
                    }
                }

                if (matches.length === 0) {
                    return { score: 0, categoria: 'geral', matches: [], ageHours: 9999 };
                }

                if (isTecMundo) {
                    score += 2;
                    if (bestCat === 'geral') bestCat = 'tecnologia_ia';
                }

                let ageHours = 9999;
                if (item.pubDate) {
                    const ts = new Date(item.pubDate).getTime();
                    if (!isNaN(ts)) {
                        ageHours = (Date.now() - ts) / 3600000;
                        if (ageHours < 0) ageHours = 0;
                        if (ageHours < 1) score += 8;
                        else if (ageHours < 3) score += 6;
                        else if (ageHours < 6) score += 4;
                        else if (ageHours < 12) score += 3;
                        else if (ageHours < 24) score += 2;
                        else if (ageHours < 48) score += 0.5;
                        else if (ageHours > 72) score -= 3;
                        else if (ageHours > 48) score -= 1;
                    }
                }

                const uniqueCats = new Set();
                for (const [catName, cat] of Object.entries(NEWS_CATEGORIES)) {
                    if (cat.words.some(w => textoFull.includes(w.toLowerCase().trim()))) {
                        uniqueCats.add(catName);
                    }
                }
                if (uniqueCats.size >= 2) score += 2;
                if (uniqueCats.size >= 3) score += 2;

                return { score, categoria: bestCat, matches: [...new Set(matches)].slice(0, 8), ageHours };
            }

            function isImagemInvalida(src) {
                if (!src || typeof src !== 'string') return true;
                const s = src.toLowerCase();
                if (s.includes('g1.png') || s.includes('/144x0/') || s.includes('pox/g1')) return true;
                if (s.includes('logo') || s.includes('icon') || s.includes('favicon')) return true;
                if (s.includes('placeholder') || s.includes('default-image')) return true;
                if (/\/\d{1,3}x\d{1,3}\//.test(s) && !/\/\d{3,}x\d{3,}\//.test(s)) return true;
                return false;
            }

            function extrairImagemRss(item) {
                let candidatas = [];

                if (item.thumbnail && !isImagemInvalida(item.thumbnail)) {
                    candidatas.push(item.thumbnail);
                }
                if (item.enclosure && item.enclosure.link) {
                    const link = item.enclosure.link;
                    const type = (item.enclosure.type || '').toLowerCase();
                    if ((type.includes('image') || /\.(jpe?g|png|webp|gif)(\?|$)/i.test(link)) && !isImagemInvalida(link)) {
                        candidatas.push(link);
                    }
                }

                const htmls = [item.content, item.description].filter(Boolean);
                for (const html of htmls) {
                    const matches = [...String(html).matchAll(/<img[^>]+src=["']([^"']+)["'][^>]*>/gi)];
                    for (const m of matches) {
                        let src = m[1];
                        if (src.startsWith('//')) src = 'https:' + src;
                        if (src.startsWith('http') && !isImagemInvalida(src)) {
                            candidatas.push(src);
                        }
                    }
                }

                const preferidas = candidatas.filter(u =>
                    /s2-g1\.glbimg|i\.s3\.glbimg|tecmundo|uol|estadao|folha|reuters|apnews|nytimes|cnn|bbc/i.test(u) ||
                    /\/\d{3,}x\d{3,}\//.test(u) ||
                    /\.(jpe?g|png|webp)(\?|$)/i.test(u)
                );
                if (preferidas.length) return preferidas[0];
                if (candidatas.length) return candidatas[0];

                return 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1600&q=80';
            }

            function diversificarNoticias(lista) {
                if (lista.length <= 3) return lista;
                const porCat = {};
                lista.forEach(n => {
                    const c = n.categoria || 'geral';
                    if (!porCat[c]) porCat[c] = [];
                    porCat[c].push(n);
                });
                const cats = Object.keys(porCat).sort((a, b) => porCat[b].length - porCat[a].length);
                const resultado = [];
                let houve = true;
                while (houve && resultado.length < lista.length) {
                    houve = false;
                    for (const c of cats) {
                        if (porCat[c] && porCat[c].length) {
                            if (resultado.length && resultado[resultado.length - 1].categoria === c && cats.length > 1) {
                                continue;
                            }
                            resultado.push(porCat[c].shift());
                            houve = true;
                        }
                    }
                    if (!houve) {
                        for (const c of cats) {
                            if (porCat[c] && porCat[c].length) {
                                resultado.push(porCat[c].shift());
                                houve = true;
                                break;
                            }
                        }
                    }
                }
                return resultado;
            }

            function nomeFonteDoFeed(url) {
                const u = (url || '').toLowerCase();
                if (u.includes('g1.globo')) return 'G1';
                if (u.includes('uol.com')) return 'UOL';
                if (u.includes('valor.globo')) return 'Valor';
                if (u.includes('exame.com')) return 'Exame';
                if (u.includes('infomoney')) return 'InfoMoney';
                if (u.includes('tecmundo')) return 'TecMundo';
                if (u.includes('bbc')) return 'BBC';
                if (u.includes('reuters')) return 'Reuters';
                if (u.includes('estadao')) return 'Estadão';
                if (u.includes('folha')) return 'Folha';
                if (u.includes('cnnbrasil')) return 'CNN Brasil';
                if (u.includes('jovempan')) return 'Jovem Pan';
                if (u.includes('moneytimes')) return 'Money Times';
                if (u.includes('sunoresearch') || u.includes('suno')) return 'Suno';
                if (u.includes('canaltech')) return 'Canaltech';
                if (u.includes('olhardigital')) return 'Olhar Digital';
                return 'Notícias';
            }

            async function buscarNoticiasRss() {
                let todas = [];
                const urlsEmbaralhadas = shuffleArray(CONFIG.noticiasRssUrls);
                const qtdFeeds = Math.min(urlsEmbaralhadas.length, Math.max(8, Math.floor(8 + Math.random() * 6)));
                const urlsParaBuscar = urlsEmbaralhadas.slice(0, qtdFeeds);

                for (const url of urlsParaBuscar) {
                    try {
                        const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
                        const resposta = await fetch(proxyUrl);
                        const json = await resposta.json();
                        if (json.status === 'ok' && json.items && json.items.length) {
                            const isTec = url.includes('tecmundo');
                            const fonteFeed = nomeFonteDoFeed(url);
                            const items = json.items.map(item => {
                                const title = item.title || 'Sem título';
                                const fonte = fonteFeed;
                                const pubDate = item.pubDate || item.published || '';
                                const imagem = extrairImagemRss(item);
                                const { score, categoria, matches, ageHours } = pontuarNoticia(item, isTec);
                                return { title, link: item.link || '#', pubDate, fonte, imagem, score, categoria, matches, ageHours: ageHours ?? 9999, description: item.description || '' };
                            });
                            todas = todas.concat(items);
                        }
                    } catch (e) { console.warn('Erro ao buscar RSS de', url, e); }
                }

                const vistos = new Set();
                let unicas = todas.filter(item => {
                    const chave = item.title.toLowerCase().trim();
                    if (vistos.has(chave)) return false;
                    vistos.add(chave);
                    return true;
                });

                const minScore = CONFIG.noticiasMinScore || 3;
                unicas = unicas.filter(n =>
                    n.score >= minScore &&
                    Array.isArray(n.matches) &&
                    n.matches.length > 0 &&
                    n.categoria !== 'bloqueada' &&
                    n.categoria !== 'geral' &&
                    (n.ageHours <= 72 || n.score >= 12)
                );

                unicas.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return (a.ageHours || 9999) - (b.ageHours || 9999);
                });

                const maxItems = CONFIG.noticiasMaxItems || 35;
                let lista = diversificarNoticias(unicas).slice(0, maxItems);

                if (lista.length < 4) {
                    const fallback = todas
                        .filter(n => n.score > 0 && n.matches && n.matches.length > 0 && (n.ageHours <= 72 || n.score >= 10))
                        .sort((a, b) => {
                            if (b.score !== a.score) return b.score - a.score;
                            return (a.ageHours || 9999) - (b.ageHours || 9999);
                        })
                        .slice(0, 15);
                    const vistos2 = new Set(lista.map(n => n.title.toLowerCase()));
                    fallback.forEach(n => {
                        const k = n.title.toLowerCase();
                        if (!vistos2.has(k)) {
                            vistos2.add(k);
                            lista.push(n);
                        }
                    });
                    lista = diversificarNoticias(lista).slice(0, maxItems);
                }

                const corte = Math.max(4, Math.ceil(lista.length * 0.6));
                const topo = shuffleArray(lista.slice(0, corte));
                const resto = lista.slice(corte);
                noticiasRss = topo.concat(resto);
                lastNewsFetch = Date.now();

                const slideAtivo = document.querySelector('.slide.active[data-type="noticias_rss"]');
                if (slideAtivo && noticiasRss.length) {
                    const start = Math.floor(Math.random() * Math.min(4, noticiasRss.length));
                    atualizarNoticiaCarrossel(start);
                }
            }

            function atualizarNoticiaCarrossel(index) {

                    const t = document.getElementById('rssTitle');

            // ========== CAMPANHA ==========
            function parseDataBR(str) {
                if (!str) return null;
                const p = str.split(/[/-]/);
                if (p.length < 3) return null;
                return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]), 23, 59, 59);
            }
            function parseDataInicioBR(str) {
                if (!str) return null;
                const p = str.split(/[/-]/);
                if (p.length < 3) return null;
                return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]), 0, 0, 0);
            }
            function parseValorBR(str) {
                if (!str || str === '') return 0;
                const s = String(str).replace(/[R$\s]/g, '').replace(/\./g, '').replace(',', '.');
                const n = parseFloat(s);
                return isNaN(n) ? 0 : n;
            }

            function processarCampanha() {
                if (!campanhasData || !campanhasData.length) return null;
                const campanhaNome = campanhasData[0].campanha || 'Campanha';
                const dataInicio = parseDataInicioBR(campanhasData[0].data_inicio);
                const dataFim = parseDataBR(campanhasData[0].data_fim);
                if (!dataInicio || !dataFim) return null;

                let atingiram = 0;
                campanhasData.forEach(v => {
                    const meta = parseValorBR(v.meta_valor);
                    const realizado = parseValorBR(v.realizado_valor);
                    if (meta > 0 && realizado >= meta) atingiram++;
                });

                const totalDias = Math.max(1, Math.floor((dataFim - dataInicio) / (1000 * 60 * 60 * 24)));

                return {
                    nome: campanhaNome,
                    dataInicio,
                    dataFim,
                    atingiram,
                    totalVendedores: campanhasData.length,
                    totalDias
                };
            }

            function animarRingCountdown(valorFinal, totalDias, duracaoTotal = 2800) {
                const el = document.getElementById('ringNumber');
                const circle = document.getElementById('ringCircle');
                const percentEl = document.getElementById('ringPercent');
                if (!el || !circle || ringAnimRunning) return;
                ringAnimRunning = true;

                const inicio = 31;
                const totalSteps = Math.max(1, inicio - valorFinal);
                const stepTime = Math.max(40, Math.floor(duracaoTotal / totalSteps));
                const circumference = 2 * Math.PI * 130;

                let atual = inicio;
                el.textContent = atual;
                circle.style.strokeDasharray = circumference;
                circle.style.strokeDashoffset = circumference;

                const timer = setInterval(() => {
                    atual--;
                    if (atual < valorFinal) {
                        clearInterval(timer);
                        el.textContent = valorFinal;
                        const percFinal = Math.min(100, Math.round(((totalDias - valorFinal) / totalDias) * 100));
                        const offsetFinal = circumference - (percFinal / 100) * circumference;
                        circle.style.strokeDashoffset = offsetFinal;
                        if (percentEl) percentEl.innerHTML = `${percFinal}% <span>do período concluído</span>`;
                        ringAnimRunning = false;
                        return;
                    }
                    el.textContent = atual;
                    const percAtual = Math.min(100, Math.round(((totalDias - atual) / totalDias) * 100));
                    const offsetAtual = circumference - (percAtual / 100) * circumference;
                    circle.style.strokeDashoffset = offsetAtual;
                    if (percentEl) percentEl.innerHTML = `${percAtual}% <span>do período concluído</span>`;
                }, stepTime);
            }

            function atualizarContadorTempo(info) {

                const dias = Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
                const horas = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutos = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

                function setVal(id, val) {
                    const el = document.getElementById(id);

                    const novo = String(val).padStart(2, '0');

                        setTimeout(() => el.classList.remove('updating'), 280);

                setVal('tc-dias', dias);
                setVal('tc-horas', horas);
                setVal('tc-minutos', minutos);

            function formatarLabelDataBR(dataStr) {
                if (!dataStr) return '';
                const p = String(dataStr).split(/[/-]/);
                if (p.length < 2) return dataStr;
                const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
                const dia = p[0].padStart(2, '0');
                const mesIdx = parseInt(p[1], 10) - 1;
                const mes = meses[mesIdx] || p[1];
                return `${dia} ${mes}`;
            }

            async function buscarDolarDoSheet() {
                try {
                    const resp = await fetch(BASES.dolar);
                    const data = await resp.json();
                    if (!Array.isArray(data) || !data.length) return null;

                    const pontos = data.map(row => {
                        const dataRaw = row.Data || row.data || row.DATA || '';
                        const valorRaw = row.valor || row.Valor || row.VALOR || row.cotacao || row.Cotacao;
                        const valor = parseValorBR(valorRaw);
                        return { dataRaw, label: formatarLabelDataBR(dataRaw), valor };
                    }).filter(p => p.valor > 0);

                    if (!pontos.length) return null;

                    const crono = [...pontos].reverse();
                    const slice = crono.slice(-35);
                    const labels = slice.map(p => p.label);
                    const valores = slice.map(p => p.valor);

                    const ultimo = pontos[0];
                    const penultimo = pontos[1];
                    let variacao = 0;
                    if (penultimo && penultimo.valor > 0) {
                        variacao = ((ultimo.valor - penultimo.valor) / penultimo.valor) * 100;
                    }

                    return {
                        labels,
                        valores,
                        cotacao: ultimo.valor,
                        variacao,
                        fonte: 'planilha'
                    };
                } catch (e) {
                    console.warn('Erro ao buscar dólar no OpenSheet:', e);
                    return null;
                }
            }

            async function buscarDolarAtual() {
                try {
                    const resp = await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL');
                    const data = await resp.json();
                    if (data && data.USDBRL) {
                        const cotacao = parseFloat(data.USDBRL.bid);
                        const variacao = parseFloat(data.USDBRL.pctChange);
                        if (!isNaN(cotacao) && cotacao > 0) {
                            dolarAtual = cotacao;
                            dolarVariacao = isNaN(variacao) ? 0 : variacao;
                            return { cotacao, variacao: dolarVariacao };
                        }
                    }
                } catch (e) {
                    console.warn('Erro ao buscar cotação do dólar (API):', e);
                }
                return null;
            }

            async function buscarDolarHistorico(dias = 30) {
                try {
                    const resp = await fetch(`https://economia.awesomeapi.com.br/json/daily/USD-BRL/${dias}`);
                    const data = await resp.json();
                    if (Array.isArray(data) && data.length) {
                        const valores = data.map(item => parseFloat(item.bid)).reverse();
                        const labels = data.map(item => {
                            const d = new Date(parseInt(item.timestamp) * 1000);
                            return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
                        }).reverse();
                        return { labels, valores, fonte: 'api' };
                    }
                } catch (e) {
                    console.warn('Erro ao buscar histórico do dólar (API):', e);
                }
                return null;
            }

            async function obterDadosDolarCompletos() {
                const [atualApi, histApi] = await Promise.all([
                    buscarDolarAtual(),
                    buscarDolarHistorico(30)
                ]);

                if (histApi && histApi.labels && histApi.labels.length >= 2) {
                    let cotacao = atualApi ? atualApi.cotacao : histApi.valores[histApi.valores.length - 1];
                    let variacao = atualApi ? atualApi.variacao : 0;
                    if (!atualApi && histApi.valores.length >= 2) {
                        const u = histApi.valores[histApi.valores.length - 1];
                        const p = histApi.valores[histApi.valores.length - 2];
                        if (p > 0) variacao = ((u - p) / p) * 100;
                    }
                    if (!cotacao) cotacao = histApi.valores[histApi.valores.length - 1];
                    return {
                        labels: histApi.labels,
                        valores: histApi.valores,
                        cotacao,
                        variacao,
                        fonte: 'api'
                    };
                }

                const sheet = await buscarDolarDoSheet();
                if (sheet) return sheet;

                const cache = localStorage.getItem('dolarCache');
                if (cache) {
                    try {
                        const p = JSON.parse(cache);
                        const num = parseValorBR(p.valor);
                        if (num > 0) {
                            return {
                                labels: ['Hoje'],
                                valores: [num],
                                cotacao: num,
                                variacao: 0,
                                fonte: 'cache'
                            };
                        }
                    } catch (_) {}
                }
                return null;
            }

            function renderizarGraficoDolar(dados, valorAtual, variacao) {

                pararAnimacaoDolar();

                if (chartDolar) {

                atualizarMetaDolarUI(valorAtual, variacao);

                const temDados = dados && Array.isArray(dados.labels) && Array.isArray(dados.valores) && dados.valores.length >= 2;
                const labelsFull = temDados ? dados.labels : ['--'];
                const valoresFull = temDados ? dados.valores : [valorAtual || 0];
                const valorFinal = (valorAtual != null && !isNaN(valorAtual)) ? valorAtual : (valoresFull[valoresFull.length - 1] || 0);
                const valorInicial = valoresFull[0] || valorFinal * 0.95;

                setTextoDolar(valorInicial);

                const h = canvas.clientHeight || 280;
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, 'rgba(255,255,255,0.22)');
                grad.addColorStop(1, 'rgba(255,255,255,0.01)');

                chartDolar = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'USD/BRL',
                            data: [],
                            borderColor: '#ffffff',
                            backgroundColor: grad,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 2.2,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: '#ffffff',
                            borderWidth: 3.5,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: {
                            duration: 280,
                            easing: 'easeOutQuad'
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return `R$ ${context.parsed.y.toFixed(2)}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255,255,255,0.08)', drawBorder: false },
                                ticks: { color: 'rgba(255,255,255,0.45)', maxTicksLimit: 8, maxRotation: 0 }
                            },
                            y: {
                                grid: { color: 'rgba(255,255,255,0.08)', drawBorder: false },
                                ticks: {
                                    color: 'rgba(255,255,255,0.45)',
                                    callback: function(value) { return 'R$ ' + Number(value).toFixed(2); }
                                }
                            }
                        }
                    }
                });

                const n = valoresFull.length;
                const stepMs = Math.max(45, Math.min(120, Math.floor(2200 / Math.max(1, n))));
                let i = 0;

                dolarDrawTimer = setInterval(() => {
                    if (!dolarSlideActive || !chartDolar) {
                        pararAnimacaoDolar();
                        return;
                    }
                    if (i >= n) {
                        clearInterval(dolarDrawTimer);
                        dolarDrawTimer = null;
                        setTextoDolar(valorFinal, true);
                        return;
                    }

                    chartDolar.data.labels.push(labelsFull[i]);
                    chartDolar.data.datasets[0].data.push(valoresFull[i]);
                    chartDolar.update();

                    const progresso = (i + 1) / n;
                    const valorPonto = valoresFull[i];
                    const valorMostrado = valorPonto + (valorFinal - valorPonto) * Math.pow(progresso, 1.5) * 0.15;
                    setTextoDolar(i === n - 1 ? valorFinal : valorMostrado);

                    i++;
                }, stepMs);
            }
