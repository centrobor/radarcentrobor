                }

                allSlides.forEach(s => { if (slideVisibility[s.type] === undefined) slideVisibility[s.type] = true; });
                salvarVisibilidade();

                try {
                    Store.set('radarSlidesInfo', allSlides.map(s => ({
                        type: s.type,
                        label: s.customLabel || (s.type === 'relogio' ? 'Relógio' : s.type === 'logo' ? 'Logo' : s.type)
                    })));
                } catch(e) {}
            }

            function rebuildSlides() {
                visibleSlides = allSlides.filter(s => slideVisibility[s.type] !== false);
                if (!visibleSlides.length) visibleSlides = allSlides;
                const zone = document.getElementById('slides-zone');
                zone.querySelectorAll('.slide').forEach(el => el.remove());
                visibleSlides.forEach((s, i) => {
                    const div = document.createElement('div');
                    div.className = `slide ${i === 0 ? 'active' : ''}`;
                    div.dataset.index = i;
                    div.dataset.type = s.type;
                    div.innerHTML = s.html;
                    zone.appendChild(div);
                });
                document.getElementById('indicators').innerHTML = visibleSlides.map((_, i) =>
                    `<div class="dot-indicator${i === 0 ? ' active' : ''}" data-index="${i}"></div>`).join('');
                document.querySelectorAll('.dot-indicator').forEach(d => d.addEventListener('click', function() {
                    irParaSlide(parseInt(this.dataset.index, 10));
                    resetarTimer();
                }));
                if (currentSlideIndex >= visibleSlides.length) currentSlideIndex = 0;
                irParaSlide(currentSlideIndex);
                resetarTimer();
                renderSecondSlidePane();
            }

            function renderSecondSlidePane() {
                const pane = document.getElementById('secondSlidePane');
                if (!pane) return;
                if (radarLayoutMode !== 'two-slides') {
                    pane.innerHTML = '';
                    return;
                }
                if (!radarSecondSlideType) {
                    pane.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:0.9rem;"><i class="fas fa-info-circle" style="margin-right:8px;"></i> Selecione um slide no painel de controle</div>';
                    return;
                }
                const s = allSlides.find(x => x.type === radarSecondSlideType);
                if (!s) {
                    pane.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:0.9rem;">Slide indisponível</div>';
                    return;
                }
                let html = s.html.replace(/id="([^"]+)"/g, 'data-clone-id="$1"');
                pane.innerHTML = html;

                const wrapper = document.createElement('div');
                wrapper.style.position = 'relative';
                wrapper.style.width = '100%';
                wrapper.style.height = '100%';
                wrapper.style.display = 'flex';
                wrapper.style.alignItems = 'center';
                wrapper.style.justifyContent = 'center';
                wrapper.style.overflow = 'hidden';
                wrapper.innerHTML = pane.innerHTML;
                pane.innerHTML = '';
                pane.appendChild(wrapper);

                const inner = wrapper.firstElementChild;
                if (inner) {
                    inner.style.position = 'relative';
                    inner.style.width = '100%';
                    inner.style.height = '100%';
                    inner.style.borderRadius = '0';
                }
            }

            let lastPosKey = '';
            function repositionPlayers(force) {
                const single = document.getElementById('single-player');
                const second = document.getElementById('second-player');
                const titleBar = document.getElementById('video-title-bar');
                if (!single || !second) return;

                const s = visibleSlides[currentSlideIndex];
                const isVideoSlide = s?.type === 'video' && radarLayoutMode === 'slide-video';

                let rect, radius, visible, titleH = 0;

                if (isVideoSlide) {
                    const zone = document.getElementById('slides-zone');
                    if (!zone) return;
                    rect = zone.getBoundingClientRect();
                    radius = '28px';
                    visible = true;
                    titleH = 64;
                } else if (radarLayoutMode === 'two-videos') {
                    const box = document.getElementById('video-box');
                    if (box && !sidebarHidden) {
                        rect = box.getBoundingClientRect();
                        radius = '20px';
                        visible = rect.width > 0 && rect.height > 0;
                    } else {
                        visible = false;
                    }
                } else if (!sidebarHidden) {
                    const box = document.getElementById('video-box');
                    if (!box) return;
                    rect = box.getBoundingClientRect();
                    radius = '20px';
                    visible = rect.width > 0 && rect.height > 0;
                } else {
                    visible = false;
                }

                const posKey = [
                    visible ? 1 : 0,
                    Math.round(rect?.top || 0),
                    Math.round(rect?.left || 0),
                    Math.round(rect?.width || 0),
                    Math.round(rect?.height || 0),
                    radius,
                    titleH,
                    radarLayoutMode
                ].join('|');
                if (!force && posKey === lastPosKey) return;
                lastPosKey = posKey;

                if (!visible || !rect) {
                    single.style.opacity = '0';
                    single.style.pointerEvents = 'none';
                    if (titleBar) titleBar.classList.remove('active');
                } else {
                    single.style.top = rect.top + 'px';
                    single.style.left = rect.left + 'px';
                    single.style.width = rect.width + 'px';
                    single.style.height = rect.height + 'px';
                    single.style.borderRadius = radius;
                    single.style.opacity = '1';
                    single.style.pointerEvents = 'auto';
                    if (titleBar) {
                        if (titleH > 0) {
                            titleBar.classList.add('active');
                            titleBar.style.top = rect.top + 'px';
                            titleBar.style.left = rect.left + 'px';
                            titleBar.style.width = rect.width + 'px';
                            titleBar.style.height = titleH + 'px';
                        } else {
                            titleBar.classList.remove('active');
                        }
                    }
                }

                if (radarLayoutMode === 'two-videos') {
                    const zone = document.getElementById('slides-zone');
                    if (zone && secondVideoUrl) {
                        const r2 = zone.getBoundingClientRect();
                        if (r2.width > 0 && r2.height > 0) {
                            second.style.top = r2.top + 'px';
                            second.style.left = r2.left + 'px';
                            second.style.width = r2.width + 'px';
                            second.style.height = r2.height + 'px';
                            second.style.borderRadius = '28px';
                            second.style.opacity = '1';
                            second.style.pointerEvents = 'auto';
                        } else {
                            second.style.opacity = '0';
                        }
                    } else {
                        second.style.opacity = '0';
                    }
                } else {
                    second.style.opacity = '0';
                    second.style.pointerEvents = 'none';
                }
            }

            setInterval(() => { repositionPlayers(false); }, 250);
            window.addEventListener('resize', () => repositionPlayers(true));

            function aplicarSidebarHidden(hidden) {
                sidebarHidden = hidden;
                document.getElementById('mainGrid').classList.toggle('sidebar-hidden', hidden);
                document.getElementById('topToggleIcon').className = hidden ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
                document.getElementById('sidebarTopToggle').classList.toggle('hidden-sidebar', hidden);
                setTimeout(() => repositionPlayers(true), 50);
            }

            function irParaSlide(idx) {
                lastSlideAdvanceTime = Date.now();

                const slidesEl = document.querySelectorAll('.slide');
                if (!slidesEl.length) return;
                idx = Math.min(Math.max(0, idx), slidesEl.length - 1);
                slidesEl.forEach(s => { s.classList.remove('active'); s.className = 'slide'; });
                document.querySelectorAll('.dot-indicator').forEach(d => d.classList.remove('active'));
                const slideEl = slidesEl[idx];
                slideEl.classList.add('active');
                document.querySelector(`.dot-indicator[data-index="${idx}"]`)?.classList.add('active');
                currentSlideIndex = idx;
                const s = visibleSlides[idx];
                const body = document.body;
                const bottombar = document.getElementById('bottombar');
                const watermark = document.getElementById('watermark');

                const isFullscreen = s && (s.type === 'canva' || s.type === 'campanha_reta_final');
                if (isFullscreen) {
                    body.classList.add('canva-fullscreen');
                    bottombar.classList.add('canva-active');
                    watermark.classList.add('active');
                } else {
                    body.classList.remove('canva-fullscreen');
                    bottombar.classList.remove('canva-active');
                    watermark.classList.remove('active');
                }

                if (s && s.type === 'relogio') bottombar.classList.add('relogio-active');
                else bottombar.classList.remove('relogio-active');

                if (s?.type === 'aniversariante_dia' && radarConfetti) dispararConfetes();
                if (s?.type === 'relogio') atualizarTodosRelogios();

                const shouldHide = !!(s && hideSidebarForSlides[s.type] === true);
                if (shouldHide) {
                    if (!sidebarHidden) {
                        sidebarHiddenAuto = true;
                        aplicarSidebarHidden(true);
                    }
                } else {
                    if (sidebarHiddenAuto) {
                        sidebarHiddenAuto = false;
                        aplicarSidebarHidden(false);
                    }
                }

                if (s?.type === 'noticias_rss') {
                    const staleMs = 4 * 60 * 1000;
                    const precisaAtualizar = !noticiasRss.length || (Date.now() - lastNewsFetch > staleMs);
                    if (precisaAtualizar) {
                        buscarNoticiasRss().then(() => {
                            setTimeout(() => {
                                if (noticiasRss.length) {
                                    const start = Math.floor(Math.random() * noticiasRss.length);
                                    atualizarNoticiaCarrossel(start);
                                }
                                iniciarCarrosselNoticias();
                            }, 300);
                        });
                    } else {
                        if (noticiasRss.length > 4) {
                            const corte = Math.max(4, Math.ceil(noticiasRss.length * 0.6));
                            const topo = shuffleArray(noticiasRss.slice(0, corte));
                            noticiasRss = topo.concat(noticiasRss.slice(corte));
                        }
                        setTimeout(() => {
                            if (noticiasRss.length) {
                                const start = Math.floor(Math.random() * Math.min(4, noticiasRss.length));
                                atualizarNoticiaCarrossel(start);
                            }
                            iniciarCarrosselNoticias();
                        }, 300);
                    }
                } else {
                    pararCarrosselNoticias();
                }

                if (s?.type === 'dolar') {
                    dolarSlideActive = true;
                    const wrapper = slideEl.querySelector('.dolar-grafico-wrapper');
                    if (wrapper) {
                        const oldCanvas = wrapper.querySelector('canvas');
                        if (oldCanvas) oldCanvas.remove();
                        const newCanvas = document.createElement('canvas');
                        newCanvas.id = 'chartDolarCanvas';
                        wrapper.appendChild(newCanvas);
                    }
                    setTimeout(() => carregarSlideDolar(), 80);
                } else {
                    dolarSlideActive = false;
                    if (chartDolar) { chartDolar.destroy(); chartDolar = null; }
                }

                if (s?.type === 'noticias_rss' || s?.type === 'dolar') {
                    document.body.classList.add('news-dark');
                } else {
                    document.body.classList.remove('news-dark');
                }

                if (s?.type === 'dolar') {
                    document.body.classList.add('dolar-slide-active');
                } else {
                    document.body.classList.remove('dolar-slide-active');
                }

                if (s?.type === 'campanha_reta_final' && s.campanhaInfo) {
                    setTimeout(() => iniciarSequenciaCampanha(s.campanhaInfo), 350);
                } else {
                    if (campanhaCountdownInterval) { clearInterval(campanhaCountdownInterval); campanhaCountdownInterval = null; }
                    if (campanhaAnimTimeout) { clearTimeout(campanhaAnimTimeout); campanhaAnimTimeout = null; }
                    ringAnimRunning = false;
                }

                document.querySelectorAll('.slide.weather-active').forEach(el => el.classList.remove('weather-active'));
                if (s?.type === 'previsao_tempo') {
                    slideEl.classList.add('weather-active');
                }
            }

            function proximoSlide() { if (visibleSlides.length) irParaSlide((currentSlideIndex + 1) % visibleSlides.length); }
            function slideAnterior() { if (visibleSlides.length) irParaSlide((currentSlideIndex - 1 + visibleSlides.length) % visibleSlides.length); }

            function iniciarTimer() {
                if (slideTimer) clearTimeout(slideTimer);
                if (!visibleSlides.length) return;
                const s = visibleSlides[currentSlideIndex];
                const dur = getDurationForSlide(s);

                slideTimer = setTimeout(() => {
                    if (!paused) {
                        try { proximoSlide(); } catch (e) {}
                        lastSlideAdvanceTime = Date.now();
                    }
                    iniciarTimer();
                }, dur);
            }

            function resetarTimer() {
                if (slideTimer) clearTimeout(slideTimer);
                lastSlideAdvanceTime = Date.now();
                iniciarTimer();
            }

            setInterval(() => {
                if (paused) return;
                const elapsed = Date.now() - lastSlideAdvanceTime;
                if (elapsed > 180000) {
                    try { proximoSlide(); } catch (e) {}
                    lastSlideAdvanceTime = Date.now();
                    resetarTimer();
                }
            }, 15000);

            function dispararConfetes() {
                if (!radarConfetti) return;
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 80, spread: 65, origin: { y: 0.6 } });
                }
            }

            function carregarRadio(index) {
                const radio = RADIOS[index];
                if (!radio) return;
                document.getElementById('radio-box').innerHTML = radio.iframe;
                currentRadioIndex = index;
                Store.set('radioIndex', index);
                document.querySelectorAll('#radioSelector button').forEach(b => b.classList.toggle('active-radio', parseInt(b.dataset.radio, 10) === index));
            }
            function proximaRadio() { carregarRadio((currentRadioIndex + 1) % RADIOS.length); }
            function iniciarRadioRotacao() {
                const saved = parseInt(Store.get('radioIndex', 0), 10) || 0;
                carregarRadio(saved);
                radioTimer = setInterval(proximaRadio, CONFIG.radioInterval);
                document.querySelectorAll('#radioSelector button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        carregarRadio(parseInt(this.dataset.radio, 10));
                        clearInterval(radioTimer);
                        radioTimer = setInterval(proximaRadio, CONFIG.radioInterval);
                        document.getElementById('radioSelector').classList.remove('active');
                    });
                });
            }

            function toggleSidebar() {
                sidebarHiddenAuto = false;
                aplicarSidebarHidden(!sidebarHidden);
                Store.set('sidebarHidden', String(sidebarHidden));
            }
            function carregarSidebarState() {
                const saved = Store.get('sidebarHidden', null);
                if (saved !== null) {
                    sidebarHidden = saved === true || saved === 'true';
                    document.getElementById('mainGrid').classList.toggle('sidebar-hidden', sidebarHidden);
                    document.getElementById('topToggleIcon').className = sidebarHidden ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
                    document.getElementById('sidebarTopToggle').classList.toggle('hidden-sidebar', sidebarHidden);
                }
            }

            let pontoAtivo = false, pontoFechamentoTimer = null;

            function verificarLembretePonto() {
                if (!radarPontoEnabled) return;
                const agora = getHoraSincronizada();
                const totalMin = agora.getHours() * 60 + agora.getMinutes();
                const horas = Array.isArray(radarPontoHours) ? radarPontoHours : ['08:00', '17:45'];
                let alvo = null;
                for (const h of horas) {
                    const parts = String(h).split(':');
                    if (parts.length !== 2) continue;
                    const hh = parseInt(parts[0], 10);
                    const mm = parseInt(parts[1], 10);
                    const alvoMin = hh * 60 + mm;
                    if (alvoMin - totalMin >= -1 && alvoMin - totalMin <= 3) { alvo = { h: hh, m: mm }; break; }
                }
                if (alvo && !pontoAtivo) {
                    const hoje = agora.toDateString();
                    const chave = `ponto_${alvo.h}_${alvo.m}_${hoje}`;
                    if (Store.get(chave, null) === 'exibido') return;
                    pontoAtivo = true;
                    document.getElementById('pontoTitulo').textContent = 'Não Esqueça de Bater o Ponto';
                    document.getElementById('pontoOverlay').classList.add('active');
                    let seg = radarPontoDuration;
                    atualizarTempoRestante(seg);
                    if (pontoFechamentoTimer) clearInterval(pontoFechamentoTimer);
                    pontoFechamentoTimer = setInterval(() => {
                        seg--;
                        atualizarTempoRestante(seg);
                        if (seg <= 0) {
                            clearInterval(pontoFechamentoTimer);
                            pontoFechamentoTimer = null;
                            desativarPonto();
                        }
                    }, 1000);
                    Store.set(chave, 'exibido');
                }
            }
            function atualizarTempoRestante(s) {
                const el = document.getElementById('pontoTempoRestante');
                if (!el) return;
                if (s > 0) {
                    const m = Math.floor(s / 60), sec = s % 60;
                    el.textContent = `${m}:${String(sec).padStart(2, '0')} min`;
                } else el.textContent = 'Fechando...';
            }
            function desativarPonto() {
                pontoAtivo = false;
                document.getElementById('pontoOverlay').classList.remove('active');
                if (pontoFechamentoTimer) { clearInterval(pontoFechamentoTimer); pontoFechamentoTimer = null; }
            }
            setInterval(verificarLembretePonto, 10000);
            setTimeout(verificarLembretePonto, 1500);
            function limparRegistrosPontoAntigos() {
                const hoje = new Date().toDateString();
                Object.keys(localStorage).filter(k => k.startsWith('ponto_') && !k.includes(hoje)).forEach(k => localStorage.removeItem(k));
            }
            limparRegistrosPontoAntigos();

            let controlWindow = null;
            function openControlPanel() {
                if (controlWindow && !controlWindow.closed) {
                    try { controlWindow.focus(); } catch(e) {}
                    return;
                }
                const w = 500;
                const h = Math.min(900, screen.availHeight - 80);
                const left = Math.max(0, (screen.availWidth - w) / 2);
                const top = Math.max(0, (screen.availHeight - h) / 2);
                controlWindow = window.open(
                    'controle.html',
                    'radarControl',
                    `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes,menubar=no,toolbar=no,location=no,status=no`
                );
            }

            function handleRadarCommand(action) {
                switch (action) {
                    case 'nextSlide': proximoSlide(); resetarTimer(); break;
                    case 'prevSlide': slideAnterior(); resetarTimer(); break;
                    case 'togglePause':
                        paused = !paused;
                        const pb = document.getElementById('pause-slide-btn');
                        if (pb) pb.innerHTML = paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
                        break;
                    case 'refreshNews':
                        buscarNoticiasRss().then(() => {
                            if (noticiasRss.length) {
                                const start = Math.floor(Math.random() * noticiasRss.length);
                                atualizarNoticiaCarrossel(start);
                            }
                            iniciarCarrosselNoticias();
                        });
                        break;
                    case 'refreshDolar': buscarCotacaoDolar(); break;
                    case 'refreshWeather': buscarClima(); break;
                    case 'reloadData':
                        carregarDadosPlanilha().then(() => {
                            construirSlides();
                            rebuildSlides();
                        });
                        break;
                }
            }

            window.addEventListener('storage', function(e) {
                if (!e.key) return;

                if (e.key === 'radarCommand' && e.newValue) {
                    try { handleRadarCommand(JSON.parse(e.newValue).action); } catch(err) {}
                    return;
                }

                switch (e.key) {
                    case 'playerUrl':
                        playerUrl = e.newValue || DEFAULT_PLAYER_URL;
                        aplicarPlayerUrl();
                        break;
                    case 'showRadio':
                        showRadio = e.newValue !== 'false';
                        aplicarShowRadio();
                        break;
                    case 'hideSidebarForSlides': {
                        try { hideSidebarForSlides = JSON.parse(e.newValue || '{}'); } catch(err) { hideSidebarForSlides = {}; }
                        const s = visibleSlides[currentSlideIndex];
                        const shouldHide = !!(s && hideSidebarForSlides[s.type] === true);
                        if (shouldHide && !sidebarHidden) {
                            sidebarHiddenAuto = true;
                            aplicarSidebarHidden(true);
                        } else if (!shouldHide && sidebarHiddenAuto) {
                            sidebarHiddenAuto = false;
                            aplicarSidebarHidden(false);
                        }
                        break;
                    }
                    case 'slideDurations':
                        try { slideDurations = JSON.parse(e.newValue || '{}'); } catch(err) { slideDurations = {}; }
                        Object.keys(DEFAULT_DURATIONS).forEach(k => {
                            if (typeof slideDurations[k] !== 'number' || slideDurations[k] < 3) slideDurations[k] = DEFAULT_DURATIONS[k];
                        });
                        resetarTimer();
                        break;
                    case 'slideVisibility':
                        try { slideVisibility = JSON.parse(e.newValue || '{}'); } catch(err) { slideVisibility = {}; }
                        rebuildSlides();
                        break;
                    case 'darkModeGlobal':
                        darkModeEnabled = e.newValue === 'true';
                        if (radarTheme === 'dark') document.body.classList.toggle('dark-mode', darkModeEnabled);
                        break;
                    case 'manualOffsetHours':
                        manualOffsetHours = parseFloat(e.newValue) || 0;
                        if (manualOffsetHours !== 0) horaExataDefinida = null;
                        atualizarTodosRelogios();
                        break;
                    case 'exactTimeISO':
                    case 'exactTimeFixadoEm': {
                        const iso = Store.get('exactTimeISO', '');
                        const fix = Store.get('exactTimeFixadoEm', '');
                        horaExataDefinida = (iso && fix) ? new Date(iso) : null;
                        if (horaExataDefinida) manualOffsetHours = 0;
                        atualizarTodosRelogios();
                        break;
                    }
                    case 'radioIndex':
                        carregarRadio(parseInt(e.newValue, 10) || 0);
                        break;
                    case 'radarSecondVideoUrl':
                        secondVideoUrl = e.newValue || '';
                        {
                            const sp = document.getElementById('second-player');
                            if (sp && secondVideoUrl && sp.src !== secondVideoUrl) sp.src = secondVideoUrl;
                            setTimeout(() => repositionPlayers(true), 60);
                        }
                        break;

                    case 'radarTheme':
                        radarTheme = e.newValue || 'dark';
                        applyRadarSettings();
                        break;
                    case 'radarBgType':
                        radarBgType = e.newValue || 'gradient';
                        applyRadarSettings();
                        break;
                    case 'radarBgColor':
                        radarBgColor = e.newValue || '#0a1929';
                        applyRadarSettings();
                        break;
                    case 'radarBgImage':
                        radarBgImage = e.newValue || '';
                        applyRadarSettings();
                        break;
                    case 'radarBgBlur':
                        radarBgBlur = e.newValue || '0';
                        applyRadarSettings();
                        break;
                    case 'radarBgBrightness':
                        radarBgBrightness = e.newValue || '100';
                        applyRadarSettings();
                        break;
                    case 'radarAccentColor':
                        radarAccent = e.newValue || '#38bdf8';
                        applyRadarSettings();
                        break;
                    case 'radarSidebarPosition':
                        radarSidebarPos = e.newValue || 'right';
                        applyRadarSettings();
                        break;
                    case 'radarSidebarWidth':
                        radarSidebarWidth = e.newValue || '50';
                        applyRadarSettings();
                        break;
                    case 'radarLayoutMode':
                        radarLayoutMode = e.newValue || 'slide-video';
                        applyRadarSettings();
                        break;
                    case 'radarSecondSlideType':
                        radarSecondSlideType = e.newValue || '';
                        renderSecondSlidePane();
                        break;
                    case 'radarNewsFontSize':
                        radarNewsFont = e.newValue || '44';
                        applyRadarSettings();
                        break;
                    case 'radarClockFontSize':
                        radarClockFont = e.newValue || '120';
                        applyRadarSettings();
                        break;
                    case 'radarTitleFontSize':
                        radarTitleFont = e.newValue || '44';
                        applyRadarSettings();
                        break;
                    case 'radarSlideTransition':
                        radarTransition = e.newValue || 'fade';
                        applyRadarSettings();
                        break;
                    case 'radarAnimationLevel':
                        radarAnimation = e.newValue || 'full';
                        applyRadarSettings();
                        break;
                    case 'radarDolarAnimated':
                        radarDolarAnimated = e.newValue !== 'false';
                        if (dolarSlideActive) setTimeout(() => carregarSlideDolar(), 100);
                        break;
                    case 'radarNumbersAnimated':
                        radarNumbersAnimated = e.newValue !== 'false';
                        break;
                    case 'radarConfetti':
                        radarConfetti = e.newValue !== 'false';
                        break;
                    case 'radarPontoEnabled':
                        radarPontoEnabled = e.newValue !== 'false';
                        if (!radarPontoEnabled && pontoAtivo) desativarPonto();
                        break;
                    case 'radarPontoHours':
                        try { radarPontoHours = JSON.parse(e.newValue || '[]'); } catch(err) { radarPontoHours = []; }
                        break;
                    case 'radarPontoDuration':
                        radarPontoDuration = parseInt(e.newValue, 10) || 120;
                        break;
                    case 'radarRefreshNewsMin':
                        radarRefreshNews = parseInt(e.newValue, 10) || 5;
                        restartInterval('news');
                        break;
                    case 'radarRefreshDolarMin':
                        radarRefreshDolar = parseInt(e.newValue, 10) || 5;
                        restartInterval('dolar');
                        break;
                    case 'radarRefreshWeatherMin':
                        radarRefreshWeather = parseInt(e.newValue, 10) || 15;
                        restartInterval('weather');
                        break;
                }
            });

            let intervalNews = null, intervalDolar = null, intervalWeather = null;

            function restartInterval(which) {
                if (which === 'news') {
                    if (intervalNews) clearInterval(intervalNews);
                    intervalNews = setInterval(buscarNoticiasRss, Math.max(1, radarRefreshNews) * 60 * 1000);
                } else if (which === 'dolar') {
                    if (intervalDolar) clearInterval(intervalDolar);
                    intervalDolar = setInterval(buscarCotacaoDolar, Math.max(1, radarRefreshDolar) * 60 * 1000);
                } else if (which === 'weather') {
                    if (intervalWeather) clearInterval(intervalWeather);
                    intervalWeather = setInterval(buscarClima, Math.max(1, radarRefreshWeather) * 60 * 1000);
                }
            }

            async function carregarDadosPlanilha() {
                try {
                    const [cadastro, campanhas] = await Promise.all([
                        fetch(BASES.cadastro).then(r => r.json()).catch(() => []),
                        fetch(BASES.campanhas).then(r => r.json()).catch(() => [])
                    ]);
                    cadastros = cadastro;
                    campanhasData = campanhas || [];
                } catch (e) {}
            }

            async function init() {
                applyRadarSettings();
                carregarSidebarState();

                document.getElementById('sidebarTopToggle').addEventListener('click', toggleSidebar);
                document.getElementById('menuToggle').addEventListener('click', function(e) {
                    e.preventDefault();
                    openControlPanel();
                });
                document.getElementById('canvaMenuBtn').addEventListener('click', function(e) {
                    e.preventDefault();
                    openControlPanel();
                });

                if (radarTheme === 'dark') {
                    const savedDark = Store.get('darkModeGlobal', null);
                    if (savedDark !== null) darkModeEnabled = savedDark === 'true';
                    else darkModeEnabled = true;
                    document.body.classList.toggle('dark-mode', darkModeEnabled);
                }

                const savedOffset = Store.get('manualOffsetHours', 0);
                if (savedOffset) manualOffsetHours = parseFloat(savedOffset) || 0;
                const savedExactISO = Store.get('exactTimeISO', '');
                const savedFixadoEm = Store.get('exactTimeFixadoEm', '');
                if (savedExactISO && savedFixadoEm) horaExataDefinida = new Date(savedExactISO);

                aplicarPlayerUrl();
                const sp = document.getElementById('second-player');
                if (sp && secondVideoUrl) sp.src = secondVideoUrl;
                aplicarShowRadio();

                await carregarDadosPlanilha();
                construirSlides();
                rebuildSlides();
                iniciarRadioRotacao();

                document.getElementById('loading-overlay').classList.add('hidden');

                document.getElementById('prev-slide-btn').addEventListener('click', () => { slideAnterior(); resetarTimer(); });
                document.getElementById('next-slide-btn').addEventListener('click', () => { proximoSlide(); resetarTimer(); });
                const pauseBtn = document.getElementById('pause-slide-btn');
                pauseBtn.addEventListener('click', () => {
                    paused = !paused;
                    pauseBtn.innerHTML = paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
                });

                const radioBtn = document.getElementById('radioFloatingBtn');
                const radioSelector = document.getElementById('radioSelector');
                radioBtn.addEventListener('click', (e) => { e.stopPropagation(); radioSelector.classList.toggle('active'); });
                document.addEventListener('click', (e) => {
                    if (!radioSelector.contains(e.target) && e.target !== radioBtn) radioSelector.classList.remove('active');
                });

                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'r') {
                        e.preventDefault();
                        radioBtn.click();
                    }
                    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
                        e.preventDefault();
                        openControlPanel();
                    }
                });

                setTimeout(() => repositionPlayers(true), 100);
                setTimeout(() => repositionPlayers(true), 500);
                setTimeout(() => repositionPlayers(true), 1200);

                Store.set('radarHeartbeat', String(Date.now()));
                setInterval(() => Store.set('radarHeartbeat', String(Date.now())), 5000);

                await buscarNoticiasRss();
                restartInterval('news');
                restartInterval('dolar');
                restartInterval('weather');

                setTimeout(buscarCotacaoDolar, 400);
                setTimeout(buscarClima, 600);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
